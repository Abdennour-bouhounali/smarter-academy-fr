<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سمارتر أكاديمي — الكسور (السادس)</title>
<meta name="description" content="درس تفاعلي: بناء الكسور وقراءتها ووضعها على المستقيم والحساب بها. ورشة رياضيات من سمارتر أكاديمي.">
<style>
/* =========================================================================
   SMARTER ACADEMY — ATELIER DES FRACTIONS  ·  6e
   Direction : cahier à petits carreaux, couleurs franches et claires,
   gros boutons, récompenses animées. Séance calibrée pour 45 minutes.
   Code couleur SÉMANTIQUE, identique dans toute la leçon :
     bleu   = dénominateur (en combien de parts on partage)
     orange = numérateur   (combien de parts on prend)
     violet = instrument   (ce que l'élève manipule)
     vert = réussite · rouge = à corriger · jaune = coup de pouce · rose = à retenir
   ========================================================================= */
:root{
  --bg:#F3F7FF;
  --grid:#DDE8FA;
  --surface:#FFFFFF;
  --surface-2:#EFF4FE;
  --line:#DCE6F7;
  --ink:#1E2A46;
  --muted:#68789B;

  --c-unit:#8497BC;
  --c-den:#22A7F0;      --c-den-dark:#0D82C4;  --c-den-soft:#E3F4FE;
  --c-num:#FF8A3D;      --c-num-dark:#DB6414;  --c-num-soft:#FFEEDF;
  --c-accent:#8B5CF6;   --c-accent-dark:#6C34E0; --c-accent-soft:#F0EAFE;
  --c-ok:#25C36A;       --c-ok-dark:#149B50;   --c-ok-soft:#E1F8EC;
  --c-err:#F0555F;      --c-err-soft:#FDE7E9;
  --c-guide:#FFB627;    --c-guide-soft:#FFF4DC;
  --c-retain:#FF62A5;   --c-retain-soft:#FFEAF3;

  --font-ui:"Tajawal","Cairo","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-math:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,monospace;

  /* rayons */      --r-xs:10px; --r-s:12px; --r:16px; --r-lg:26px; --r-pill:999px;
  /* cible tactile */ --tap:48px;
  /* typographie */  --fs-hero:clamp(32px,6.5vw,54px); --fs-h1:clamp(21px,3.6vw,28px);
                     --fs-h2:19px; --fs-h3:15.5px; --fs-body:15.5px; --fs-small:13.5px;
                     --fs-micro:11.5px; --fs-math:clamp(21px,5.5vw,26px);
  /* mouvement */    --t-fast:120ms; --t-slow:400ms; --t-pop:520ms;
                     --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 10px 24px -14px rgba(30,42,70,.35);
  --dur:200ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* cahier à petits carreaux */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;opacity:.75;
}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ============================ BARRE HAUTE ============================ */
.sa-top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:9px clamp(10px,3vw,24px);background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:2px solid var(--line);
}
.sa-brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.sa-logo{
  width:38px;height:38px;border-radius:var(--r-s);flex:0 0 auto;
  background:linear-gradient(150deg,var(--c-den),var(--c-accent));
  display:grid;place-items:center;color:#fff;font-weight:800;
  font-family:var(--font-math);font-size:16px;box-shadow:0 3px 0 var(--c-accent-dark);
}
.sa-brand b{font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.sa-brand small{display:block;font-size:11px;color:var(--muted)}
.sa-track{flex:1 1 auto;min-width:60px}
.sa-track .bar{height:14px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:2px solid var(--line)}
.sa-track .fill{
  height:100%;width:0;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--c-ok),#7BE495);
  transition:width 600ms var(--ease-pop);
}
.sa-track .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.sa-chip{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-pill);padding:5px 12px;
  font-family:var(--font-math);font-size:14px;font-weight:800;
}
.sa-chip.xp{color:var(--c-guide);border-color:#FFE3A8;background:var(--c-guide-soft)}
.sa-chip.streak{color:#FF6B35;border-color:#FFD6C2;background:#FFF0E8}
.sa-chip.time{color:var(--muted)}
.sa-chip.pulse{animation:chip 500ms var(--ease-pop)}
@keyframes chip{40%{transform:scale(1.22) rotate(-3deg)}}
.sa-icon-btn{
  flex:0 0 auto;min-height:40px;padding:0 13px;border-radius:var(--r-s);background:var(--surface);
  border:2px solid var(--line);border-bottom-width:4px;cursor:pointer;font-size:14px;font-weight:800;
}
.sa-icon-btn:hover{border-color:var(--c-accent)}
.sa-icon-btn:active{transform:translateY(2px);border-bottom-width:2px}

/* ============================ L'ARCHIPEL ============================ */
.sa-sea{
  position:relative;margin-top:22px;padding:18px 8px 26px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,#E8F6FF,#DCEEFF 60%,#E9F7EE);
  border:3px solid #BFE3F7;overflow:hidden;
}
.sa-sea::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),
                   radial-gradient(circle at 78% 42%,rgba(255,255,255,.9) 0 2px,transparent 3px),
                   radial-gradient(circle at 34% 74%,rgba(255,255,255,.9) 0 2px,transparent 3px);
}
.sa-path{position:relative;width:100%;max-width:520px;margin:0 auto}
.sa-path > svg{display:block;width:100%;height:auto}
.sa-island{
  --disc:clamp(66px,17vw,86px);
  position:absolute;display:flex;align-items:center;gap:12px;
  transform:translate(calc(var(--disc) / -2),-50%);
  width:max-content;max-width:min(62vw,268px);
  background:none;border:0;padding:0;cursor:pointer;z-index:2;text-align:left;
}
.sa-island .disc{
  width:var(--disc);height:var(--disc);border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-size:clamp(26px,7.5vw,36px);
  background:#fff;border:4px solid var(--line);box-shadow:0 5px 0 rgba(30,42,70,.14);
  transition:transform var(--t),box-shadow var(--t);
}
.sa-island .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.sa-island .nm{
  font-size:clamp(12.5px,3.9vw,18px);font-weight:800;line-height:1.15;
  background:rgba(255,255,255,.92);border-radius:var(--r-xs);padding:5px 9px;
  box-shadow:0 2px 0 rgba(30,42,70,.06);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;
}
.sa-island .mn{font-size:12.5px;color:var(--muted);font-weight:700;padding-left:3px}
.sa-island:hover .disc{transform:translateY(-4px) scale(1.05)}
.sa-island:active .disc{transform:translateY(2px);box-shadow:0 2px 0 rgba(30,42,70,.14)}
.sa-island[data-state="done"] .disc,.sa-island[data-state="master"] .disc{border-color:var(--c-ok);background:var(--c-ok-soft)}
.sa-island[data-state="doing"] .disc{border-color:var(--c-guide);animation:bob 1600ms ease-in-out infinite}
.sa-island.here .disc{border-color:var(--c-accent);box-shadow:0 5px 0 var(--c-accent-dark),0 0 0 6px rgba(139,92,246,.16)}
.sa-island.here .nm{background:#fff;box-shadow:0 2px 0 var(--c-accent-dark)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sa-boat{position:absolute;transform:translate(-50%,-50%);font-size:clamp(34px,9vw,46px);z-index:3;
  filter:drop-shadow(0 3px 2px rgba(30,42,70,.18));animation:bob 2200ms ease-in-out infinite}
.sa-legend-arcs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.sa-legend-arcs span{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);
  background:#fff;border:2px solid var(--line);border-radius:var(--r-pill);padding:5px 12px;
}
.sa-legend-arcs i{width:12px;height:12px;border-radius:50%;display:block}

/* --- étapes empilées : tout le module reste lisible --- */
.sa-flow{display:flex;flex-direction:column;gap:14px}
.sa-panel.past{opacity:.72;pointer-events:none;border-style:dashed}
.sa-panel.past .sa-rail,.sa-panel.past .sa-actions{opacity:.5}
.sa-stepdone{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 15px;border-radius:var(--r-pill);
  background:var(--c-ok-soft);border:2px solid var(--c-ok);color:var(--c-ok-dark);font-weight:800;font-size:14px;
}
.sa-key{
  margin-top:16px;padding:20px;border-radius:var(--r-lg);text-align:center;
  background:linear-gradient(135deg,#FFF0F7,#F0EAFE);border:3px solid var(--c-retain);
}
.sa-key .lbl{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#D6337A}
.sa-key .ph{font-size:clamp(18px,4.6vw,24px);font-weight:800;margin-top:8px;line-height:1.25}
.sa-key .flow{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px;
  font-weight:800;font-size:14px;
}
.sa-key .flow span{background:#fff;border:2px solid var(--line);border-radius:var(--r-pill);padding:6px 13px}
.sa-key .flow i{color:var(--c-accent);font-style:normal;font-weight:900}
.sa-eight{counter-reset:pt;display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sa-eight li{
  list-style:none;position:relative;padding:12px 14px 12px 46px;border-radius:var(--r);
  background:#fff;border:2px solid var(--line);font-size:15px;line-height:1.4;
}
.sa-eight li::before{
  counter-increment:pt;content:counter(pt);position:absolute;left:12px;top:11px;
  width:24px;height:24px;border-radius:50%;background:var(--c-accent);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;
}
.sa-sheet-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;
  border-radius:var(--r);background:var(--surface-2);border:2px solid var(--line);
}
.sa-sheet-head .ttl{font-weight:800;font-size:15px}
.sa-sheet-head .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.sa-sheet-head .acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.sa-sec{margin-top:16px}
.sa-sec > h4{
  margin:0 0 9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
  color:var(--c-accent-dark);display:flex;align-items:center;gap:8px;
}
.sa-sec > h4::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.sa-pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:8px;counter-reset:pt}
.sa-pts li{
  list-style:none;position:relative;padding:9px 11px 9px 38px;border-radius:var(--r-s);
  background:#fff;border:2px solid var(--line);font-size:14px;line-height:1.35;
}
.sa-pts li::before{
  counter-increment:pt;content:counter(pt);position:absolute;left:9px;top:9px;
  width:21px;height:21px;border-radius:50%;background:var(--c-accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;
}
.sa-mrow{
  display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.4fr) minmax(120px,.9fr);gap:10px;
  padding:9px 11px;border-radius:var(--r-s);background:#fff;border:2px solid var(--line);margin-bottom:7px;
  font-size:13.5px;align-items:center;
}
.sa-mrow .n{font-weight:800}
.sa-mrow .ex{font-family:var(--font-math);font-weight:800;color:var(--c-ok-dark);background:var(--c-ok-soft);
  border-radius:var(--r-xs);padding:5px 9px;text-align:center}
.sa-trow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 11px;border-radius:var(--r-s);
  background:#fff;border:2px solid #F9BFC3;margin-bottom:7px;font-size:13.5px;
}
.sa-trow .no{font-family:var(--font-math);font-weight:800;color:#B32530;text-decoration:line-through}
.sa-trow .yes{font-family:var(--font-math);font-weight:800;color:var(--c-ok-dark)}
.sa-trow .wy{color:var(--muted);flex:1 1 180px}
.sa-autos{display:flex;flex-wrap:wrap;gap:8px}
.sa-autos span{
  font-family:var(--font-math);font-weight:800;font-size:14.5px;background:#fff;
  border:2px solid var(--line);border-radius:var(--r-pill);padding:7px 13px;
}
.sa-recap{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.sa-recap h4{margin:14px 0 0}
.sa-recap .sa-retain{margin-top:0}
.sa-recap h4{
  margin:6px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-accent-dark);font-weight:800;
}

/* ============================ CARTE DU PARCOURS ============================ */
.sa-wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:clamp(14px,4vw,34px) clamp(12px,3vw,24px) 80px}
.sa-hero{padding:clamp(10px,4vw,30px) 0 20px}
.sa-eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-den-dark);font-weight:800;margin-bottom:12px;
  background:var(--c-den-soft);padding:6px 12px;border-radius:var(--r-pill);
}
.sa-hero h1{font-size:clamp(32px,6.5vw,54px);line-height:1.05;font-weight:800;letter-spacing:-.02em;max-width:15ch}
.sa-hero h1 em{font-style:normal;color:var(--c-num)}
.sa-hero p{color:var(--muted);max-width:52ch;margin-top:12px;font-size:clamp(15px,2vw,18px)}
.sa-heroart{margin-top:20px}
.sa-goals{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;max-width:760px}
.sa-goals li{
  display:flex;align-items:flex-start;gap:9px;font-size:14.5px;font-weight:700;line-height:1.35;
  background:#fff;border:2px solid var(--line);border-radius:var(--r-s);padding:9px 12px;
}
.sa-goals li .ck{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;background:var(--c-ok-soft);border:2px solid var(--c-ok);
  color:var(--c-ok-dark);display:grid;place-items:center;font-size:12px;font-weight:900;margin-top:1px;
}

.sa-arc{margin-top:28px}
.sa-arc-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sa-arc-h .n{
  font-family:var(--font-math);font-size:12px;color:#fff;background:var(--c-accent);
  padding:3px 9px;border-radius:var(--r-pill);font-weight:800;
}
.sa-arc-h h2{font-size:19px;font-weight:800}
.sa-arc-h span{font-size:13px;color:var(--muted)}
.sa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sa-mod{
  position:relative;text-align:left;cursor:pointer;background:var(--surface);
  border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r-lg);
  padding:15px;min-height:126px;display:flex;flex-direction:column;gap:5px;
  transition:transform var(--dur),border-color var(--dur);
}
.sa-mod:hover{transform:translateY(-3px);border-color:var(--c-accent)}
.sa-mod:active{transform:translateY(1px);border-bottom-width:3px}
.sa-mod .id{font-family:var(--font-math);font-size:11px;color:var(--muted);letter-spacing:.06em}
.sa-mod .t{font-size:16.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa-mod .d{font-size:13px;color:var(--muted);line-height:1.35}
.sa-mod .state{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.sa-mod .state i{width:9px;height:9px;border-radius:var(--r-pill);background:var(--line);font-style:normal}
.sa-mod .mins{margin-left:auto;font-weight:700;color:var(--muted)}
.sa-mod[data-state="done"]{border-color:#B9EBCF}
.sa-mod[data-state="done"] .state{color:var(--c-ok-dark)}
.sa-mod[data-state="done"] .state i{background:var(--c-ok)}
.sa-mod[data-state="doing"] .state{color:#D28A00}
.sa-mod[data-state="doing"] .state i{background:var(--c-guide)}
.sa-mod[data-state="master"]{border-color:var(--c-ok);background:var(--c-ok-soft)}
.sa-mod[data-state="master"] .state{color:var(--c-ok-dark)}
.sa-mod[data-state="master"] .state i{background:var(--c-ok)}

/* ============================ ATELIER ============================ */
.sa-stage{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:clamp(12px,3vw,22px) clamp(10px,3vw,24px) 110px}
.sa-crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.sa-crumb b{color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw;display:inline-block;vertical-align:bottom}
.sa-steps{display:flex;gap:5px;margin-left:auto}
.sa-steps i{width:26px;height:7px;border-radius:var(--r-xs);background:var(--line);display:block}
.sa-steps i.on{background:var(--c-accent)}
.sa-steps i.past{background:var(--c-ok)}

.sa-panel{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(15px,3.2vw,28px);box-shadow:var(--shadow);
}
.sa-kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent-dark);font-weight:800;margin-bottom:7px}
.sa-phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.sa-phead .st{
  font-size:12px;font-weight:800;padding:5px 12px;border-radius:var(--r-pill);
  background:var(--surface-2);border:2px solid var(--line);color:var(--muted);
}
.sa-phead .ph{
  font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;
  border-radius:var(--r-pill);background:var(--c-accent-soft);border:2px solid #CBB6FB;color:var(--c-accent-dark);
}
.sa-phead .ph[data-k="Synthèse"]{background:var(--c-retain-soft);border-color:#FFC3DC;color:#D6337A}
.sa-phead .ph[data-k="Défi"]{background:var(--c-num-soft);border-color:#FFD4B3;color:var(--c-num-dark)}
.sa-phead .ph[data-k="Situation"]{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.sa-phead .ph[data-k="À retenir"]{background:var(--c-retain-soft);border-color:#FFC3DC;color:#D6337A}
.sa-title{font-size:clamp(21px,3.6vw,28px);font-weight:800;line-height:1.15}
.sa-lede{color:var(--muted);margin-top:8px;max-width:56ch;font-size:15.5px}
.sa-prompt{
  margin:16px 0 12px;padding:14px 16px;border-radius:var(--r);
  background:var(--c-den-soft);border:2px solid #B6E4FA;
  font-size:17px;font-weight:700;display:flex;gap:10px;align-items:flex-start;
}
.sa-prompt .ic{flex:0 0 auto;color:var(--c-den-dark)}
.sa-prompt .pl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-den-dark);font-weight:800;margin-bottom:2px}
.sa-prompt .ptext{font-size:16.5px}

/* --- messages : icône + mot, jamais la couleur seule --- */
.sa-msg{
  margin-top:13px;padding:13px 15px;border-radius:var(--r);font-size:15px;
  display:flex;gap:11px;align-items:flex-start;border:2px solid;line-height:1.45;
  animation:slidein 260ms var(--ease-pop);
}
.sa-msg .ic{flex:0 0 auto;font-weight:900;font-size:18px}
.sa-msg b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.sa-msg.guide{background:var(--c-guide-soft);border-color:#FFDF9E;color:#8A5B00}
.sa-msg.err{background:var(--c-err-soft);border-color:#F9BFC3;color:#B32530}
.sa-msg.ok{background:var(--c-ok-soft);border-color:#A9E9C6;color:#0F7A41}
.sa-msg.note{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- boutons épais, à ressort --- */
.sa-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.sa-btn{
  min-height:var(--tap);padding:0 22px;border-radius:16px;cursor:pointer;
  border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);
  font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;
  transition:border-color var(--dur),background var(--dur);
}
.sa-btn:hover:not(:disabled){border-color:var(--c-accent)}
.sa-btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.sa-btn.primary{background:var(--c-accent);border-color:var(--c-accent);border-bottom-color:var(--c-accent-dark);color:#fff}
.sa-btn.ghost{background:transparent}
.sa-btn.ok{background:var(--c-ok);border-color:var(--c-ok);border-bottom-color:var(--c-ok-dark);color:#fff}
.sa-btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:var(--r-s);border-bottom-width:4px}
.sa-btn:disabled{opacity:.45;cursor:not-allowed}
.sa-btn.jump{animation:jump 600ms var(--ease-pop)}
@keyframes jump{30%{transform:translateY(-7px) scale(1.04)}60%{transform:translateY(0) scale(1)}80%{transform:translateY(-3px)}}
:focus-visible{outline:4px solid var(--c-accent);outline-offset:3px;border-radius:8px}

/* --- rail d'instruments --- */
.sa-rail{
  display:block;margin:14px 0 6px;padding:12px;
  border-radius:var(--r);background:var(--c-accent-soft);border:2px dashed #CBB6FB;
}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sa-rail .lab{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent-dark);font-weight:800;
  display:inline-flex;align-items:center;gap:7px;
}
.rail-body{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.tool-group{
  display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-radius:var(--r-s);
  background:rgba(255,255,255,.6);border:2px solid rgba(203,182,251,.55);
}
.tool-group .gl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--c-accent-dark)}
.tool-group .gt{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.tool-field{display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-radius:var(--r-s);background:rgba(255,255,255,.6);border:2px solid rgba(203,182,251,.55)}
.tool-field .fl{font-size:13.5px;font-weight:800;line-height:1.2}
.tool-field .fl small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.sa-tool{
  display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 14px;border-radius:var(--r-s);
  border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;
  font-size:14.5px;font-weight:800;transition:border-color var(--dur),background var(--dur);
}
.sa-tool .ic{font-size:19px;line-height:1}
.sa-tool:hover:not(:disabled){border-color:var(--c-accent);background:#fff}
.sa-tool:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.sa-tool.active{border-color:var(--c-accent);background:#fff;box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.sa-tool:disabled{opacity:.4;cursor:not-allowed}
.sa-tool .k{font-family:var(--font-math);color:var(--c-den-dark)}
.sa-toolhint{width:100%;font-size:13px;color:var(--muted);margin-top:1px;min-height:18px;display:flex;gap:6px;align-items:center}
.sa-svgbox.tool-cut svg{cursor:cell}
.sa-svgbox.tool-pick svg{cursor:pointer}

/* --- scène SVG --- */
.sa-svgbox{margin-top:14px;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
.sa-svgbox svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.sa-cap{font-size:13px;color:var(--muted);margin-top:7px;text-align:center}

/* --- fraction vivante --- */
.sa-frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--font-math);line-height:1;vertical-align:middle}
.sa-frac .n,.sa-frac .d{font-weight:800;padding:1px 5px;transition:transform var(--dur)}
.sa-frac .n{color:var(--c-num)} .sa-frac .d{color:var(--c-den)}
.sa-frac .b{height:4px;width:100%;min-width:1.4em;background:var(--ink);border-radius:3px;margin:3px 0}
.sa-frac.xl{font-size:54px} .sa-frac.lg{font-size:36px} .sa-frac.md{font-size:24px} .sa-frac.sm{font-size:18px}
.sa-frac.beat .n,.sa-frac.beat .d{animation:beat 400ms var(--ease-pop)}
@keyframes beat{50%{transform:scale(1.3)}}
.sa-readout{
  display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,24px);flex-wrap:wrap;
  margin-top:14px;padding:15px;border-radius:var(--r);background:var(--surface-2);border:2px solid var(--line);
}
.sa-readout .leg{font-size:13px;color:var(--muted);max-width:20ch}
.sa-readout .leg b{display:block;font-weight:800;color:var(--ink);font-size:14px}
.sa-readout .leg.num b{color:var(--c-num-dark)} .sa-readout .leg.den b{color:var(--c-den-dark)}
.sa-eq{font-family:var(--font-math);font-size:clamp(16px,3.4vw,23px);font-weight:800}
.sa-eq .g{color:var(--muted)}

/* --- contrôle blanc : pas de manipulation, uniquement des questions --- */
.sa-exam-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:11px 13px;
  border-radius:var(--r);background:var(--surface-2);border:2px solid var(--line);
}
.sa-exam-head .qn{font-family:var(--font-math);font-weight:800;font-size:14px}
.sa-lvl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:var(--r-pill);border:2px solid}
.sa-lvl[data-l="Facile"]{background:var(--c-ok-soft);border-color:var(--c-ok);color:var(--c-ok-dark)}
.sa-lvl[data-l="Normal"]{background:var(--c-den-soft);border-color:var(--c-den);color:var(--c-den-dark)}
.sa-lvl[data-l="Difficile"]{background:var(--c-num-soft);border-color:var(--c-num);color:var(--c-num-dark)}
.sa-chrono{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--font-math);font-weight:800;font-size:15px;
  padding:6px 13px;border-radius:var(--r-pill);border:2px solid var(--line);background:#fff;color:var(--muted);
}
.sa-chrono.on{border-color:var(--c-den);color:var(--c-den-dark);background:var(--c-den-soft)}
.sa-chrono.warn{border-color:var(--c-guide);color:#8A5B00;background:var(--c-guide-soft)}
.sa-chrono.out{border-color:var(--c-err);color:var(--c-err);background:var(--c-err-soft);animation:beat 600ms var(--ease-pop)}
.sa-exam-dots{display:flex;gap:5px;margin-left:auto}
.sa-exam-dots i{width:16px;height:8px;border-radius:var(--r-xs);background:var(--line);display:block}
.sa-exam-dots i.done{background:var(--c-accent)}
.sa-exam-dots i.on{background:var(--ink)}
.sa-qtext{font-size:18px;font-weight:800;margin-top:14px;line-height:1.3}
.sa-note{
  text-align:center;margin-top:16px;padding:20px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--c-den-soft),#fff 60%);border:3px solid var(--c-den);
}
.sa-note .sc{font-family:var(--font-math);font-size:clamp(38px,10vw,58px);font-weight:800;color:var(--c-den-dark);line-height:1}
.sa-note .sc small{font-size:.45em;color:var(--muted)}
.sa-note .mention{font-size:17px;font-weight:800;margin-top:6px}
.sa-copie{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sa-copie .it{background:#fff;border:2px solid var(--line);border-left:6px solid var(--c-ok);border-radius:var(--r);padding:12px 14px}
.sa-copie .it.ko{border-left-color:var(--c-err)}
.sa-copie .it .qq{font-weight:800;font-size:14.5px;margin-bottom:6px}
.sa-copie .it .ans{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;font-weight:700}
.sa-copie .it .ans .mine{padding:4px 10px;border-radius:var(--r-xs);background:var(--c-err-soft);color:#B32530}
.sa-copie .it .ans .good{padding:4px 10px;border-radius:var(--r-xs);background:var(--c-ok-soft);color:var(--c-ok-dark)}
.sa-copie .it .why{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.sa-copie .it .rev{font-size:12.5px;font-weight:800;color:var(--c-accent-dark);margin-top:6px}

/* --- diagnostic de départ : badges de prérequis + arène de défis --- */
.sa-diag-head{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:11px;
  border-radius:var(--r);background:var(--surface-2);border:2px solid var(--line);
}
.sa-pq{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);
  background:#fff;border:2px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;
  transition:background var(--dur),border-color var(--dur),color var(--dur);
}
.sa-pq .ic{font-size:15px}
.sa-pq.ok{background:var(--c-ok-soft);border-color:var(--c-ok);color:var(--c-ok-dark)}
.sa-pq.weak{background:var(--c-guide-soft);border-color:var(--c-guide);color:#8A5B00}
.sa-pq.now{border-color:var(--c-accent);box-shadow:0 0 0 4px rgba(139,92,246,.16);color:var(--c-accent-dark)}
.sa-diag-count{margin-left:auto;font-family:var(--font-math);font-weight:800;font-size:13px;color:var(--muted)}
.sa-arena{margin-top:14px}
.sa-arena .q{font-size:18px;font-weight:800;margin-bottom:4px}
.sa-arena .qs{font-size:14px;color:var(--muted);margin-bottom:10px}
.sa-remed{
  margin-top:13px;padding:14px;border-radius:var(--r);background:var(--c-guide-soft);
  border:2px solid var(--c-guide);animation:slidein 260ms;
}
.sa-remed h5{margin:0 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#8A5B00}
.sa-ready{
  margin-top:16px;text-align:center;padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--c-ok-soft),#fff 60%);border:3px solid var(--c-ok);
  animation:winIn 520ms var(--ease-pop);
}
.sa-ready .t{font-size:clamp(20px,5vw,26px);font-weight:800;color:var(--c-ok-dark)}
.sa-ready .pqs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* --- carte de réussite : la phrase devient un schéma mots → symbole --- */
.sa-win{
  margin-top:14px;padding:16px 18px;border-radius:var(--r-lg);
  border:3px solid var(--c-ok);background:linear-gradient(135deg,var(--c-ok-soft),#fff 62%);
  animation:winIn 520ms var(--ease-pop);
}
.sa-win .head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.sa-win .badge{
  width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:var(--c-ok);color:#fff;
  display:grid;place-items:center;font-size:23px;font-weight:900;box-shadow:0 3px 0 var(--c-ok-dark);
  animation:badgePop 620ms var(--ease-pop);
}
.sa-win .ttl{font-size:19px;font-weight:800;line-height:1.15}
.sa-win .ttl small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-ok-dark);font-weight:800}
.sa-win .flow{
  display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,18px);flex-wrap:wrap;
  padding:14px;border-radius:var(--r);background:#fff;border:2px solid #A9E9C6;
}
.sa-win .flow > *{animation:stepIn 460ms var(--ease-pop) backwards}
.sa-win .flow > *:nth-child(2){animation-delay:130ms}
.sa-win .flow > *:nth-child(3){animation-delay:260ms}
.sa-win .flow > *:nth-child(4){animation-delay:390ms}
.sa-win .flow > *:nth-child(5){animation-delay:520ms}
.sa-win .words{font-size:17px;font-weight:800;text-align:center;max-width:16ch;line-height:1.2}
.sa-win .arrow{font-size:24px;color:var(--c-ok-dark);font-weight:900}
.sa-win .bignum{font-family:var(--font-math);font-size:clamp(26px,6vw,38px);font-weight:800;color:var(--c-ok-dark)}
.sa-win .strip{width:min(230px,42vw)}
.sa-win .strip svg{display:block;width:100%;height:auto}
.sa-win .eq{
  margin-top:11px;padding:9px 12px;border-radius:var(--r-s);background:#fff;border:2px dashed #A9E9C6;
  font-family:var(--font-math);font-size:clamp(14px,3.4vw,17px);font-weight:800;text-align:center;
}
.sa-win .say{margin-top:9px;font-size:15px;color:var(--ink);line-height:1.45}
@keyframes winIn{0%{opacity:0;transform:translateY(14px) scale(.97)}60%{transform:translateY(0) scale(1.01)}100%{opacity:1;transform:scale(1)}}
@keyframes badgePop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes stepIn{0%{opacity:0;transform:translateY(10px) scale(.9)}100%{opacity:1;transform:none}}
.sa-win .strip rect{transform-box:fill-box;transform-origin:center}
@keyframes partIn{0%{opacity:0;transform:scale(.35)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.sa-win .wn{color:var(--c-num-dark)} .sa-win .wd{color:var(--c-den-dark)}
.sa-win .deco{
  margin-top:11px;text-align:center;font-family:var(--font-math);font-size:clamp(15px,3.6vw,19px);
  font-weight:800;color:var(--c-num-dark);animation:stepIn 500ms 650ms backwards;
}
.sa-win .deco em{font-style:normal;color:var(--muted);font-weight:700}
.sa-win.glow{box-shadow:0 0 0 0 rgba(37,195,106,.45);animation:winIn 520ms var(--ease-pop),glow 1800ms 520ms ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(37,195,106,.45)}100%{box-shadow:0 0 0 22px rgba(37,195,106,0)}}

/* --- carte de mission : ce qu'il faut construire, toujours visible en haut --- */
.sa-panel:not(.past) .sa-mission{position:sticky;top:64px;z-index:6}
.sa-mission{
  position:relative;display:flex;align-items:center;gap:clamp(12px,3vw,26px);flex-wrap:wrap;
  margin-top:14px;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--c-accent-soft),#fff 70%);
  border:3px solid #CBB6FB;
}
.sa-mission .left{display:flex;flex-direction:column;gap:6px;min-width:150px}
.sa-mission .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-accent-dark);font-weight:800}
.sa-mission .ask{font-size:19px;font-weight:800;line-height:1.2}
.sa-mission .target{
  display:flex;align-items:center;gap:12px;padding:8px 20px;border-radius:var(--r);
  background:#fff;border:3px solid var(--c-accent);box-shadow:0 4px 0 var(--c-accent-dark);
}
.sa-dots{display:flex;gap:7px;margin-top:2px}
.sa-dots i{width:26px;height:9px;border-radius:var(--r-xs);background:#DCD1FB;display:block}
.sa-dots i.on{background:var(--c-accent)}
.sa-dots i.past{background:var(--c-ok)}
.sa-checks{display:flex;flex-direction:column;gap:7px;margin-left:auto}
.sa-chk{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:var(--r-pill);border:2px solid var(--line);background:#fff;color:var(--muted);
  transition:background var(--dur),border-color var(--dur),color var(--dur);
}
.sa-chk .mark{font-size:16px}
.sa-chk.den.hit{background:var(--c-den-soft);border-color:var(--c-den);color:var(--c-den-dark)}
.sa-chk.num.hit{background:var(--c-num-soft);border-color:var(--c-num);color:var(--c-num-dark)}
.sa-chk.ok.hit{background:var(--c-ok-soft);border-color:var(--c-ok);color:var(--c-ok-dark)}
.sa-chk.hit{animation:jump 480ms var(--ease-pop)}
.sa-goal{display:flex;gap:20px;align-items:center}
.sa-goal .g{text-align:center}
.sa-goal .g .v{font-family:var(--font-math);font-size:40px;font-weight:800;line-height:1}
.sa-goal .g .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.sa-goal .g.den .v{color:var(--c-den-dark)} .sa-goal .g.num .v{color:var(--c-num-dark)}
.sa-mission.new{animation:missionIn 700ms var(--ease-pop)}
@keyframes missionIn{
  0%{transform:scale(.92) translateY(14px);opacity:0;border-color:var(--c-ok)}
  55%{transform:scale(1.03) translateY(0);opacity:1;border-color:var(--c-ok)}
  100%{transform:scale(1);opacity:1}
}
.sa-ribbon{
  position:absolute;top:-15px;left:18px;padding:5px 14px;border-radius:var(--r-pill);
  background:var(--c-ok);color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  box-shadow:0 3px 0 var(--c-ok-dark);animation:ribbon 2600ms ease forwards;
}
@keyframes ribbon{0%{transform:scale(0) rotate(-8deg)}12%{transform:scale(1.12)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.sa-step{
  display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--line);
  border-radius:var(--r-pill);padding:5px;box-shadow:0 3px 0 rgba(30,42,70,.07);
}
.sa-step button{
  width:clamp(42px,11vw,48px);height:clamp(42px,11vw,48px);border-radius:50%;cursor:pointer;padding:0;
  border:2px solid var(--line);border-bottom-width:4px;background:var(--surface-2);color:var(--ink);
  font-size:27px;font-weight:900;line-height:0;display:grid;place-items:center;
  transition:transform var(--t-fast),background var(--dur),border-color var(--dur);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.sa-step button:hover:not(:disabled){background:#fff;border-color:var(--c-accent);transform:translateY(-2px)}
.sa-step button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.sa-step button:disabled{opacity:.28;cursor:not-allowed}
.sa-step .val{
  min-width:62px;height:clamp(42px,11vw,48px);border-radius:var(--r-s);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 10px;
}
.sa-step .val .v{font-family:var(--font-math);font-size:clamp(21px,5.5vw,26px);font-weight:800}
.sa-step .val .u{font-size:10px;font-weight:700;color:var(--muted);margin-top:3px}
.sa-step .val.bump .v{animation:beat 320ms var(--ease-pop)}
.sa-step.den{border-color:#B6E4FA;background:var(--c-den-soft)}
.sa-step.den button{border-color:#B6E4FA;color:var(--c-den-dark)}
.sa-step.den .val{background:#fff} .sa-step.den .val .v{color:var(--c-den-dark)}
.sa-step.num{border-color:#FFD4B3;background:var(--c-num-soft)}
.sa-step.num button{border-color:#FFD4B3;color:var(--c-num-dark)}
.sa-step.num .val{background:#fff} .sa-step.num .val .v{color:var(--c-num-dark)}

/* --- cartes de choix --- */
.sa-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:15px}
.sa-choice{
  cursor:pointer;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);
  border-radius:var(--r);padding:14px 12px;min-height:var(--tap);display:flex;flex-direction:column;
  align-items:center;gap:8px;transition:border-color var(--dur),background var(--dur);text-align:center;font-size:15px;font-weight:700;
}
.sa-choice:hover:not(:disabled){border-color:var(--c-accent);background:var(--c-accent-soft)}
.sa-choice:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.sa-choice.good{border-color:var(--c-ok);background:var(--c-ok-soft);animation:jump 520ms var(--ease-pop)}
.sa-choice.bad{border-color:var(--c-err);background:var(--c-err-soft);animation:shake 380ms}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.sa-choice .tag{font-size:12px;color:var(--muted);font-weight:800}
.sa-choice.good .tag::after{content:" ✓";color:var(--c-ok-dark)}
.sa-choice.bad .tag::after{content:" ✕";color:var(--c-err)}

/* --- coffres de tri --- */
.sa-buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.sa-bucket{
  border:3px dashed var(--line);border-radius:var(--r-lg);padding:11px;min-height:118px;
  background:var(--surface);cursor:pointer;transition:border-color var(--dur),background var(--dur);
}
.sa-bucket:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.sa-bucket h4{font-family:var(--font-math);font-size:17px;margin:0 0 8px;text-align:center;font-weight:800}
.sa-bucket .slot{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.sa-tokens{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;justify-content:center}
.sa-token{
  cursor:pointer;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);
  border-radius:var(--r-s);padding:9px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:var(--tap);
}
.sa-token[aria-pressed="true"]{border-color:var(--c-accent);background:var(--c-accent-soft);transform:translateY(-3px)}
.sa-token.good{border-color:var(--c-ok)} .sa-token.bad{border-color:var(--c-err);animation:shake 380ms}

/* --- à retenir --- */
.sa-retain{
  margin-top:18px;border:3px solid #FFC3DC;border-radius:var(--r-lg);
  background:var(--c-retain-soft);padding:18px;
}
.sa-retain .h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#D6337A;font-weight:800;margin-bottom:12px}
.sa-retain .body{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sa-retain .rule{font-size:17px;font-weight:800;max-width:32ch;line-height:1.35}
.sa-retain .warn{margin-top:12px;font-size:14px;color:#B32530;display:flex;gap:8px;align-items:flex-start;border-top:2px dashed #FFC3DC;padding-top:10px}
.sa-legend{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.sa-legend .row{display:flex;align-items:center;gap:8px}
.sa-legend .sq{width:14px;height:14px;border-radius:5px;flex:0 0 auto}

/* --- fin de module : la récompense --- */
.sa-done{text-align:center;padding:8px 0}
.sa-done .big{font-size:clamp(26px,5vw,38px);font-weight:800}
.sa-badge{
  width:104px;height:104px;margin:8px auto 4px;border-radius:50%;display:grid;place-items:center;
  font-size:52px;background:var(--c-ok-soft);border:5px solid var(--c-ok);
  animation:badge 700ms var(--ease-pop);
}
@keyframes badge{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.sa-stars{display:flex;gap:12px;justify-content:center;margin:12px 0;font-size:38px}
.sa-stars span{opacity:.2;filter:grayscale(1)}
.sa-stars span.on{opacity:1;filter:none;animation:star 600ms var(--ease-pop) backwards}
.sa-stars span:nth-child(2).on{animation-delay:160ms}
.sa-stars span:nth-child(3).on{animation-delay:320ms}
@keyframes star{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.sa-scorebar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted);font-weight:700}

/* --- confettis et bulles de récompense --- */
#sa-fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.sa-confetti{position:absolute;width:11px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.9}
}
.sa-float{
  position:fixed;z-index:95;pointer-events:none;font-weight:800;font-size:20px;color:var(--c-ok-dark);
  background:var(--c-ok-soft);border:2px solid var(--c-ok);border-radius:var(--r-pill);padding:5px 14px;
  animation:floatup 1100ms ease-out forwards;
}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}

/* --- synthèse finale --- */
.sa-mapart{margin-top:16px}
.sa-final{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.sa-final .cell{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r);padding:14px}
.sa-final .cell h4{margin:0 0 5px;font-size:15px}
.sa-final .cell p{font-size:13.5px;color:var(--muted)}
.sa-foot{margin-top:24px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.sa-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:640px){
  .sa-rail{padding:9px}
  .rail-body{gap:8px}
  .tool-group,.tool-field{padding:7px 8px}
  .sa-tool{padding:0 11px;font-size:13.5px}
  .sa-panel:not(.past) .sa-mission{position:static}
  .sa-brand small{display:none}
  .sa-chip.time{display:none}
  .sa-buckets{grid-template-columns:1fr}
  .sa-hero{padding-top:4px}
}

<script>
"use strict";
/* =========================================================================
   0. JETONS DE DESIGN  —  source unique de vérité, partagée par le CSS
   (variables :root) et par tous les dessins SVG. Une leçon Smarter Academy
   n'invente jamais une couleur : elle pioche ici.
     encre / muted / line / surface : structure
     unit : l'unité, le tout (neutre)
     den  : dénominateur, découpage        num : numérateur, parts prises
     tool : instrument, action de l'élève   ok / err / guide : retours
     rule : « à retenir »                   sea : décor de l'archipel
   ========================================================================= */
const T = {
  ink: "#1E2A46", muted: "#68789B", line: "#DCE6F7", white: "#FFFFFF", surface2: "#EFF4FE",
  unit: "#8497BC", unitSoft: "rgba(132,151,188,.12)", unitFaint: "rgba(132,151,188,.10)",
  den: "#22A7F0", denDark: "#0D82C4", denSoft: "#E3F4FE", denFaint: "#EFF8FE", denMid: "#DBF1FE",
  denGhost: "rgba(34,167,240,.28)",
  num: "#FF8A3D", numDark: "#DB6414", numSoft: "#FFEEDF", numGhost: "rgba(255,138,61,.34)",
  numFaint: "rgba(255,138,61,.16)",
  tool: "#8B5CF6", toolDark: "#6C34E0", toolSoft: "#F0EAFE", toolLine: "#CBB6FB",
  toolGhost: "rgba(139,92,246,.65)",
  ok: "#25C36A", okDark: "#149B50", okSoft: "#E1F8EC", okGhost: "rgba(37,195,106,.14)",
  err: "#F0555F", errDark: "#B32530", errSoft: "#FDE7E9", errGhost: "rgba(240,85,95,.45)",
  guide: "#FFB627", guideSoft: "#FFF4DC",
  rule: "#FF62A5", ruleDark: "#D6337A", ruleSoft: "#FFEAF3",
  ghost: "rgba(30,42,70,.18)", ghostStrong: "rgba(30,42,70,.30)",
  sea: "#8FCBEA", hatchLine: "rgba(255,255,255,.62)"
};

/* =========================================================================
   1. OUTILS GÉNÉRAUX  (DOM, SVG, mathématiques)
   ========================================================================= */
const $ = (s, r) => (r || document).querySelector(s);

function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(c => { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  return n;
}
function svgRoot(vb, label){
  const s = sv("svg", {viewBox: vb, role: "img", "aria-label": label || ""});
  return s;
}
function txt(x, y, str, o){
  o = o || {};
  const t = sv("text", {x: x, y: y, "text-anchor": o.anchor || "middle",
    "font-size": o.size || 15, fill: o.fill || T.ink, "font-weight": o.weight || 600,
    "font-family": o.mono ? "SF Mono, ui-monospace, monospace" : "Avenir Next, Segoe UI, system-ui, sans-serif",
    opacity: o.opacity});
  t.textContent = str;
  return t;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const simplify = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };
const isIrreducible = (n, d) => gcd(n, d) === 1;
/* écriture décimale exacte si le dénominateur réduit n'a que des 2 et des 5 */
function isDecimalFraction(n, d){
  let [ , q] = simplify(n, d);
  while (q % 2 === 0) q /= 2;
  while (q % 5 === 0) q /= 5;
  return q === 1;
}
function decimalOf(n, d){
  const v = n / d;
  if (isDecimalFraction(n, d)) return String(+v.toFixed(6)).replace(".", ",");
  return (Math.round(v * 1000) / 1000).toString().replace(".", ",") + "…";
}
/* décomposition euclidienne : 29/6 -> 4 + 5/6 */
const mixed = (n, d) => ({ whole: Math.floor(n / d), rest: n % d, d: d });
/* la chaîne complète d'une fraction supérieure à 1 :
   7/4 = 4/4 + 3/4 = 1 + 3/4   (unités entières d'abord, reste ensuite) */
function mixedChain(n, d){
  if (n <= d) return n + "/" + d;
  const m = mixed(n, d);
  const full = (m.whole * d) + "/" + d;
  if (m.rest === 0) return n + "/" + d + " = " + m.whole;
  return n + "/" + d + " = " + full + " + " + m.rest + "/" + d + " = " + m.whole + " + " + m.rest + "/" + d;
}
const divisorsOf = n => { const r = []; for (let i = 2; i <= n; i++) if (n % i === 0) r.push(i); return r; };

/* =========================================================================
   1 bis. MÉMOIRE DE LA SÉANCE
   Le stockage local peut être refusé (mode privé, iframe fermée…). On teste
   une fois, et tout échec ramène simplement au mode « mémoire vive » :
   la leçon fonctionne, elle ne se souvient juste pas d'une fois sur l'autre.
   ========================================================================= */
const Store = {
  key: "smarter-academy.fractions-6e",
  ok: (function(){ try { const k = "__sa"; window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k); return true; } catch (e){ return false; } })(),
  save(o){ if (!this.ok) return; try { window.localStorage.setItem(this.key, JSON.stringify(o)); } catch (e){} },
  load(){ if (!this.ok) return null;
    try { return JSON.parse(window.localStorage.getItem(this.key) || "null"); } catch (e){ return null; } },
  clear(){ if (!this.ok) return; try { window.localStorage.removeItem(this.key); } catch (e){} }
};

/* =========================================================================
   2. ÉTAT GLOBAL  (jamais de stockage externe : tout vit en mémoire)
   ========================================================================= */
const State = {
  xp: 0,
  current: null,      /* id du module ouvert */
  step: 0,
  mods: {},           /* id -> {status, stars, hits, miss} */
  errorLog: {},       /* code d'erreur -> nombre d'occurrences (diagnostic) */
  get(id){
    if (!this.mods[id]) this.mods[id] = { status: "new", stars: 0, hits: 0, miss: 0 };
    return this.mods[id];
  },
  award(xp){
    this.xp += xp;
    const n = $("#sa-xp"); n.textContent = this.xp;
    const chip = $("#sa-xp-chip");
    if (chip){ chip.classList.remove("pulse"); void chip.offsetWidth; chip.classList.add("pulse"); }
    this.paint();
  },
  streak: 0, best: 0, started: Date.now(),
  place: null,          /* dernière étape ouverte : reprise exacte */
  persist(){
    Store.save({v: 1, xp: this.xp, mods: this.mods, best: this.best,
      errorLog: this.errorLog, prereq: this.prereq || null, place: this.place});
  },
  restore(){
    const o = Store.load();
    if (!o || o.v !== 1) return false;
    this.xp = o.xp || 0; this.mods = o.mods || {}; this.best = o.best || 0;
    this.errorLog = o.errorLog || {}; this.prereq = o.prereq || null; this.place = o.place || null;
    return true;
  },
  wipe(){ Store.clear(); this.xp = 0; this.mods = {}; this.best = 0; this.streak = 0;
    this.errorLog = {}; this.prereq = null; this.place = null; this.started = Date.now(); },
  logError(code){
    this.errorLog[code] = (this.errorLog[code] || 0) + 1;
    this.streak = 0; this.paintChips(); Fx.fail();
  },
  bumpStreak(){
    this.streak++; this.best = Math.max(this.best, this.streak);
    const chip = document.getElementById("sa-streak-chip");
    if (chip){ chip.classList.remove("pulse"); void chip.offsetWidth; chip.classList.add("pulse"); }
    this.paintChips();
  },
  paintChips(){
    const st = document.getElementById("sa-streak"); if (st) st.textContent = this.streak;
    const t = document.getElementById("sa-time");
    if (t) t.textContent = Math.round((Date.now() - this.started) / 60000);
  },
  paint(){
    const total = MODULES.length;
    const done = MODULES.filter(m => { const s = this.mods[m.id]; return s && (s.status === "done" || s.status === "master"); }).length;
    const pct = Math.round(done / total * 100);
    $("#sa-fill").style.width = pct + "%";
    $("#sa-progress-pct").textContent = pct + " %";
    $("#sa-progress-lab").textContent = done + " / " + total + " جزيرة";
    this.paintChips();
    this.persist();
  }
};

/* =========================================================================
   3. FRACTION VIVANTE  (le composant signature : numérateur et dénominateur
      gardent leur couleur partout, du symbole jusqu'aux dessins)
   ========================================================================= */
function fracEl(n, d, size){
  const box = el("span", {class: "sa-frac " + (size || "md"), role: "math", dir: "ltr",
                          "aria-label": n + " " + (d === 1 ? "" : "من " + d)});
  box.appendChild(el("span", {class: "n", text: String(n)}));
  box.appendChild(el("span", {class: "b"}));
  box.appendChild(el("span", {class: "d", text: String(d)}));
  return box;
}
function setFrac(box, n, d){
  box.querySelector(".n").textContent = n;
  box.querySelector(".d").textContent = d;
  box.setAttribute("aria-label", n + " من " + d);
  box.classList.remove("beat"); void box.offsetWidth; box.classList.add("beat");
}

/* =========================================================================
   4. MOTEUR DE GUIDAGE  (déterministe, à trois niveaux, jamais la réponse)
      - inaction  -> invite d'orientation
      - action fausse -> message lié au code d'erreur
   ========================================================================= */
const ERRORS = {
  UNEQUAL_PARTS:      { t: "أجزاء غير متساوية",     m: "يجب أن تكون الأجزاء متساوية تمامًا في الحجم. قارنها بعينك: أيّها أكبر؟" },
  WRONG_DENOMINATOR:  { t: "عدد الأجزاء",           m: "المقام يشير إلى عدد الأجزاء المتساوية التي قُسّمت إليها الوحدة." },
  WRONG_NUMERATOR:    { t: "الأجزاء المأخوذة",       m: "البسط يشير إلى عدد الأجزاء التي نأخذها." },
  INVERTED:           { t: "البسط والمقام معكوسان",  m: "في الأعلى: الأجزاء المأخوذة. في الأسفل: أجزاء التقسيم. أعد قراءة الكسر." },
  MISREAD_NUMBER_LINE:{ t: "قراءة المستقيم",         m: "نعدّ التدريجات ابتداءً من 0، وليس من 1." },
  OFF_BY_ONE:         { t: "فرق تدريجة واحدة",       m: "أعد عدّ التدريجات واحدة تلو الأخرى ابتداءً من 0." },
  WRONG_COMMON_DEN:   { t: "مقام مشترك",             m: "يجب اختيار تقسيم يتوافق تمامًا مع الكسرين معًا." },
  WRONG_OPERATION:    { t: "العملية",                m: "انظر إلى ما يطلبه الوضع حقًا: تقسيم أم أخذ أم جمع؟" },
  WRONG_GROUPING:     { t: "التجميع غير ممكن",       m: "لتجميع الأجزاء، يجب أن يقسم العدد المختار كلًّا من البسط والمقام دون باقٍ." },
  ADDED_DENOMINATORS: { t: "جمع المقامات",           m: "لا يمكن جمع المقامات: فهي تُحدّد حجم الأجزاء، لا الكمية." },
  BIGGER_DEN_BIGGER:  { t: "مقام أكبر",              m: "كلما زاد عدد الأجزاء، كانت الأجزاء أصغر." },
  UNEQUAL_GROUPS:     { t: "مجموعات غير متساوية",    m: "يجب أن تحتوي كل مجموعة على العدد نفسه من العناصر، دون باقٍ." }
};

const Guide = {
  host: null, hints: [], level: 0, timer: null,
  mount(host, hints){
    this.host = host; this.hints = hints || []; this.level = 0;
    this.arm(24000);
  },
  arm(ms){
    clearTimeout(this.timer);
    if (!this.hints.length) return;
    this.timer = setTimeout(() => this.next(true), ms);
  },
  touch(){ this.arm(30000); },          /* l'élève agit : on repousse l'indice */
  next(auto){
    if (!this.host || this.level >= this.hints.length) return;
    const h = this.hints[this.level++];
    Msg.show(this.host, "guide", auto ? "مساعدة صغيرة" : "تلميح " + this.level, h);
    this.arm(34000);
  },
  clear(){ clearTimeout(this.timer); this.host = null; this.hints = []; this.level = 0; }
};

const Msg = {
  show(host, type, title, text){
    if (!host) return;
    const old = host.querySelector(".sa-msg." + type);
    if (old) old.remove();
    const icons = { guide: "💡", err: "✕", ok: "✓", note: "▸" };
    const box = el("div", {class: "sa-msg " + type, role: "status", "aria-live": "polite"}, [
      el("span", {class: "ic", text: icons[type] || "▸"}),
      el("div", {}, [ el("b", {text: title}), el("span", {html: text}) ])
    ]);
    host.appendChild(box);
    return box;
  },
  error(host, code, extra){
    const e = ERRORS[code] || { t: "أعد النظر", m: "لاحظ الوضعية من جديد." };
    State.logError(code);
    const old = host.querySelector(".sa-msg.err"); if (old) old.remove();
    const old2 = host.querySelector(".sa-msg.ok"); if (old2) old2.remove();
    const old3 = host.querySelector(".sa-win"); if (old3) old3.remove();
    return Msg.show(host, "err", e.t, e.m + (extra ? " <em>" + extra + "</em>" : ""));
  },
  ok(host, title, text){
    const old = host.querySelector(".sa-msg.err"); if (old) old.remove();
    const old2 = host.querySelector(".sa-msg.guide"); if (old2) old2.remove();
    return Msg.show(host, "ok", title || "هذا صحيح", text || "");
  },
  clear(host){ if (host){ host.querySelectorAll(".sa-msg").forEach(n => n.remove()); host.querySelectorAll(".sa-win").forEach(n => n.remove()); } },

  /* --- carte de réussite : on ne dit pas seulement « bravo », on montre le
     chemin qui va du dessin aux mots, puis des mots au symbole. --- */
  win(host, o){
    if (!host) return;
    ["err", "guide", "ok", "note"].forEach(k => { const x = host.querySelector(".sa-msg." + k); if (x) x.remove(); });
    const old = host.querySelector(".sa-win"); if (old) old.remove();

    const card = el("div", {class: "sa-win", role: "status", "aria-live": "polite"});
    card.appendChild(el("div", {class: "head"}, [
      el("span", {class: "badge", "aria-hidden": "true", text: "✓"}),
      el("span", {class: "ttl"}, [el("small", {text: "أحسنت"}), el("span", {html: o.title || "أحسنت"})])
    ]));

    const flow = el("div", {class: "flow"});
    const arrow = () => el("span", {class: "arrow", "aria-hidden": "true", text: "→"});
    let stripSvg = null;
    if (o.strip){
      const box = el("div", {class: "strip"});
      stripSvg = fractionStrip(o.strip[0], o.strip[1], {w: 300, h: 34, mixed: true});
      box.appendChild(stripSvg);
      flow.appendChild(box);
    }
    if (o.words){
      if (flow.children.length) flow.appendChild(arrow());
      flow.appendChild(el("span", {class: "words", html: o.words}));
    }
    if (o.chain){
      o.chain.forEach((f, i) => {
        if (i) flow.appendChild(el("span", {class: "arrow", "aria-hidden": "true", text: "="}));
        flow.appendChild(fracEl(f[0], f[1], i === o.chain.length - 1 ? "xl" : "lg"));
      });
    }
    if (o.frac){
      if (flow.children.length) flow.appendChild(arrow());
      flow.appendChild(fracEl(o.frac[0], o.frac[1], "xl"));
    }
    if (o.big){
      if (flow.children.length) flow.appendChild(arrow());
      flow.appendChild(el("span", {class: "bignum", html: o.big}));
    }
    if (flow.children.length) card.appendChild(flow);
    if (o.deco) card.appendChild(el("div", {class: "deco", html: o.deco}));
    if (o.eq) card.appendChild(el("div", {class: "eq", html: o.eq}));
    if (o.say) card.appendChild(el("p", {class: "say", html: o.say}));
    card.classList.add("glow");
    host.appendChild(card);

    /* les parts prises se posent une à une, et le numérateur compte avec elles :
       l'élève voit d'où vient le nombre du haut. */
    if (!Fx.calm){
      const parts = stripSvg ? [].slice.call(stripSvg.querySelectorAll("rect.on")) : [];
      parts.forEach((r, i) => {
        r.style.animation = "partIn 420ms cubic-bezier(.34,1.56,.64,1) backwards";
        r.style.animationDelay = (200 + i * 130) + "ms";
      });
      if (o.frac && o.count !== false && o.frac[0] > 1 && o.frac[0] <= 12){
        const nEl = card.querySelector(".flow .sa-frac .n");
        if (nEl){
          nEl.textContent = "0";
          for (let i = 1; i <= o.frac[0]; i++)
            setTimeout(() => {
              nEl.textContent = String(i);
              nEl.style.animation = "beat 320ms cubic-bezier(.34,1.56,.64,1)";
              setTimeout(() => { nEl.style.animation = ""; }, 320);
            }, 420 + i * 150);
        }
      }
    }
    return card;
  }
};

/* =========================================================================
   4 bis. MOTEUR DE RÉCOMPENSE  —  confettis, bulles, petit son, série
   La récompense arrive APRÈS un vrai geste mathématique réussi, jamais
   pour un clic au hasard. Tout est désactivé si l'élève a demandé moins
   d'animations (prefers-reduced-motion) ou coupé le son.
   ========================================================================= */
const Fx = {
  soundOn: true, ctx: null,
  get calm(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; },
  beep(kind){
    if (!this.soundOn) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = {tick: [880], ok: [660, 880], win: [660, 880, 1175],
                     big: [523, 659, 784, 1047], err: [220, 165]}[kind] || [660];
      notes.forEach((f, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t0 = this.ctx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + 0.24);
      });
    } catch (e){ /* le son n'est jamais indispensable */ }
  },
  confetti(n){
    if (this.calm) return;
    const host = document.getElementById("sa-fx"); if (!host) return;
    const colors = [T.num, T.den, T.tool, T.ok, "#FFB627", T.rule];
    for (let i = 0; i < (n || 26); i++){
      const c = document.createElement("i");
      c.className = "sa-confetti";
      c.style.left = (5 + Math.random() * 90) + "vw";
      c.style.top = "-20px";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1100 + Math.random() * 900) + "ms";
      c.style.animationDelay = (Math.random() * 260) + "ms";
      host.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
  },
  float(node, text){
    if (this.calm || !node || !node.getBoundingClientRect) return;
    const r = node.getBoundingClientRect();
    if (!r.width && !r.height) return;
    const b = document.createElement("div");
    b.className = "sa-float"; b.textContent = text;
    b.style.left = (r.left + r.width / 2) + "px";
    b.style.top = (r.top - 6) + "px";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  },
  win(node, xp){ this.beep("win"); this.confetti(18); this.float(node, "+" + xp + " ⭐"); },
  bigWin(){ this.beep("big"); this.confetti(60); },
  fail(){ this.beep("err"); }
};

/* compteur +/- : cliquer, jamais taper au clavier un nombre */
/* Compteur : deux gros boutons ronds et une valeur lisible de loin.
   - appui maintenu = répétition (on ne clique pas douze fois pour aller à 12)
   - une borne atteinte désactive le bouton concerné au lieu d'ignorer le clic
   - la valeur rebondit à chaque changement : le geste a un écho visible      */
function stepper(opt){
  const box = el("div", {class: "sa-step", role: "group", "aria-label": opt.label || "ضبط"});
  let v = opt.value;
  const num = el("span", {class: "v", text: String(v)});
  const val = el("span", {class: "val", role: "status", "aria-live": "polite",
                          "aria-label": v + " " + (opt.unit || "")}, [num]);
  if (opt.unit) val.appendChild(el("span", {class: "u", text: opt.unit}));

  function sync(){ minus.disabled = v <= opt.min; plus.disabled = v >= opt.max; }
  const set = nv => {
    nv = clamp(nv, opt.min, opt.max);
    if (nv === v) return sync();
    v = nv; num.textContent = String(v);
    val.setAttribute("aria-label", v + " " + (opt.unit || ""));
    val.classList.remove("bump"); void val.offsetWidth; val.classList.add("bump");
    sync(); opt.onchange(v);
  };
  const mk = (glyph, dir, label) => {
    const b = el("button", {type: "button", "aria-label": label, text: glyph});
    let viaPointer = false, t1 = null, t2 = null;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    b.addEventListener("pointerdown", () => {
      if (b.disabled) return;
      viaPointer = true; set(v + dir);
      t1 = setTimeout(() => { t2 = setInterval(() => { if (b.disabled) return stop(); set(v + dir); }, 110); }, 420);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(e => b.addEventListener(e, stop));
    b.addEventListener("click", () => { if (viaPointer){ viaPointer = false; return; } set(v + dir); });
    return b;
  };
  const minus = mk("−", -1, (opt.label || "القيمة") + " : أقل بواحد");
  const plus  = mk("+", +1, (opt.label || "القيمة") + " : أكثر بواحد");

  box.appendChild(minus); box.appendChild(val); box.appendChild(plus);
  sync();
  box.get = () => v; box.set = set;
  return box;
}

/* --- RAIL D'INSTRUMENTS -------------------------------------------------
   Un instrument = une opération mathématique, pas un bouton décoratif.
   Contrat commun : intention de l'élève -> exécution géométrique exacte.
   L'élève garde la décision (« combien de parts ? »), l'outil garantit
   seulement la précision (parts rigoureusement égales).
   ----------------------------------------------------------------------- */
function ToolRail(label){
  const lab = el("span", {class: "lab"}, [el("span", {"aria-hidden": "true", text: "🧰"}), el("span", {text: label || "الأدوات"})]);
  const head = el("div", {class: "rail-head"}, [lab]);
  const body = el("div", {class: "rail-body"});
  const hint = el("div", {class: "sa-toolhint"});
  const rail = el("div", {class: "sa-rail", role: "toolbar", "aria-label": label || "الأدوات"}, [head, body, hint]);

  rail.tell = t => { hint.innerHTML = t ? "<span>▸</span><span>" + t + "</span>" : ""; };
  rail.tools = [];

  function mkTool(o){
    const b = el("button", {class: "sa-tool", type: "button", title: o.desc,
      "aria-label": o.label.replace(/<[^>]+>/g, "") + (o.desc ? ". " + o.desc : "")});
    b.appendChild(el("span", {class: "ic", "aria-hidden": "true", text: o.icon}));
    b.appendChild(el("span", {class: "t", html: o.label}));
    const show = () => { if (!b.disabled && o.preview) o.preview(true); rail.tell(o.desc); };
    const hide = () => { if (o.preview) o.preview(false); rail.tell(""); };
    b.addEventListener("mouseenter", show); b.addEventListener("focus", show);
    b.addEventListener("mouseleave", hide); b.addEventListener("blur", hide);
    b.addEventListener("click", () => { hide(); o.on(); });
    b.meta = o; rail.tools.push(b);
    return b;
  }
  /* un instrument isolé */
  rail.add = o => { const b = mkTool(o); body.appendChild(b); return b; };
  /* un groupe d'instruments qui vont ensemble (« Découper », « Corriger »…) */
  rail.group = name => {
    const slot = el("div", {class: "gt"});
    const node = el("div", {class: "tool-group"}, [el("span", {class: "gl", text: name}), slot]);
    body.appendChild(node);
    return {node: node, add: o => { const b = mkTool(o); slot.appendChild(b); return b; },
            put: n => { slot.appendChild(n); return n; }};
  };
  /* un réglage chiffré, avec son étiquette au-dessus */
  rail.field = o => {
    const f = el("div", {class: "tool-field"}, [
      el("span", {class: "fl", html: o.label + (o.note ? "<small>" + o.note + "</small>" : "")}), o.control]);
    body.appendChild(f); return f;
  };
  rail.mount = () => { head.appendChild(hintButton()); return rail; };
  return rail;
}

/* pile d'annulation : aucune manipulation n'est jamais irréversible */
function History(apply){
  const stack = [];
  return {
    push(state){ stack.push(JSON.parse(JSON.stringify(state))); },
    undo(){ if (stack.length < 1) return false; apply(stack.pop()); return true; },
    clear(){ stack.length = 0; },
    get depth(){ return stack.length; }
  };
}

  return wrap;
}

/* --- CARTE DE MISSION -----------------------------------------------------
   Un seul composant pour toutes les manipulations : ce qu'il faut obtenir
   reste affiché en haut, et un voyant par sous-objectif dit à l'élève ce
   qui est DÉJÀ fait. C'est le suivi de progression à l'intérieur d'un geste.
   -------------------------------------------------------------------------- */
function MissionCard(o){
  const eyebrow = el("span", {class: "eyebrow", text: o.count ? "المهمة 1 من " + o.count : (o.eyebrow || "مهمتك")});
  const ask = el("span", {class: "ask", html: o.ask || ""});
  const left = el("div", {class: "left"}, [eyebrow, ask]);
  let dots = null;
  if (o.count && o.count > 1){
    dots = el("div", {class: "sa-dots", "aria-hidden": "true"});
    for (let i = 0; i < o.count; i++) dots.appendChild(el("i", {class: i === 0 ? "on" : ""}));
    left.appendChild(dots);
  }
  const targetBox = el("div", {class: "target"});
  const checks = el("div", {class: "sa-checks"});
  const map = {};
  (o.checks || []).forEach(c => {
    const chip = el("span", {class: "sa-chk " + (c.tone || "ok")},
      [el("span", {class: "mark", "aria-hidden": "true", text: "○"}), el("span", {html: c.todo})]);
    map[c.id] = {chip: chip, def: c, on: false};
    checks.appendChild(chip);
  });
  const say = el("p", {class: "sa-sr", role: "status", "aria-live": "assertive"});

  const card = el("div", {class: "sa-mission", role: "group", "aria-label": "المهمة الحالية"}, [left]);
  if (o.target){ targetBox.appendChild(o.target); card.appendChild(targetBox); }
  if (o.checks && o.checks.length) card.appendChild(checks);
  card.appendChild(say);

  card.mark = (id, ok, extra) => {
    const m = map[id]; if (!m) return;
    const changed = m.on !== !!ok; m.on = !!ok;
    m.chip.classList.toggle("hit", !!ok);
    if (changed){ m.chip.classList.remove("hit2"); void m.chip.offsetWidth; }
    m.chip.querySelector(".mark").textContent = ok ? "✓" : "○";
    m.chip.lastChild.innerHTML = (ok ? m.def.done : m.def.todo) + (extra ? " " + extra : "");
    if (changed && ok) say.textContent = String(m.def.done).replace(/<[^>]+>/g, "");
  };
  card.setAsk = t => { ask.innerHTML = t; };
  card.setCheck = (id, def) => {
    const m = map[id]; if (!m) return;
    if (def.todo) m.def.todo = def.todo;
    if (def.done) m.def.done = def.done;
    m.chip.lastChild.innerHTML = m.on ? m.def.done : m.def.todo;
  };
  card.setTarget = node => {
    targetBox.innerHTML = ""; targetBox.appendChild(node);
    if (!targetBox.parentNode) card.insertBefore(targetBox, checks);
  };
  card.setStep = (i, total) => {
    eyebrow.textContent = "المهمة " + i + " من " + total;
    if (dots) [].forEach.call(dots.children, (x, k) => { x.className = k < i - 1 ? "past" : (k === i - 1 ? "on" : ""); });
  };
  card.flash = (ribbon, announce) => {
    const old = card.querySelector(".sa-ribbon"); if (old) old.remove();
    card.appendChild(el("div", {class: "sa-ribbon", text: ribbon}));
    card.classList.remove("new"); void card.offsetWidth; card.classList.add("new");
    if (announce) say.textContent = announce;
  };
  card.done = t => { eyebrow.textContent = "أُنجزت المهمة"; ask.innerHTML = t || ask.innerHTML; };
  return card;
}
