/* =========================================================================
   6. REPRÉSENTATION DE BASE : LA BANDE UNITÉ
      Un seul objet mathématique traverse toute la leçon : l'unité découpée
      en parts égales. Les parts prises sont oranges ET hachurées (jamais la
      couleur seule), les parts libres sont bleues.
   ========================================================================= */
function hatchDefs(svg){
  const defs = sv("defs", {});
  const p = sv("pattern", {id: "sa-hatch", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  p.appendChild(sv("rect", {width: 8, height: 8, fill: T.num}));
  p.appendChild(sv("line", {x1: 0, y1: 0, x2: 0, y2: 8, stroke: T.hatchLine, "stroke-width": 2.6}));
  defs.appendChild(p);
  svg.appendChild(defs);
}
/* dessine une (ou plusieurs) unité(s) partagée(s) en d, dont n parts prises */
function fractionStrip(n, d, o){
  o = o || {};
  const units = Math.max(1, Math.ceil(n / d) || 1);
  const x0 = 40, w = o.w || 640, barH = o.h || 62, gap = 18;
  const showMixed = o.mixed && n > d;
  const W = x0 * 2 + w + (showMixed ? 96 : 0);
  const H = units * (barH + gap) + gap;
  const svg = svgRoot("0 0 " + W + " " + H, o.label || (n + " sur " + d));
  hatchDefs(svg);
  for (let u = 0; u < units; u++){
    const y = gap + u * (barH + gap);
    svg.appendChild(sv("rect", {x: x0, y: y, width: w, height: barH, rx: 11,
      fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
    for (let i = 0; i < d; i++){
      const idx = u * d + i, px = x0 + i * w / d, pw = w / d;
      const on = idx < n;
      svg.appendChild(sv("rect", {x: px + 2.5, y: y + 2.5, width: pw - 5, height: barH - 5, rx: 7,
        class: on ? "on" : "off",
        fill: on ? "url(#sa-hatch)" : T.denSoft,
        stroke: on ? T.num : T.den, "stroke-width": 1.6}));
    }
    if (showMixed){
      const inUnit = Math.max(0, Math.min(d, n - u * d));
      svg.appendChild(txt(x0 + w + 10, y + barH / 2 + 5,
        inUnit === d ? "= 1 unité" : "= " + inUnit + "/" + d,
        {size: 14, anchor: "start", weight: 800, fill: inUnit === d ? T.okDark : T.numDark}));
    } else if (units > 1) svg.appendChild(txt(x0 - 14, y + barH / 2 + 5, String(u + 1), {size: 13, fill: T.muted, anchor: "end"}));
  }
  return svg;
}

/* =========================================================================
   7. MOTEUR « PARTITION »  —  instruments ✂️ Couper / 🔗 Regrouper / ✋ Prendre

   CONTRAT DES INSTRUMENTS
   ✂️ Couper en k   : divise CHAQUE part en k parts égales   d -> d × k
        cible valide : l'unité entière (toutes les parts à la fois)
        état avant {d} -> état après {d × k}, parts égales garanties
   🔗 Regrouper     : rassemble les parts par paquets de k     d -> d ÷ k
        actif seulement si k divise d ; c'est l'opération inverse du cutter
   ✋ Prendre       : sélectionne des parts (numérateur)
   ↩️ Annuler       : dépile le dernier geste, sans confirmation

   Ce que l'outil fait : la précision géométrique.
   Ce que l'élève fait : décider en combien de parts il faut partager.
   ========================================================================= */
function PartitionEngine(cfg){
  const W = 720, H = 200, x0 = 50, w = 620, yTop = 54, barH = 96;
  const host = cfg.host;
  let d = 1, selected = [], phase = "cut", done = false, preview = 0, mergeK = 0;

  const svg = svgRoot("0 0 " + W + " " + H, "وحدة نريد تقسيمها");
  hatchDefs(svg);
  const gBar = sv("g", {}); svg.appendChild(gBar);
  const box = el("div", {class: "sa-svgbox tool-cut"}, [svg]);

  const hist = History(st => { d = st.d; selected = st.selected.slice(); phase = st.phase; done = false; Msg.clear(host); render(); syncTools(); });
  const snap = () => hist.push({d: d, selected: selected, phase: phase});

  const frac = fracEl("?", "?", "lg");
  const counter = el("span", {class: "sa-eq", html: ""});
  const readout = el("div", {class: "sa-readout"}, [
    el("div", {class: "leg num"}, [el("b", {text: "الأجزاء المأخوذة"}), el("span", {text: "برتقالي، مخطّط"})]),
    frac,
    el("div", {class: "leg den"}, [el("b", {text: "أجزاء التقسيم"}), el("span", {text: "إطار أزرق"})])
  ]);

  const mission = MissionCard({
    eyebrow: "مهمتك", ask: cfg.n ? "قسّم، ثم خذ أجزاءً" : "قسّم الوحدة",
    target: goalNumbers(cfg.d, cfg.n),
    checks: [{id: "den", tone: "den", todo: "يلزم " + cfg.d + " أجزاء متساوية", done: "قُسّمت إلى " + cfg.d + " أجزاء متساوية"}].concat(
      cfg.n ? [{id: "num", tone: "num", todo: "يلزم أخذ " + cfg.n, done: cfg.n + " أجزاء مأخوذة"}] : [])
  });

  const smallestFactor = n => { for (let k = 2; k <= n; k++) if (n % k === 0) return k; return 0; };

  function render(){
    while (gBar.firstChild) gBar.removeChild(gBar.firstChild);
    gBar.appendChild(sv("rect", {x: x0, y: yTop, width: w, height: barH, rx: 12,
      fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
    gBar.appendChild(txt(x0 + w / 2, yTop - 18, "الوحدة", {size: 12, fill: T.unit, weight: 700}));

    for (let i = 0; i < d; i++){
      const on = !!selected[i], pw = w / d;
      const r = sv("rect", {x: x0 + i * pw + 3, y: yTop + 3, width: pw - 6, height: barH - 6, rx: 8,
        fill: on ? "url(#sa-hatch)" : (phase === "select" ? T.denMid : T.denFaint),
        stroke: on ? T.num : T.den, "stroke-width": on ? 2 : 1.4,
        style: phase === "select" ? "cursor:pointer" : ""});
      if (phase === "select"){
        r.setAttribute("tabindex", "0"); r.setAttribute("role", "button");
        r.setAttribute("aria-pressed", on ? "true" : "false");
        r.setAttribute("aria-label", "الجزء " + (i + 1) + " من " + d + "، أدخل لأخذه");
        r.addEventListener("click", () => toggle(i));
        r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(i); } });
      }
      gBar.appendChild(r);
      if (phase === "select")
        gBar.appendChild(txt(x0 + i * pw + pw / 2, yTop + barH / 2 + 7, on ? "✓" : "+",
          {size: on ? 19 : 20, fill: on ? T.white : T.ghostStrong}));
      else if (d > 1)
        gBar.appendChild(txt(x0 + i * pw + pw / 2, yTop + barH / 2 + 6, "1/" + d,
          {size: Math.min(15, 90 / d + 7), mono: true, fill: T.denDark, weight: 700}));
    }
    for (let i = 1; i < d; i++)
      gBar.appendChild(sv("line", {x1: x0 + i * w / d, y1: yTop - 6, x2: x0 + i * w / d, y2: yTop + barH + 6,
        stroke: T.tool, "stroke-width": 3, "stroke-linecap": "round"}));
    if (preview > 1 && phase === "cut"){
      const nd = d * preview;
      for (let i = 1; i < nd; i++) if (i % preview !== 0)
        gBar.appendChild(sv("line", {x1: x0 + i * w / nd, y1: yTop - 2, x2: x0 + i * w / nd, y2: yTop + barH + 2,
          stroke: T.tool, "stroke-width": 2, "stroke-dasharray": "6 5", opacity: .85}));
      gBar.appendChild(txt(x0 + w / 2, yTop + barH + 30, "معاينة : " + nd + " أجزاء متساوية",
        {size: 12, fill: T.tool, weight: 700}));
    } else if (mergeK > 1 && phase === "cut"){
      const nd = d / mergeK;
      for (let i = 1; i < d; i++) if (i % mergeK !== 0)
        gBar.appendChild(sv("line", {x1: x0 + i * w / d, y1: yTop - 6, x2: x0 + i * w / d, y2: yTop + barH + 6,
          stroke: T.err, "stroke-width": 3, "stroke-dasharray": "3 6", opacity: .9}));
      gBar.appendChild(txt(x0 + w / 2, yTop + barH + 30, "معاينة : هذه الخطوط ستختفي ← " + nd + " أجزاء",
        {size: 12, fill: T.err, weight: 700}));
    }

    const nSel = selected.filter(Boolean).length;
    mission.mark("den", d === cfg.d, d === cfg.d ? "" : "<em style='opacity:.7'>(حاليًا " + d + ")</em>");
    if (cfg.n) mission.mark("num", nSel === cfg.n,
      (nSel === 0 || nSel === cfg.n) ? "" : "<em style='opacity:.7'>(أُخذ " + nSel + ")</em>");
    setFrac(frac, phase === "select" ? nSel : "?", d);
    counter.innerHTML = d === 1
      ? "جزء واحد فقط : الوحدة لم تُقسّم بعد."
      : d + " أجزاء <span style='color:#149B50'>متساوية تمامًا ✓</span> — كل جزء يساوي 1/" + d + " من الوحدة.";
  }

  function cut(k){
    if (done || phase !== "cut") return;
    if (d * k > 16) return void Msg.show(host, "note", "دقيق جدًا",
      "بعد 16 جزءًا لا يعود شيء مرئيًا. استخدم 🔗 تجميع للعودة إلى الوراء.");
    snap(); d *= k; Guide.touch(); Msg.clear(host); render(); syncTools(); evaluate();
  }
  function merge(){
    if (done || phase !== "cut") return;
    const k = smallestFactor(d);
    if (!k) return;
    snap(); d /= k; Guide.touch(); Msg.clear(host); render(); syncTools(); evaluate();
  }
  function toggle(i){
    if (done || phase !== "select") return;
    snap(); selected[i] = !selected[i]; Guide.touch(); render(); evaluate();
  }

  function evaluate(){
    if (done) return;
    if (phase === "cut"){
      if (d === cfg.d){
        Msg.win(host, {
          title: "قُسّمت الوحدة إلى " + cfg.d + " أجزاء متساوية",
          strip: [1, cfg.d],
          words: "<span class='wn'>جزء واحد</span> من <span class='wd'>" + cfg.d + " أجزاء متساوية</span>",
          frac: [1, cfg.d],
          deco: "الوحدة = " + new Array(cfg.d).fill("1/" + cfg.d).join(" + ") + " <em>(" + cfg.d + " مرات)</em>",
          say: "كل جزء يساوي <b>1/" + cfg.d + "</b> من الوحدة. جميعها متساوية تمامًا في الحجم."
        });
        if (cfg.n){
          setTimeout(() => {
            phase = "select"; selected = new Array(d).fill(false); hist.clear();
            const pr = host.querySelector(".sa-prompt .ptext");
            if (pr) pr.innerHTML = cfg.prompt2 || ("والآن، <b>خذ " + cfg.n + " أجزاء</b>.");
            mission.setAsk("الجزء الثاني : خذ " + cfg.n + " أجزاء");
            mission.flash("انتهى التقسيم !", "تعليمة جديدة : خذ " + cfg.n + " أجزاء من " + cfg.d + ".");
            Guide.mount(host, cfg.hints2 || ["اضغط مباشرة على الأجزاء التي تأخذها.",
              "يلزم " + cfg.n + " أجزاء ملوّنة، لا أكثر."]);
            Msg.clear(host); box.className = "sa-svgbox tool-pick"; render(); syncTools();
          }, 850);
        } else finish();
      } else if (d > cfg.d){
        Msg.error(host, "WRONG_DENOMINATOR",
          "لديك " + d + " أجزاء، ويلزم " + cfg.d + ". استخدم 🔗 تجميع للرجوع.");
      }
    } else {
      const nSel = selected.filter(Boolean).length;
      if (nSel === cfg.n) finish();
      else if (nSel > cfg.n) Msg.error(host, "WRONG_NUMERATOR",
        "أخذت " + nSel + " أجزاء، ويلزم " + cfg.n + ". أعد النقر على جزء لإعادته.");
      else { const m = host.querySelector(".sa-msg.err"); if (m) m.remove(); }
    }
  }
  function finish(){
    done = true;
    const fn = cfg.n || cfg.d;
    Msg.win(host, {
      title: "تمّ بناء الكسر",
      strip: [fn, cfg.d],
      words: "<span class='wn'>" + fn + " أجزاء مأخوذة</span><br>من <span class='wd'>" + cfg.d + " أجزاء متساوية</span>",
      frac: [fn, cfg.d],
      deco: new Array(fn).fill("1/" + cfg.d).join(" + ") + " = " + fn + "/" + cfg.d,
      say: "الرسم والكلمات والكتابة الرمزية تقول الشيء نفسه تمامًا."
    });
    syncTools();
    if (cfg.onDone) cfg.onDone();
  }

  const rail = ToolRail("الأدوات");
  const gCut = rail.group("تقسيم");
  const gTake = rail.group("أخذ");
  const gFix = rail.group("تصحيح");
  const cutBtns = [2, 3, 5].map(k => gCut.add({
    icon: "✂️", label: "قسّم إلى <span class='k'>" + k + "</span>",
    desc: "يقسّم كل جزء إلى " + k + " أجزاء متساوية. تبقى الأجزاء متساوية تمامًا في الحجم.",
    preview: on => { preview = on ? k : 0; render(); },
    on: () => cut(k)
  }));
  const mergeBtn = gFix.add({
    icon: "🔗", label: "تجميع",
    desc: "يجمع الأجزاء في حزم متساوية : وهي العملية العكسية للمقص.",
    preview: on => { mergeK = on ? smallestFactor(d) : 0; render(); },
    on: merge
  });
  const pickBtn = gTake.add({
    icon: "✋", label: "أخذ أجزاء",
    desc: "اضغط على جزء لأخذه، وأعد الضغط لإعادته.",
    on: () => Msg.show(host, "note", "الأداة نشطة", "اضغط مباشرة على أجزاء الشريط.")
  });
  const undoBtn = gFix.add({
    icon: "↩️", label: "تراجع",
    desc: "يعود إلى الخطوة السابقة. لا شيء نهائي في هذه الورشة.",
    on: () => {
      if (done) return void Msg.show(host, "note", "الكسر مكتمل", "هذا التقسيم مؤكَّد. استخدم ↺ إعادة البدء لتبدأ من جديد.");
      if (!hist.undo()) Msg.show(host, "note", "لا شيء للتراجع عنه", "أنت في نقطة البداية.");
    }
  });
  gFix.add({
    icon: "↺", label: "إعادة البدء",
    desc: "يعيد الوحدة كاملة، دون تقسيم.",
    on: () => { d = 1; selected = []; phase = "cut"; done = false; preview = 0; mergeK = 0;
      hist.clear(); Msg.clear(host); box.className = "sa-svgbox tool-cut"; render(); syncTools(); }
  });
  rail.mount();

  function syncTools(){
    const cutting = phase === "cut" && !done;
    gCut.node.style.display = cutting ? "" : "none";
    gTake.node.style.display = (phase === "select") ? "" : "none";
    cutBtns.forEach(b => { b.disabled = !cutting; });
    mergeBtn.style.display = cutting ? "" : "none";
    mergeBtn.disabled = !cutting || d === 1;
    const mk = smallestFactor(d);
    mergeBtn.querySelector(".t").innerHTML = mk > 1
      ? "تجميع كل <span class='k'>" + mk + "</span>"
      : "تجميع";
    mergeBtn.meta.desc = mk > 1
      ? "يجمع الأجزاء في حزم من " + mk + " : ستنتقل من " + d + " إلى " + (d / mk) + " أجزاء."
      : "لا شيء لتجميعه : الوحدة غير مقسَّمة.";
    mergeBtn.title = mergeBtn.meta.desc;
    pickBtn.classList.toggle("active", phase === "select" && !done);
    undoBtn.disabled = hist.depth === 0 || done;
  }

  render(); syncTools();
  const cap = el("p", {class: "sa-cap",
    html: "اختر الأداة، فهي تضمن أجزاءً متساوية <b>تمامًا</b> — وعليك أنت أن تقرر كم عددها."});
  const node = el("div", {}, [mission, rail, box, cap, readout, el("p", {class: "sa-cap"})]);
  node.querySelector("p:last-child").appendChild(counter);
  return node;
}

/* =========================================================================
   8. MOTEUR « DROITE GRADUÉE »
      L'élève choisit lui-même le nombre de graduations par unité, puis place
      le point. État : {sub, pos} — la valeur est pos/sub.
   ========================================================================= */
function NumberLineEngine(cfg){
  const W = 720, H = 212, x0 = 55, x1 = 680, yL = 105;
  const host = cfg.host, maxU = cfg.max || 3, tgt = cfg.target;
  let sub = cfg.startSub || 1, point = null, done = false, drag = false;
  const uW = (x1 - x0) / maxU;
  const svg = svgRoot("0 0 " + W + " " + H, "مستقيم مدرّج من 0 إلى " + maxU);
  const g = sv("g", {}); svg.appendChild(g);
  const val = el("span", {class: "sa-eq", html: "—"});
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: "ضع هذا الكسر على المستقيم",
    target: fracEl(tgt.n, tgt.d, "xl"),
    checks: [
      {id: "grad", tone: "den", todo: "درّج كل وحدة إلى " + tgt.d, done: "كل وحدة مقسَّمة إلى " + tgt.d},
      {id: "pos", tone: "num", todo: "عدّ " + tgt.n + " تدريجات من 0", done: tgt.n + " تدريجات معدودة"}
    ]
  });

  function xOf(v){ return x0 + v * uW; }
  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    g.appendChild(sv("line", {x1: x0 - 20, y1: yL, x2: x1 + 30, y2: yL, stroke: T.unit, "stroke-width": 3.5}));
    g.appendChild(sv("path", {d: "M" + (x1 + 30) + " " + yL + " l-12 -7 v14 z", fill: T.unit}));
    for (let u = 0; u < maxU; u++)
      for (let k = 1; k < sub; k++){
        const x = xOf(u + k / sub);
        g.appendChild(sv("line", {x1: x, y1: yL - 12, x2: x, y2: yL + 12, stroke: T.den, "stroke-width": 2, opacity: .75}));
      }
    for (let u = 0; u <= maxU; u++){
      const x = xOf(u);
      g.appendChild(sv("line", {x1: x, y1: yL - 24, x2: x, y2: yL + 24, stroke: T.ink, "stroke-width": 3}));
      g.appendChild(txt(x, yL + 48, String(u), {size: 17, mono: true, weight: 800}));
    }
    if (point !== null){
      const x = xOf(point / sub);
      g.appendChild(sv("line", {x1: x, y1: yL - 46, x2: x, y2: yL, stroke: T.num, "stroke-width": 3, "stroke-dasharray": "5 4"}));
      const c = sv("circle", {cx: x, cy: yL, r: 13, fill: T.num, stroke: T.white, "stroke-width": 3,
        tabindex: "0", role: "slider", "aria-label": "النقطة موضوعة، استخدم الأسهم لتحريكها",
        "aria-valuenow": (point / sub).toFixed(2)});
      c.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
          e.preventDefault(); point = clamp(point + (e.key === "ArrowLeft" ? -1 : 1), 0, sub * maxU); Guide.touch(); render(); check();
        }
      });
      g.appendChild(c);
      g.appendChild(txt(x, yL - 56, point + "/" + sub, {size: 16, mono: true, fill: T.num, weight: 800}));
      const vv = point / sub, whole = Math.floor(vv + 1e-9), rest = point - whole * sub;
      if (whole >= 1){
        const yB = yL + 62, xw = xOf(whole);
        g.appendChild(sv("path", {d: "M" + xOf(0) + " " + (yB - 7) + " v7 H" + xw + " v-7",
          fill: "none", stroke: T.okDark, "stroke-width": 2.5}));
        g.appendChild(txt((xOf(0) + xw) / 2, yB + 20, whole === 1 ? "وحدة واحدة" : whole + " وحدات",
          {size: 13, fill: T.okDark, weight: 800}));
        if (rest > 0){
          g.appendChild(sv("path", {d: "M" + xw + " " + (yB - 7) + " v7 H" + x + " v-7",
            fill: "none", stroke: T.numDark, "stroke-width": 2.5}));
          g.appendChild(txt((xw + x) / 2, yB + 20, "+ " + rest + "/" + sub, {size: 13, fill: T.numDark, weight: 800}));
        }
      }
    }
    mission.mark("grad", sub % tgt.d === 0, sub % tgt.d === 0 ? "" : "<em style='opacity:.7'>(حاليًا " + sub + ")</em>");
    mission.mark("pos", done, point === null ? "" : "<em style='opacity:.7'>(" + point + " خطوة)</em>");
    val.innerHTML = point === null
      ? "<span class='g'>ضع النقطة، ثم عدّ التدريجات من 0</span>"
      : "خطوات معدودة من 0 : <b style='color:#DB6414'>" + point + "</b> × 1/<b style='color:#0D82C4'>" + sub +
        "</b> &nbsp;=&nbsp; <b>" + point + "/" + sub + "</b>";
  }
  function posOf(e){
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    const v = (px - x0) / uW;
    return clamp(Math.round(v * sub), 0, sub * maxU);
  }
  svg.addEventListener("pointerdown", e => { if (done) return; drag = true; point = posOf(e); Guide.touch(); render(); });
  svg.addEventListener("pointermove", e => { if (!drag || done) return; point = posOf(e); render(); });
  svg.addEventListener("pointerup", () => { if (!drag) return; drag = false; check(); });

  function check(){
    if (done || point === null) return;
    const v = point / sub, target = tgt.n / tgt.d;
    if (Math.abs(v - target) < 1e-9){
      done = true;
      const m = mixed(tgt.n, tgt.d);
      mission.mark("pos", true); mission.done("وُضع الكسر في المكان الصحيح");
      Msg.win(host, {
        title: "نقطة موضوعة جيدًا",
        words: "<span class='wn'>" + tgt.n + " خطوة</span><br>من <span class='wd'>1/" + tgt.d + "</span> ابتداءً من 0",
        frac: [tgt.n, tgt.d],
        eq: m.whole >= 1 ? mixedChain(tgt.n, tgt.d) + " &nbsp;←&nbsp; بين " + m.whole + " و" + (m.whole + 1)
            : tgt.n + "/" + tgt.d + " بين 0 و1",
        deco: m.whole >= 1 && m.rest > 0
          ? new Array(tgt.d).fill("1/" + tgt.d).join(" + ") + " = " + tgt.d + "/" + tgt.d + " = 1 <em>(وحدة كاملة)</em>"
          : null,
        say: "<b>المقام</b> يحدد حجم الخطوة، و<b>البسط</b> يحدد عدد الخطوات."
      });
      if (cfg.onDone) cfg.onDone(sub);
      return;
    }
    if (Math.abs(v - tgt.d / tgt.n) < 1e-9) return void Msg.error(host, "INVERTED");
    if (Math.abs(v - (target + 1)) < 1e-9) return void Msg.error(host, "MISREAD_NUMBER_LINE");
    if (sub % tgt.d !== 0) return void Msg.error(host, "WRONG_DENOMINATOR",
      "بـ " + sub + " تدريجة لكل وحدة، لا يمكن الوقوع بالضبط على أخماس من " + tgt.d + ".");
    if (Math.abs(v - target) <= 1.01 / sub) return void Msg.error(host, "OFF_BY_ONE");
    Msg.error(host, "OFF_BY_ONE");
  }

  const rail = ToolRail("الأدوات");
  rail.field({ label: "📏 <b>تدريج</b>", note: "تقسيم كل وحدة",
    control: stepper({value: sub, min: 1, max: 12, label: "أجزاء لكل وحدة", unit: "أجزاء",
      onchange: v => { sub = v; point = null; Guide.touch(); Msg.clear(host); render(); }}) });
  const gCount = rail.group("عدّ");
  const gFix = rail.group("تصحيح");
  const focusPt = () => { const c = svg.querySelector("circle[role='slider']"); if (c && c.focus) c.focus(); };
  gCount.add({ icon: "📍", label: "وضع النقطة", desc: "يضع النقطة على 0 : ستتمكن بعدها من عدّ التدريجات واحدة تلو الأخرى.",
    on: () => { if (done) return; if (point === null){ point = 0; render(); } focusPt();
      Msg.show(host, "note", "النقطة على 0", "عدّ الآن التدريجات بـ ◀ و ▶، أو اضغط مباشرة على المستقيم."); } });
  const back = gCount.add({ icon: "◀", label: "الرجوع خطوة", desc: "يرجع بالضبط تدريجة واحدة.",
    on: () => stepPoint(-1) });
  const fwd = gCount.add({ icon: "▶", label: "التقدّم خطوة", desc: "يتقدّم بالضبط تدريجة واحدة : وهذا ما يعدّه البسط.",
    on: () => stepPoint(1) });
  gFix.add({ icon: "↩️", label: "تراجع", desc: "يزيل النقطة من المستقيم.",
    on: () => { if (done) return; point = null; Msg.clear(host); render(); } });
  rail.mount();
  function stepPoint(dir){
    if (done) return;
    point = point === null ? (dir > 0 ? 1 : 0) : clamp(point + dir, 0, sub * maxU);
    Guide.touch(); render(); check();
  }
  render();
  return el("div", {}, [mission, rail, svgBox(svg, "درّج أولًا كل وحدة، ثم عدّ التدريجات من 0."),
    el("div", {class: "sa-readout"}, [val])]);
}

/* =========================================================================
   8 bis. MOTEUR « DIAGNOSTIC DE DÉPART »
   Douze mini-défis manipulables, deux par prérequis. On ne fait pas un cours
   sur les prérequis : l'élève agit, le système repère la lacune, propose une
   remédiation courte, puis passe. Personne n'est bloqué à l'entrée.
   Prérequis suivis : entiers · partage équitable · multiplier-diviser ·
                      unité et mesure · droite graduée · comparer
   ========================================================================= */
const PREREQ = [
  {id: "p1", icon: "🔢", label: "الأعداد الصحيحة"},
  {id: "p2", icon: "🍕", label: "التقسيم العادل"},
  {id: "p3", icon: "➗", label: "الضرب والقسمة"},
  {id: "p4", icon: "📏", label: "الوحدة والقياس"},
  {id: "p5", icon: "📍", label: "المستقيم المدرّج"},
  {id: "p6", icon: "⚖️", label: "المقارنة"}
];

/* ---- petits dessins du diagnostic ---- */
function dotsSvg(n, color){
  const cols = Math.min(7, n), rows = Math.ceil(n / cols);
  const W = cols * 40 + 20, H = rows * 40 + 20;
  const svg = svgRoot("0 0 " + W + " " + H, n + " قطعة");
  for (let i = 0; i < n; i++)
    svg.appendChild(sv("circle", {cx: 30 + (i % cols) * 40, cy: 30 + Math.floor(i / cols) * 40, r: 15,
      fill: color || T.num, stroke: "#fff", "stroke-width": 3}));
  return svg;
}
function barsSvg(lengths, unit){
  const W = 360, H = lengths.length * 46 + 12;
  const svg = svgRoot("0 0 " + W + " " + H, "أشرطة");
  lengths.forEach((L, i) => {
    const y = 10 + i * 46;
    if (unit) svg.appendChild(sv("rect", {x: 10, y: y, width: 320, height: 30, rx: 7,
      fill: "none", stroke: T.unit, "stroke-width": 2, "stroke-dasharray": "5 5"}));
    svg.appendChild(sv("rect", {x: 10, y: y, width: 320 * L, height: 30, rx: 7,
      fill: T.den, opacity: .85}));
  });
  return svg;
}
function cutStrip(cuts){
  const svg = svgRoot("0 0 360 60", "شريط مقسّم");
  const x0 = 10, w = 340;
  svg.appendChild(sv("rect", {x: x0, y: 12, width: w, height: 36, rx: 8,
    fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
  for (let i = 0; i < cuts.length - 1; i++)
    svg.appendChild(sv("rect", {x: x0 + cuts[i] * w + 2, y: 14, width: (cuts[i + 1] - cuts[i]) * w - 4, height: 32, rx: 5,
      fill: T.denSoft, stroke: T.den, "stroke-width": 1.5}));
  return svg;
}
function miniLine(max, marks, point){
  const W = 380, H = 92, x0 = 24, x1 = 356, y = 46;
  const svg = svgRoot("0 0 " + W + " " + H, "مستقيم مدرّج");
  svg.appendChild(sv("line", {x1: x0 - 12, y1: y, x2: x1 + 14, y2: y, stroke: T.unit, "stroke-width": 3.5}));
  for (let u = 0; u <= max; u++){
    const x = x0 + u * (x1 - x0) / max;
    svg.appendChild(sv("line", {x1: x, y1: y - 13, x2: x, y2: y + 13, stroke: T.ink, "stroke-width": 2.5}));
    if (marks) svg.appendChild(txt(x, y + 32, String(u), {size: 14, mono: true, weight: 800}));
  }
  if (point !== null && point !== undefined)
    svg.appendChild(sv("circle", {cx: x0 + point * (x1 - x0) / max, cy: y, r: 11, fill: T.num, stroke: "#fff", "stroke-width": 3}));
  return svg;
}

function DiagnosticEngine(cfg){
  const host = cfg.host;
  const res = {}; PREREQ.forEach(p => res[p.id] = "todo");
  let i = 0, tries = 0, finished = false;

  const badges = {};
  const head = el("div", {class: "sa-diag-head"});
  PREREQ.forEach(p => {

  const arena = el("div", {class: "sa-arena"});
  const node = el("div", {}, [head, arena]);

  function cards(list, correct, ok, ko){
    const grid = el("div", {class: "sa-choices"});
    list.forEach((c, k) => {

        else { b.classList.add("bad"); b.disabled = true; ko(c.why); }
      });
      grid.appendChild(b);
    });
    arena.appendChild(grid);
  }
  function numberAnswer(opt, ok, ko){

      label: opt.label || "الإجابة", unit: opt.unit, onchange: () => {}});

    const v = el("div", {class: "sa-actions"}, [st,

  const CH = [

     remed: {t: "مقارنة عددين", h: "12 أكبر من 10، و10 أكبر من 8. يمكن أيضًا مقارنة صفوف القطع.", svg: () => dotsSvg(12)}},

    {p: "p2", q: "أيّ شريط مقسَّم إلى أجزاء متساوية ؟", s: "انظر جيدًا إلى عرض كل جزء.",

        {svg: cutStrip([0, .25, .5, .75, 1]), tag: "ب"},

     remed: {t: "التقسيم العادل", h: "التقسيم إلى أجزاء متساوية يعني قطعًا <b>متساوية تمامًا</b> في الحجم. وإلا فالتقسيم ظالم.", svg: () => cutStrip([0, .25, .5, .75, 1])}},

     build: (ok, ko) => { arena.appendChild(svgBox(dotsSvg(12))); numberAnswer({answer: 3, max: 8, unit: "مجموعات", tone: "den"}, ok, ko); },

    {p: "p3", q: "12 قطعة مقسَّمة على 3 مجموعات متساوية : كم في كل مجموعة ؟", s: "12 ÷ 3 = ؟",

     remed: {t: "الوحدة يمكن أن تُقسَّم", h: "الشريط الصغير يدخل <b>3 مرات</b> في الوحدة. سنقول قريبًا إنه يساوي 1/3 من الوحدة.", svg: () => barsSvg([1 / 3, 2 / 3, 1], true)}},

    {p: "p4", q: "أيّ شريط يقيس وحدتين بالضبط ؟", s: "الوحدة = مستطيل منقّط.",
     build: (ok, ko) => cards([
        {svg: barsSvg([1], true), tag: "أ", why: "هذا يقيس وحدة واحدة بالضبط."},
        {svg: barsSvg([1, 1], true), tag: "ب"},
        {svg: barsSvg([.5], true), tag: "ج", why: "هذا لا يملأ حتى وحدة واحدة."}], 1, ok, ko),
     hint: "عدّ كم عدد الوحدات الكاملة المملوءة.",
     remed: {t: "القياس بوحدة", h: "القياس يعني عدّ كم مرة تدخل الوحدة في الطول.", svg: () => barsSvg([1, 1], true)}},

    {p: "p5", q: "ضع العدد 3 على المستقيم.", s: "اضغط في المكان الصحيح بالضبط.",
     build: (ok, ko) => {
       let pt = null;
       const box = el("div", {class: "sa-svgbox"});
       const draw = () => { box.innerHTML = ""; const svg = miniLine(5, true, pt);
         svg.addEventListener("pointerdown", e => {
           const r = svg.getBoundingClientRect();
           const v = ((e.clientX - r.left) / r.width * 380 - 24) / (332 / 5);

           if (pt === 3) ok(); else ko(pt === 4 || pt === 2 ? "أنت قريب بتدريجة واحدة : أعد العدّ من 0." : null);
         });

       draw(); arena.appendChild(box);
     },
     hint: "عدّ التدريجات من 0 : 1، 2، 3.",
     remed: {t: "قراءة مستقيم مدرّج", h: "ننطلق دائمًا من <b>0</b> ونعدّ التدريجات واحدة تلو الأخرى.", svg: () => miniLine(5, true, 3)}},

    {p: "p5", q: "ما العدد الذي تشير إليه النقطة ؟", s: "",
     build: (ok, ko) => { arena.appendChild(svgBox(miniLine(6, true, 4)));
       cards([{t: "3"}, {t: "4"}, {t: "5"}], 1, ok, ko); },
     hint: "عدّ التدريجات من 0.",
     remed: {t: "قراءة تدريجة", h: "النقطة على التدريجة الرابعة بعد 0 : إنها 4.", svg: () => miniLine(6, true, 4)}},

    {p: "p6", q: "أيّ شريط هو الأطول ؟", s: "",
     build: (ok, ko) => cards([{svg: barsSvg([.45]), tag: "أ"}, {svg: barsSvg([.8]), tag: "ب"}, {svg: barsSvg([.6]), tag: "ج"}], 1, ok, ko),
     hint: "انظر إلى أين يصل اللون.",
     remed: {t: "مقارنة المقادير", h: "نقارن طولين بمعرفة أيّهما يصل أبعد، انطلاقًا من النقطة نفسها.", svg: () => barsSvg([.45, .8, .6])}},

    {p: "p6", q: "لدى طفلين كعكتان متماثلتان. من لديه أكثر ؟", s: "",
     build: (ok, ko) => cards([
        {svg: dotsSvg(5), t: "ليلى", why: "لدى ليلى 5."},
        {svg: dotsSvg(9), t: "سامي"}], 1, ok, ko),
     hint: "عدّ، ثم قارن العددين.",
     remed: {t: "المقارنة لاتخاذ القرار", h: "9 أكبر من 5 : إذًا سامي لديه الأكثر.", svg: () => dotsSvg(9)}}

  function paint(){
    PREREQ.forEach(p => {
      const b = badges[p.id];
      b.className = "sa-pq" + (res[p.id] === "ok" ? " ok" : res[p.id] === "weak" ? " weak" : "");
      if (!finished && CH[i] && CH[i].p === p.id) b.className += " now";
    });
    counter.textContent = finished ? "انتهى" : "التحدي " + (i + 1) + " / " + CH.length;
  }
  function show(){
    Msg.clear(host);
    arena.innerHTML = "";
    tries = 0;
    const c = CH[i];
    paint();
    arena.appendChild(el("p", {class: "q", html: c.q}));
    if (c.s) arena.appendChild(el("p", {class: "qs", html: c.s}));
    c.build(pass, fail);
  }
  function markOk(){ const p = CH[i].p; if (res[p] !== "weak") res[p] = "ok"; }
  function pass(){
    if (finished || i >= CH.length) return;
    markOk(); State.bumpStreak(); Fx.beep("ok");
    Msg.ok(host, "نعم !", "");
    i++; paint();
    setTimeout(() => { if (i < CH.length) show(); else finish(); }, 620);
  }
  function fail(extra){
    if (finished || i >= CH.length) return;
    tries++;
    const c = CH[i];
    State.streak = 0; State.paintChips(); Fx.fail();
    if (tries === 1) return void Msg.show(host, "guide", "انظر مرة أخرى", extra || c.hint);
    res[c.p] = "weak"; paint();
    const r = c.remed;
    const box = el("div", {class: "sa-remed"}, [
      el("h5", {text: "تذكير سريع · " + r.t}), el("p", {html: r.h})
    ]);

      el("button", {class: "sa-btn primary", type: "button", text: "فهمت، لنتابع ←",
        onclick: () => { i++; if (i < CH.length) show(); else finish(); }})]));
    Msg.clear(host);
    arena.appendChild(box);
  }
  function finish(){
    finished = true; paint();
    arena.innerHTML = "";

    const weak = PREREQ.filter(p => res[p.id] === "weak");
    const ready = el("div", {class: "sa-ready"});
    ready.appendChild(el("div", {class: "sa-badge", "aria-hidden": "true", text: weak.length ? "🧭" : "🚀"}));
    ready.appendChild(el("p", {class: "t", text: "أنت جاهز للكسور !"}));

      html: weak.length
        ? "أساسياتك موجودة. سننتبه إلى : <b>" + weak.map(p => p.label).join("، ") +
          "</b>. الجزر الأولى تعيد بالضبط هذه المهارات."
        : "الأسس الستة متينة. يمكنك الانطلاق مباشرة."}));
    const pqs = el("div", {class: "pqs"});
    PREREQ.forEach(p => pqs.appendChild(el("span", {class: "sa-pq " + (res[p.id] === "weak" ? "weak" : "ok")},
