       el("span", {text: res[p.id] === "weak" ? "⚠" : "✓"})])));
    ready.appendChild(pqs);
    arena.appendChild(ready);
    Fx.bigWin();
    if (cfg.onDone) cfg.onDone();
  }
  show();
  return node;
}

/* =========================================================================
   8 ter. MOTEUR « CONTRÔLE BLANC »
   Aucune manipulation : uniquement des questions à choix, comme sur une copie.
   Une seule réponse par question, pas de correction immédiate, difficulté
   croissante (facile → normal → difficile), puis la copie corrigée.
   ========================================================================= */
function ExamEngine(cfg){
  const host = cfg.host, Q = cfg.questions;
  const LIMIT = (cfg.minutes || 15) * 60;
  let i = 0, done = false, chrono = false, left = LIMIT, tk = null, elapsed = 0;
  const answers = [];

  const clock = el("span", {class: "sa-chrono", role: "timer"},
    [el("span", {"aria-hidden": "true", text: "⏱"}), el("span", {class: "v", text: "المؤقّت"})]);
  const mmss = t => Math.floor(t / 60) + " : " + String(t % 60).padStart(2, "0");
  function tick(){
    elapsed++;
    if (!chrono) return;
    left--;
    clock.querySelector(".v").textContent = left > 0 ? mmss(left) : "انتهى الوقت";
    clock.className = "sa-chrono " + (left <= 0 ? "out" : left <= 120 ? "warn" : "on");
    if (left === 0){
      Fx.beep("err");
      Msg.show(host, "note", "انتهى الوقت",
        "يمكنك إنهاء الاختبار بهدوء : لن يتوقف. سيُذكر الوقت فقط في التقرير النهائي.");
    }
  }
  const chronoBtn = el("button", {class: "sa-btn small", type: "button", text: "⏱ تفعيل المؤقّت (" + (cfg.minutes || 15) + " د)",
    "aria-pressed": "false",
    onclick: e => {
      chrono = !chrono;
      e.currentTarget.setAttribute("aria-pressed", chrono ? "true" : "false");
      e.currentTarget.textContent = chrono ? "⏱ إيقاف المؤقّت" : "⏱ تفعيل المؤقّت (" + (cfg.minutes || 15) + " د)";
      if (chrono){ left = LIMIT; clock.className = "sa-chrono on"; clock.querySelector(".v").textContent = mmss(left); }
      else { clock.className = "sa-chrono"; clock.querySelector(".v").textContent = "المؤقّت"; }
    }});

  const qn = el("span", {class: "qn", text: ""});
  const lvl = el("span", {class: "sa-lvl", "data-l": "", text: ""});
  const dots = el("div", {class: "sa-exam-dots", "aria-hidden": "true"});
  Q.forEach(() => dots.appendChild(el("i", {})));
  const head = el("div", {class: "sa-exam-head"}, [qn, lvl, chronoBtn, clock, dots]);
  const arena = el("div", {class: "sa-arena"});
  const node = el("div", {}, [head, arena]);

  function show(){
    const q = Q[i];
    let answered = false;
    qn.textContent = "السؤال " + (i + 1) + " / " + Q.length;
    lvl.textContent = q.lvl; lvl.setAttribute("data-l", q.lvl);
    [].forEach.call(dots.children, (x, k) => { x.className = k < i ? "done" : (k === i ? "on" : ""); });
    arena.innerHTML = "";
    arena.appendChild(el("p", {class: "sa-qtext", html: q.q}));
    if (q.fig) arena.appendChild(svgBox(q.fig(), q.cap));
    const grid = el("div", {class: "sa-choices"});
    q.options.forEach((o, k) => {
      const b = el("button", {class: "sa-choice", type: "button"});
      if (o.frac) b.appendChild(fracEl(o.frac[0], o.frac[1], "lg"));
      if (o.t) b.appendChild(el("span", {html: o.t}));
      b.addEventListener("click", () => {
        if (done || answered) return;
        answered = true;
        [].forEach.call(grid.children, x => x.disabled = true);
        b.classList.add(k === q.ok ? "good" : "bad");
        answers.push(k);
        Fx.beep("ok");
        setTimeout(() => { i++; if (i < Q.length) show(); else finish(); }, 420);
      });
      grid.appendChild(b);
    });
    arena.appendChild(grid);
    arena.appendChild(el("p", {class: "sa-cap",
      html: "إجابة واحدة فقط. التصحيح الكامل يظهر في نهاية الاختبار."}));
  }

  function finish(){
    done = true; clearInterval(tk);
    const score = Q.reduce((a, q, k) => a + (answers[k] === q.ok ? 1 : 0), 0);
    State.get(State.current).miss += (Q.length - score);
    qn.textContent = "انتهى الاختبار"; lvl.textContent = ""; lvl.setAttribute("data-l", "");
    [].forEach.call(dots.children, (x, k) => { x.className = answers[k] === Q[k].ok ? "done" : ""; });
    arena.innerHTML = "";

    const mention = score >= 9 ? "ممتاز" : score >= 7 ? "جيد" : score >= 5 ? "يحتاج إلى تثبيت" : "يحتاج إلى مراجعة";
    const box = el("div", {class: "sa-note"});
    box.appendChild(el("div", {class: "sc", html: score + "<small>/" + Q.length + "</small>"}));
    box.appendChild(el("p", {class: "mention", text: mention}));
    box.appendChild(el("p", {style: "font-weight:700;color:var(--muted);margin-top:4px",
      html: "⏱ الوقت المستغرق : <b>" + mmss(elapsed) + "</b>" +
        (chrono ? (left > 0 ? " · في الوقت المحدد ✓" : " · تجاوزت الوقت") : " · دون مؤقّت")}));
    const wrong = Q.filter((q, k) => answers[k] !== q.ok);
    box.appendChild(el("p", {class: "sa-lede", style: "margin:8px auto", html: wrong.length === 0
      ? "لا أخطاء : يمكنك خوض الاختبار الحقيقي دون قلق."
      : "راجع أولًا : <b>" + [].concat.apply([], wrong.map(q => q.rev)).filter((v, k, a) => a.indexOf(v) === k).join("، ") + "</b>."}));
    arena.appendChild(box);
    if (score >= 7) Fx.bigWin(); else Fx.beep("ok");

    arena.appendChild(el("h4", {style: "margin-top:18px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6C34E0",
      text: "ورقتك مصحَّحة"}));
    const copie = el("div", {class: "sa-copie"});
    Q.forEach((q, k) => {
      const good = answers[k] === q.ok;
      const it = el("div", {class: "it" + (good ? "" : " ko")});
      it.appendChild(el("p", {class: "qq", html: (k + 1) + ". " + q.q.replace(/<[^>]+>/g, "")}));
      const ans = el("div", {class: "ans"});
      if (!good) ans.appendChild(el("span", {class: "mine", html: "إجابتك : " + label(q.options[answers[k]])}));
      ans.appendChild(el("span", {class: "good", html: (good ? "✓ " : "الإجابة الصحيحة : ") + label(q.options[q.ok])}));
      it.appendChild(ans);
      it.appendChild(el("p", {class: "why", html: q.why}));
      if (!good) it.appendChild(el("p", {class: "rev", text: "← للمراجعة : " + q.rev}));
      copie.appendChild(it);
    });
    arena.appendChild(copie);
    arena.appendChild(el("div", {class: "sa-actions", style: "justify-content:center"}, [
      el("button", {class: "sa-btn ghost", type: "button", text: "↺ إعادة الاختبار",
        onclick: () => { i = 0; done = false; answers.length = 0; elapsed = 0; left = LIMIT;
          clock.className = "sa-chrono" + (chrono ? " on" : "");
          clock.querySelector(".v").textContent = chrono ? mmss(left) : "المؤقّت";
          tk = setInterval(tick, 1000); show(); }})]));
    if (cfg.onDone) cfg.onDone();
  }
  function label(o){ return o ? (o.frac ? o.frac[0] + "/" + o.frac[1] : String(o.t).replace(/<[^>]+>/g, "")) : "لا شيء"; }

  tk = setInterval(tick, 1000);
  show();
  return node;
}

/* =========================================================================
   9. MOTEUR « CHOIX »  (reconnaissance, diagnostic d'erreur, transfert)
      L'élève clique une carte : jamais de saisie de texte mathématique.
   ========================================================================= */
function MCQ(cfg){
  const host = cfg.host;
  let solved = false;
  const wrap = el("div", {});
  if (cfg.q) wrap.appendChild(prompt(cfg.q));
  if (cfg.visual) wrap.appendChild(svgBox(cfg.visual, cfg.caption));
  const grid = el("div", {class: "sa-choices", role: "group", "aria-label": cfg.q || "خيارات"});
  cfg.choices.forEach((c, i) => {
    const b = el("button", {class: "sa-choice", type: "button", "aria-pressed": "false"});
    if (c.frac) b.appendChild(fracEl(c.frac[0], c.frac[1], "lg"));
    if (c.svg) b.appendChild(c.svg);
    if (c.t) b.appendChild(el("span", {html: c.t}));
    if (c.tag) b.appendChild(el("span", {class: "tag", text: c.tag}));
    b.addEventListener("click", () => {
      if (solved || b.disabled) return;
      Guide.touch();
      if (c.ok){
        solved = true;
        b.classList.add("good"); b.setAttribute("aria-pressed", "true");
        grid.querySelectorAll("button").forEach(x => { if (x !== b) x.disabled = true; });
        Msg.ok(host, cfg.okTitle || "أحسنت", c.why || cfg.why || "");
        if (cfg.onDone) cfg.onDone();
      } else {
        b.classList.add("bad"); b.disabled = true;
        if (c.code) Msg.error(host, c.code, c.why || "");
        else { Msg.show(host, "err", "ليس بعد", c.why || "أعد النظر إلى الرسم قبل الاختيار."); State.streak = 0; State.paintChips(); Fx.fail(); }
        State.get(State.current).miss++;
      }
    });
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* =========================================================================
   10. MOTEUR « QUOTIENT »  —  partager a unités entre p personnes
       C'est le sens nouveau de la 6e : 3/4, c'est aussi le quart de 3.
   ========================================================================= */
function QuotientEngine(cfg){
  const host = cfg.host, A = cfg.units, P = cfg.people;
  const W = 720, H = 300;
  let k = 1, done = false;
  const svg = svgRoot("0 0 " + W + " " + H, A + " وحدات نقسمها بين " + P);
  hatchDefs(svg);
  const g = sv("g", {}); svg.appendChild(g);
  const info = el("span", {class: "sa-eq", html: ""});
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: "قسّم كل شيء، دون أن يبقى ولو قطعة واحدة",
    target: el("div", {class: "sa-goal"}, [
      el("div", {class: "g num"}, [el("div", {class: "v", text: String(A)}), el("div", {class: "l", text: "ألواح"})]),
      el("div", {class: "g den"}, [el("div", {class: "v", text: String(P)}), el("div", {class: "l", text: "أشخاص"})])
    ]),
    checks: [
      {id: "cut", tone: "den", todo: "إيجاد تقسيم يتوافق بالضبط", done: "التقسيم متوافق تمامًا"},
      {id: "share", tone: "num", todo: "التوزيع دون باقٍ", done: "حصل الجميع على القدر نفسه"}
    ]
  });

  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    const barW = 180, barH = 46, gap = 14;
    g.appendChild(txt(60, 26, "الألواح الـ " + A, {size: 12, fill: T.unit, anchor: "start", weight: 700}));
    for (let u = 0; u < A; u++){
      const x = 60 + u * (barW + gap), y = 40;
      g.appendChild(sv("rect", {x: x, y: y, width: barW, height: barH, rx: 9, fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
      for (let i = 0; i < k; i++)
        g.appendChild(sv("rect", {x: x + i * barW / k + 2, y: y + 2, width: barW / k - 4, height: barH - 4, rx: 5,
          fill: T.denMid, stroke: T.den, "stroke-width": 1.4}));
    }
    const total = A * k, each = Math.floor(total / P), left = total % P;
    g.appendChild(txt(60, 128, "الأشخاص الـ " + P, {size: 12, fill: T.unit, anchor: "start", weight: 700}));
    const pw = 140, pgap = 12;
    for (let p = 0; p < P; p++){
      const x = 60 + p * (pw + pgap), y = 142;
      g.appendChild(sv("rect", {x: x, y: y, width: pw, height: 74, rx: 12,
        fill: T.white, stroke: left === 0 ? T.ok : T.line, "stroke-width": 2, "stroke-dasharray": left === 0 ? "" : "6 5"}));
      for (let i = 0; i < each; i++){
        const cols = Math.min(each, 6), cw = (pw - 16) / cols;
        const cx = x + 8 + (i % cols) * cw, cy = y + 10 + Math.floor(i / cols) * 26;
        g.appendChild(sv("rect", {x: cx + 1, y: cy, width: cw - 3, height: 20, rx: 4, fill: "url(#sa-hatch)", stroke: T.num, "stroke-width": 1.2}));
      }
      g.appendChild(txt(x + pw / 2, y + 66, each + " × 1/" + k, {size: 12, mono: true, fill: T.muted}));
    }
    if (left > 0){
      g.appendChild(txt(60, 246, "الباقي : " + left + " قطعة يستحيل توزيعها على " + P,
        {size: 13, fill: T.err, anchor: "start", weight: 700}));
      for (let i = 0; i < left; i++)
        g.appendChild(sv("rect", {x: 60 + i * 26, y: 256, width: 22, height: 22, rx: 5, fill: T.errSoft, stroke: T.err, "stroke-width": 1.5}));
    }
    mission.mark("cut", (A * k) % P === 0, k === 1 ? "" : "<em style='opacity:.7'>(" + k + " أجزاء لكل لوح)</em>");
    mission.mark("share", done);
    info.innerHTML = A + " لوح × " + k + " أجزاء = <b>" + total + " قطعة</b> نقسمها بين <b>" + P + "</b>" +
      (left === 0 ? " ← <span style='color:#149B50'>متوافق تمامًا</span>" : " ← <span style='color:#B32530'>يبقى " + left + "</span>");
  }
  function check(){
    if (done) return;
    const total = A * k, left = total % P, each = total / P;
    if (left !== 0) return void Msg.show(host, "err", "لا يتوافق بالضبط",
      "بـ " + k + " أجزاء لكل لوح، يبقى " + left + " قطعة. جرّب تقسيمًا آخر.");
    done = true;
    mission.mark("share", true); mission.done("التقسيم متوافق تمامًا");
    const [sn, sd] = simplify(A, P);
    Msg.win(host, {
      title: "التقسيم متوافق تمامًا",
      words: "<span class='wn'>" + A + " ألواح</span><br>مقسَّمة بين <span class='wd'>" + P + "</span>",
      frac: [A, P],
      eq: A + " ÷ " + P + " = " + A + "/" + P + (isDecimalFraction(A, P) ? " = " + decimalOf(A, P) : "") +
          (sn + "/" + sd !== A + "/" + P ? "&nbsp;&nbsp;(= " + sn + "/" + sd + ")" : ""),
      say: "كل شخص يحصل على <b>" + each + " قطعة من 1/" + k + "</b>. شرطة الكسر هي إشارة <b>÷</b>."
    });
    if (cfg.onDone) cfg.onDone(k);
  }
  const rail = ToolRail("الأدوات");
  rail.field({ label: "✂️ <b>تقسيم</b>", note: "أجزاء لكل لوح",
    control: stepper({value: 1, min: 1, max: 8, label: "أجزاء لكل لوح", unit: "أجزاء",
      onchange: v => { k = v; Guide.touch(); Msg.clear(host); render(); }}) });
  rail.group("توزيع").add({ icon: "🎁", label: "توزيع",
    desc: "يوزّع القطع واحدة تلو الأخرى بين الأشخاص. إن بقي شيء، سيظهر لك.", on: check });
  rail.mount();
  render();
  return el("div", {}, [mission, rail, svgBox(svg, "جميع الألواح مقسَّمة بالطريقة نفسها، ثم نوزّع قطعة قطعة."),
    el("div", {class: "sa-readout"}, [info])]);
}

/* =========================================================================
   11. MOTEUR « QUANTITÉ »  —  la fraction devient opérateur
   ========================================================================= */
function QuantityEngine(cfg){
  const host = cfg.host, T = cfg.total, N = cfg.n, D = cfg.d;
  const W = 720, H = 250;
  let b = 1, sel = [], phase = "group", done = false;
  const svg = svgRoot("0 0 " + W + " " + H, T + " عناصر نقسمها");
  const g = sv("g", {}); svg.appendChild(g);
  const info = el("span", {class: "sa-eq", html: ""});
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: "خذ هذا الجزء من الـ " + T + " عنصرًا",
    target: fracEl(N, D, "xl"),
    checks: [
      {id: "grp", tone: "den", todo: "تكوين " + D + " مجموعات متساوية", done: D + " مجموعات متساوية جاهزة"},
      {id: "take", tone: "num", todo: "أخذ " + N + " مجموعات", done: N + " مجموعات مأخوذة"}
    ]
  });

  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    const per = Math.floor(T / b), left = T % b;
    const gw = (640 - (b - 1) * 10) / b;
    for (let k = 0; k < b; k++){
      const x = 40 + k * (gw + 10), on = !!sel[k];
      const rows = Math.ceil(per / Math.max(1, Math.floor(gw / 30)));
      const rect = sv("rect", {x: x, y: 30, width: gw, height: 150, rx: 12,
        fill: on ? T.numFaint : T.denFaint,
        stroke: on ? T.num : T.den, "stroke-width": on ? 2.5 : 1.5,
        style: phase === "select" ? "cursor:pointer" : ""});
      if (phase === "select"){
        rect.setAttribute("tabindex", "0"); rect.setAttribute("role", "button");
        rect.setAttribute("aria-pressed", on ? "true" : "false");
        rect.setAttribute("aria-label", "المجموعة " + (k + 1) + "، أدخل لأخذها");
        rect.addEventListener("click", () => pick(k));
        rect.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(k); } });
      }
      g.appendChild(rect);
      const cols = Math.max(1, Math.floor((gw - 14) / 26));
      for (let i = 0; i < per; i++){
        const cx = x + 12 + (i % cols) * 26, cy = 48 + Math.floor(i / cols) * 26;
        g.appendChild(sv("circle", {cx: cx + 8, cy: cy + 8, r: 9,
          fill: on ? T.num : T.unit, stroke: T.white, "stroke-width": 1.5}));
      }
      g.appendChild(txt(x + gw / 2, 196, per + " عناصر", {size: 12, fill: T.muted}));
    }
    if (left > 0){
      g.appendChild(txt(40, 222, "يبقى " + left + " عنصر : المجموعات غير متساوية",
        {size: 13, anchor: "start", fill: T.err, weight: 700}));
      for (let i = 0; i < left; i++) g.appendChild(sv("circle", {cx: 430 + i * 24, cy: 217, r: 9, fill: T.errGhost, stroke: T.err}));
    }
    const nSel = sel.filter(Boolean).length;
    mission.mark("grp", phase === "select", phase === "select" ? "" : "<em style='opacity:.7'>(حاليًا " + b + ")</em>");
    mission.mark("take", nSel === N, (nSel === 0 || nSel === N) ? "" : "<em style='opacity:.7'>(أُخذ " + nSel + ")</em>");
    info.innerHTML = phase === "group"
      ? T + " ÷ " + b + " = " + (left === 0 ? "<b>" + (T / b) + "</b> عناصر لكل مجموعة" : "<span style='color:#B32530'>لا يتوافق تمامًا</span>")
      : nSel + " مجموعة مأخوذة × " + (T / b) + " = <b style='color:#DB6414'>" + (nSel * T / b) + " عناصر</b>";
  }
  function pick(k){ sel[k] = !sel[k]; Guide.touch(); render(); check(); }
  function check(){
    if (done) return;
    if (phase === "group"){
      if (b !== D) return;
      if (T % b !== 0) return void Msg.error(host, "UNEQUAL_GROUPS");
      phase = "select"; sel = new Array(b).fill(false);
      Msg.ok(host, "مجموعات متساوية", "الـ " + T + " عنصرًا مقسَّمة إلى <b>" + D + " مجموعات من " + (T / D) + "</b>. المجموعة الواحدة تساوي 1/" + D + " من المجموع.");
      host.querySelector(".sa-prompt .ptext").innerHTML = "خذ الآن <b>" + N + " مجموعات</b> من أصل " + D + ".";
      mission.setAsk("الجزء الثاني : خذ " + N + " مجموعات");
      mission.flash("انتهى التكوين !", "تعليمة جديدة : خذ " + N + " مجموعات من " + D + ".");
      render(); return;
    }
    const nSel = sel.filter(Boolean).length;
    if (nSel === N){
      done = true; mission.mark("take", true); mission.done("أخذت الكمية الصحيحة");
      Msg.win(host, {
        title: "وجدت الكمية",
        strip: [N, D], count: false,
        words: "<span class='wn'>" + N + "/" + D + "</span> من " + T + " عناصر", big: (N * T / D) + " عناصر",
        eq: T + " ÷ " + D + " = " + (T / D) + " &nbsp;·&nbsp; " + (T / D) + " × " + N + " = " + (N * T / D),
        say: "<b>نقسم على " + D + "</b> لتكوين المجموعات، ثم <b>نضرب في " + N + "</b> لعدد المجموعات المأخوذة."
      });
      if (cfg.onDone) cfg.onDone();
    } else if (nSel > N) Msg.error(host, "WRONG_NUMERATOR", "أخذت " + nSel + " مجموعات، ويلزم " + N + ".");
  }
  const rail = ToolRail("الأدوات");
  rail.field({ label: "➗ <b>تكوين مجموعات</b>", note: "كم عدد المجموعات ؟",
    control: stepper({value: 1, min: 1, max: 8, label: "عدد المجموعات", unit: "مجموعات",
      onchange: v => { if (phase === "select") return; b = v; sel = []; Msg.clear(host); Guide.touch(); render(); check(); }}) });
  const gTake = rail.group("أخذ");
  const pickT = gTake.add({ icon: "✋", label: "أخذ مجموعات", desc: "اضغط على مجموعة كاملة لأخذها، وأعد الضغط لإعادتها.",
    on: () => Msg.show(host, "note", "الأداة نشطة", "اضغط مباشرة على المجموعات.") });
  gTake.add({ icon: "↩️", label: "إعادة الكل", desc: "يعيد المجموعات المأخوذة ويبدأ الاختيار من جديد.",
    on: () => { if (done || phase !== "select") return; sel = new Array(b).fill(false); Msg.clear(host); render(); } });
  rail.mount();
  const syncQ = () => {
    gTake.node.style.display = phase === "select" ? "" : "none";
    pickT.classList.toggle("active", phase === "select" && !done);
  };
  const _render = render; render = function(){ _render(); syncQ(); };
  render();
  return el("div", {}, [mission, rail, svgBox(svg, "اضبط عدد المجموعات : تضمن الأداة تساويها. وعليك أنت أن تقرر كم عددها."),
    el("div", {class: "sa-readout"}, [info])]);
}

/* =========================================================================
   12. MOTEUR « COMPARER »
       Deux bandes de MÊME unité : la comparaison se voit avant de se calculer.
       Un découpage commun peut être posé par-dessus les deux bandes.
   ========================================================================= */
function CompareEngine(cfg){
  const host = cfg.host, A = cfg.a, B = cfg.b;
  const W = 720, H = cfg.common ? 260 : 220, x0 = 60, w = 600;
  let N = 1, done = false, overlay = false;
  const svg = svgRoot("0 0 " + W + " " + H, "مقارنة كسرين");
  hatchDefs(svg);
  const g = sv("g", {}); svg.appendChild(g);
  const target = el("div", {class: "sa-goal"}, [
    fracEl(A[0], A[1], "lg"),
    el("div", {class: "g"}, [el("div", {class: "v", text: "؟"}), el("div", {class: "l", text: "أيّهما أكبر ؟"})]),
    fracEl(B[0], B[1], "lg")
  ]);
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: "قارن هذين الكسرين", target: target,
    checks: [
      {id: "look", tone: "den", todo: "النظر إلى الطول الملوَّن", done: "لاحظت الشريطين"},
      {id: "ans", tone: "num", todo: "اختيار الإشارة الصحيحة", done: "وجدت الإشارة الصحيحة"}
    ]
  });

  function bar(y, f, tag){
    g.appendChild(txt(x0 - 12, y + 30, tag, {size: 14, anchor: "end", mono: true, weight: 800, fill: T.ink}));
    g.appendChild(sv("rect", {x: x0, y: y, width: w, height: 54, rx: 10, fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
    for (let i = 0; i < f[1]; i++){
      const on = i < f[0];
      g.appendChild(sv("rect", {x: x0 + i * w / f[1] + 2, y: y + 2, width: w / f[1] - 4, height: 50, rx: 6,
        fill: on ? "url(#sa-hatch)" : T.denSoft, stroke: on ? T.num : T.den, "stroke-width": 1.5}));
    }
    if (N > 1) for (let k = 1; k < N; k++)
      g.appendChild(sv("line", {x1: x0 + k * w / N, y1: y - 4, x2: x0 + k * w / N, y2: y + 58, stroke: T.tool, "stroke-width": 1.4, opacity: .8}));
    g.appendChild(sv("line", {x1: x0 + f[0] / f[1] * w, y1: y - 10, x2: x0 + f[0] / f[1] * w, y2: y + 64,
      stroke: T.num, "stroke-width": 2, "stroke-dasharray": "4 4", opacity: .9}));
  }
  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    mission.mark("look", overlay || N > 1 || done);
    bar(26, A, A[0] + "/" + A[1]);
    bar(110, B, B[0] + "/" + B[1]);
    if (overlay){
      const xb = x0 + B[0] / B[1] * w;
      g.appendChild(sv("rect", {x: x0, y: 18, width: xb - x0, height: 70, rx: 8,
        fill: T.okGhost, stroke: T.ok, "stroke-width": 2, "stroke-dasharray": "7 5"}));
      g.appendChild(sv("line", {x1: xb, y1: 18, x2: xb, y2: 164, stroke: T.ok, "stroke-width": 2.5}));
      g.appendChild(txt(xb + 6, 14, B[0] + "/" + B[1] + " مسقَط هنا", {size: 12, fill: T.ok, anchor: "start", weight: 700}));
    }
    if (cfg.common){
      const okA = N % A[1] === 0, okB = N % B[1] === 0;
      g.appendChild(txt(x0, 210, "تقسيم مشترك : " + N + " أجزاء لكل وحدة — " +
        (okA && okB ? "الشريطان متوافقان ✓" : "شريط واحد على الأقل غير متوافق ✕"),
        {size: 13, anchor: "start", fill: okA && okB ? T.ok : T.muted}));
      if (okA && okB){
        g.appendChild(txt(x0, 232, A[0] + "/" + A[1] + " = " + (A[0] * N / A[1]) + "/" + N + "   ·   " +
          B[0] + "/" + B[1] + " = " + (B[0] * N / B[1]) + "/" + N, {size: 15, anchor: "start", mono: true, fill: T.ink, weight: 800}));
      }
    }
  }
  function answer(sym){
    if (done) return;
    const va = A[0] / A[1], vb = B[0] / B[1];
    const truth = va < vb ? "<" : (va > vb ? ">" : "=");
    if (sym === truth){
      done = true;
      mission.mark("ans", true); mission.done("مقارنة ناجحة");
      Msg.ok(host, "أحسنت الملاحظة", cfg.why || "");
      if (cfg.onDone) cfg.onDone();
    } else {
      if (A[0] === B[0] && ((sym === ">" && A[1] > B[1]) || (sym === "<" && A[1] < B[1])))
        Msg.error(host, "BIGGER_DEN_BIGGER");
      else Msg.show(host, "err", "انظر إلى الشريطين", "قارن الطول الملوَّن للشريطين، لا الأرقام المكتوبة.");
    }
  }
  const rail = ToolRail("الأدوات");
  rail.group("ملاحظة").add({ icon: "👀", label: "تراكب", desc: "يسقط طول الشريط الثاني على الأول لمقارنة سريعة.",
    preview: on => { if (!overlay) { overlay = on; render(); overlay = false; } },
    on: () => { overlay = !overlay; render(); Msg.show(host, "note", overlay ? "الشريطان متراكبان" : "أُزيل التراكب",
      overlay ? "الخط الأخضر يسقط طول الشريط الثاني على الأول." : "أنت تقارن الشريطين منفصلين من جديد."); } });
  if (cfg.common){
    rail.field({ label: "📏 <b>تقسيم مشترك</b>", note: "على الشريطين معًا",
      control: stepper({value: 1, min: 1, max: 24, label: "تقسيم مشترك", unit: "أجزاء",
        onchange: v => { N = v; Guide.touch(); render(); }}) });
  }
  rail.mount();
  const tools = rail;
  const ans = el("div", {class: "sa-actions"}, [
    el("span", {text: "الإجابة :", style: "font-size:13px;color:" + T.muted}),
    el("button", {class: "sa-btn", type: "button", dir: "ltr", html: A[0] + "/" + A[1] + " &lt; " + B[0] + "/" + B[1], onclick: () => answer("<")}),
    el("button", {class: "sa-btn", type: "button", dir: "ltr", html: A[0] + "/" + A[1] + " = " + B[0] + "/" + B[1], onclick: () => answer("=")}),
    el("button", {class: "sa-btn", type: "button", dir: "ltr", html: A[0] + "/" + A[1] + " &gt; " + B[0] + "/" + B[1], onclick: () => answer(">")})
  ]);
  render();
  return el("div", {}, [mission, tools, svgBox(svg, cfg.caption || "الشريطان يمثّلان الوحدة نفسها."), ans]);
}

/* =========================================================================
   13. MOTEUR « ÉGALITÉS DE FRACTIONS »
       split : on recoupe chaque part — la zone colorée ne bouge pas.
       group : on regroupe les parts — même chose, dans l'autre sens.
   ========================================================================= */
function EquivalenceEngine(cfg){
  const host = cfg.host;
  let n = cfg.start[0], d = cfg.start[1], done = false, preview = 0;
  const chain = [[n, d]];
  const W = 720, H = 130, x0 = 40, w = 640;
  const svg = svgRoot("0 0 " + W + " " + H, "كسر مكافئ");
  hatchDefs(svg);
  const g = sv("g", {}); svg.appendChild(g);
  const chainBox = el("div", {class: "sa-readout"});
  const live = fracEl(n, d, "lg");
  const goal = cfg.targetD
    ? el("div", {class: "sa-goal"}, [fracEl(cfg.start[0], cfg.start[1], "lg"),
        el("div", {class: "g"}, [el("div", {class: "v", text: "←"}), el("div", {class: "l", text: "القيمة نفسها"})]),
        el("div", {class: "g den"}, [el("div", {class: "v", text: "؟/" + cfg.targetD}), el("div", {class: "l", text: "الهدف"})])])
    : el("div", {class: "sa-goal"}, [fracEl(cfg.start[0], cfg.start[1], "lg"),
        el("div", {class: "g"}, [el("div", {class: "v", text: "←"}), el("div", {class: "l", text: "أبسط"})])]);
  const mission = MissionCard({
    eyebrow: "مهمتك",
    ask: cfg.targetD ? "اكتب الكمية نفسها كأجزاء من " + cfg.targetD : "بسّط إلى أقصى حد",
    target: goal,
    checks: [
      {id: "same", tone: "ok", todo: "يجب ألا تتحرك الكمية الملوَّنة", done: "الكمية الملوَّنة لم تتحرك"},
      {id: "goal", tone: "den",
       todo: cfg.targetD ? "الوصول إلى المقام " + cfg.targetD : "عدم إمكانية التجميع أكثر",
       done: cfg.targetD ? "بلغتَ المقام " + cfg.targetD : "كسر غير قابل للاختزال"}
    ]
  });

  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    g.appendChild(sv("rect", {x: x0, y: 30, width: w, height: 62, rx: 11, fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
    for (let i = 0; i < d; i++)
      g.appendChild(sv("rect", {x: x0 + i * w / d + 2, y: 32, width: w / d - 4, height: 58, rx: 6,
        fill: i < n ? "url(#sa-hatch)" : T.denSoft, stroke: i < n ? T.num : T.den, "stroke-width": 1.4}));
    if (preview > 1){
      if (cfg.untilIrreducible){
        for (let i = 1; i < d; i++) if (i % preview !== 0)
          g.appendChild(sv("line", {x1: x0 + i * w / d, y1: 26, x2: x0 + i * w / d, y2: 96,
            stroke: (n % preview === 0 && d % preview === 0) ? T.err : T.muted, "stroke-width": 3, "stroke-dasharray": "3 6"}));
      } else {
        const nd = d * preview;
        for (let i = 1; i < nd; i++) if (i % preview !== 0)
          g.appendChild(sv("line", {x1: x0 + i * w / nd, y1: 26, x2: x0 + i * w / nd, y2: 96,
            stroke: T.tool, "stroke-width": 2, "stroke-dasharray": "6 5"}));
      }
    }
    g.appendChild(sv("line", {x1: x0 + n / d * w, y1: 16, x2: x0 + n / d * w, y2: 108, stroke: T.ok, "stroke-width": 3}));
    g.appendChild(txt(x0 + n / d * w, 12, "الكمية نفسها", {size: 11, fill: T.ok, weight: 700}));
    setFrac(live, n, d);
    mission.mark("same", true);
    const goalOK = cfg.targetD ? d === cfg.targetD : (chain.length > 1 && isIrreducible(n, d));
    mission.mark("goal", goalOK, goalOK ? "" : "<em style='opacity:.7'>(أنت عند " + n + "/" + d + ")</em>");
    chainBox.innerHTML = "";
    chain.forEach((f, i) => {
      if (i) chainBox.appendChild(el("span", {class: "sa-eq", text: "="}));
      chainBox.appendChild(fracEl(f[0], f[1], i === chain.length - 1 ? "lg" : "md"));
    });
  }
  function split(k){
    if (done) return;
    if (d * k > 24) return void Msg.show(host, "note", "دقيق جدًا", "ستصبح الأجزاء غير مرئية. جرّب عاملًا أصغر.");
    n *= k; d *= k; chain.push([n, d]); Guide.touch(); Msg.clear(host); render(); check();
  }
  function group(k){
    if (done) return;
    if (n % k !== 0 || d % k !== 0)
      return void Msg.error(host, "WRONG_GROUPING", "هنا " + k + " لا يقسم " + (n % k !== 0 ? n : d) + ".");
    n /= k; d /= k; chain.push([n, d]); Guide.touch(); Msg.clear(host); render(); check();
  }
  function check(){
    if (cfg.targetD && d === cfg.targetD){
      done = true;
      Msg.win(host, {
        title: "العدد نفسه، كتابة مختلفة",
        chain: chain.slice(),
        say: "ضربنا الأعلى <b>و</b>الأسفل في العدد نفسه : الكمية الملوَّنة لم تتحرك قيد أنملة."
      });
      if (cfg.onDone) cfg.onDone();
    }
    if (cfg.untilIrreducible && isIrreducible(n, d)){
      done = true;
      Msg.win(host, {
        title: "كسر غير قابل للاختزال",
        chain: chain.slice(),
        say: "لم يعد بالإمكان التجميع أكثر : " + n + " و" + d + " ليس لهما قاسم مشترك بعد الآن."
      });
      if (cfg.onDone) cfg.onDone();
    }
  }
  const rail = ToolRail("الأدوات");
  const gAct = rail.group(cfg.untilIrreducible ? "تجميع" : "تقسيم");
  const gFix = rail.group("تصحيح");
  (cfg.untilIrreducible ? (cfg.factors || [2, 3, 4, 5, 6]) : (cfg.factors || [2, 3, 4])).forEach(k => {
    gAct.add({
      icon: cfg.untilIrreducible ? "🔗" : "✂️",
      label: (cfg.untilIrreducible ? "تجميع كل " : "تقسيم إلى ") + "<span class='k'>" + k + "</span>",
      desc: cfg.untilIrreducible
        ? "يجمع الأجزاء في حزم من " + k + ". يعمل فقط إذا كان " + k + " يقسم الأعلى والأسفل معًا."
        : "يقسّم كل جزء إلى " + k + " أجزاء متساوية : تبقى الكمية الملوَّنة كما هي.",
      preview: on => { preview = on ? k : 0; render(); },
      on: () => cfg.untilIrreducible ? group(k) : split(k)
    });
  });
  gFix.add({ icon: "↩️", label: "تراجع", desc: "يعود إلى الكتابة السابقة.",
    on: () => {
      if (done || chain.length < 2) return void Msg.show(host, "note", "لا شيء للتراجع عنه", "أنت عند الكتابة الأولى.");
      chain.pop(); n = chain[chain.length - 1][0]; d = chain[chain.length - 1][1];
      Msg.clear(host); render();
    } });
  rail.mount();
  render();
  return el("div", {}, [mission, rail, svgBox(svg, "الخط الأخضر يحدّد الكمية الملوَّنة : يجب ألا يتحرك أبدًا."),
    chainBox]);
}

/* =========================================================================
   14. MOTEUR « ADDITION / SOUSTRACTION »
       On ne donne pas la règle : l'élève cherche un découpage qui tombe juste
       pour les deux fractions à la fois.
   ========================================================================= */
function AddSubEngine(cfg){
  const host = cfg.host, A = cfg.a, B = cfg.b, op = cfg.op || "+";
  const W = 720, H = 250, x0 = 60, w = 600;
  let N = 1, done = false, converted = false, previewK = 0;
  const hist = [];
  const same = A[1] === B[1];
  const svg = svgRoot("0 0 " + W + " " + H, "جمع كسرين");
  hatchDefs(svg);
  const g = sv("g", {}); svg.appendChild(g);
  const info = el("span", {class: "sa-eq", html: same
    ? "الأجزاء متساوية الحجم بالفعل : يمكن عدّها معًا."
    : "الأجزاء ليست متساوية الحجم : لا يمكن عدّها معًا بعد."});
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: op === "+" ? "اجمع هذين الكسرين" : "اطرح هذين الكسرين",
    target: el("div", {class: "sa-goal"}, [fracEl(A[0], A[1], "lg"),
      el("div", {class: "g"}, [el("div", {class: "v", text: op}), el("div", {class: "l", text: "= ؟"})]),
      fracEl(B[0], B[1], "lg")]),
    checks: [
      {id: "same", tone: "den", todo: "يجب أن تكون الأجزاء متساوية الحجم", done: "الأجزاء متساوية الحجم"},
      {id: "sum", tone: "num", todo: "عدّ الأجزاء معًا", done: "الأجزاء معدودة"}
    ]
  });

  function bar(y, f, color){
    g.appendChild(sv("rect", {x: x0, y: y, width: w, height: 46, rx: 9, fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
    const dd = converted ? N : f[1], nn = converted ? f[0] * N / f[1] : f[0];
    for (let i = 0; i < dd; i++)
      g.appendChild(sv("rect", {x: x0 + i * w / dd + 2, y: y + 2, width: w / dd - 4, height: 42, rx: 5,
        fill: i < nn ? "url(#sa-hatch)" : T.denSoft, stroke: i < nn ? T.num : T.den, "stroke-width": 1.3}));
    g.appendChild(txt(x0 - 12, y + 28, nn + "/" + dd, {size: 15, anchor: "end", mono: true, weight: 800}));
    if (!converted && N > 1)
      for (let k = 1; k < N; k++)
        g.appendChild(sv("line", {x1: x0 + k * w / N, y1: y - 4, x2: x0 + k * w / N, y2: y + 50, stroke: T.tool, "stroke-width": 1.3, opacity: .85}));
    if (!converted && previewK > 1){
      const nn2 = N * previewK;
      for (let k = 1; k < nn2; k++) if (k % previewK !== 0)
        g.appendChild(sv("line", {x1: x0 + k * w / nn2, y1: y - 2, x2: x0 + k * w / nn2, y2: y + 48,
          stroke: T.tool, "stroke-width": 1.6, "stroke-dasharray": "5 4", opacity: .8}));
    }
  }
  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    bar(24, A); 
    g.appendChild(txt(x0 - 34, 100, op, {size: 26, weight: 800, fill: T.tool}));
    bar(84, B);
    if (done){
      const dd = N, nn = A[0] * N / A[1] + (op === "+" ? 1 : -1) * B[0] * N / B[1];
      g.appendChild(sv("line", {x1: x0 - 40, y1: 146, x2: x0 + w, y2: 146, stroke: T.line, "stroke-width": 2}));
      g.appendChild(sv("rect", {x: x0, y: 160, width: w, height: 52, rx: 9, fill: T.unitSoft, stroke: T.ok, "stroke-width": 2}));
      for (let i = 0; i < dd; i++)
        g.appendChild(sv("rect", {x: x0 + i * w / dd + 2, y: 162, width: w / dd - 4, height: 48, rx: 5,
          fill: i < nn ? "url(#sa-hatch)" : T.denSoft, stroke: i < nn ? T.num : T.den, "stroke-width": 1.3}));
      g.appendChild(txt(x0 - 12, 190, nn + "/" + dd, {size: 16, anchor: "end", mono: true, weight: 800, fill: T.ok}));
    }
  }
  function tryRaw(){
    if (done) return;
    if (same) return void finishSum(A[1]);
    Msg.error(host, "ADDED_DENOMINATORS",
      "انظر : جزء من " + A[1] + " ليس بحجم جزء من " + B[1] + ". يجب أولًا تقسيم الشريطين بالطريقة نفسها.");
  }
  function finishSum(nn){
    N = nn; converted = true; done = true;
    const a2 = A[0] * N / A[1], b2 = B[0] * N / B[1];
    const r = op === "+" ? a2 + b2 : a2 - b2;
    const [sn, sd] = simplify(r, N);
    render();
    mission.mark("same", true); mission.mark("sum", true); mission.done("انتهى الحساب");
    info.innerHTML = a2 + "/" + N + " " + op + " " + b2 + "/" + N + " = <b style='color:#149B50'>" + r + "/" + N + "</b>";
    Msg.win(host, {
      title: same ? "المقام لا يتغيّر" : "الأجزاء متساوية الحجم أخيرًا",
      strip: [r, N],
      words: a2 + " " + op + " " + b2 + " أجزاء<br>من <span class='wd'>1/" + N + "</span>",
      frac: [r, N], count: false,
      eq: A[0] + "/" + A[1] + " " + op + " " + B[0] + "/" + B[1] + " = " + r + "/" + N +
          (sn + "/" + sd !== r + "/" + N ? " = " + sn + "/" + sd : ""),
      deco: same ? "نجمع <span class='wn'>البسطين</span>، و<span class='wd'>المقام لا يتحرك</span>" : null,
      say: same
        ? "الأجزاء متساوية الحجم أصلًا : نعدّ فقط كم لدينا منها في المجموع."
        : "لا نعدّ معًا إلا قطعًا <b>متساوية الحجم</b>."
    });
    if (cfg.onDone) cfg.onDone();
  }
  function testN(){
    if (done) return;
    const okA = N % A[1] === 0, okB = N % B[1] === 0;
    if (!okA || !okB)
      return void Msg.error(host, "WRONG_COMMON_DEN",
        N + " لا يناسب " + (!okA ? A[1] : B[1]) + " : التقسيم لا يتوافق مع الخطوط الموجودة.");
    finishSum(N);
  }
  const rail = ToolRail("الأدوات");
  rail.group("حساب").add({
    icon: "🧮", label: same ? "عدّ الأجزاء معًا" : "الجمع كما هو",
    desc: same ? "الأجزاء متساوية الحجم : يمكن عدّ المجموع مباشرة."
               : "جرّب الجمع دون تغيير شيء : انظر ماذا يحدث.",
    on: tryRaw });
  const gCut = same ? null : rail.group("تقسيم");
  if (!same) [2, 3, 5].map(k => gCut.add({
    icon: "✂️", label: "قسّم الشريطين إلى <span class='k'>" + k + "</span>",
    desc: "يقسّم كل جزء من الشريطين معًا إلى " + k + " : يبقى التقسيم متطابقًا على الجانبين.",
    preview: on => { previewK = on ? k : 0; render(); },
    on: () => { if (done) return; if (N * k > 36) return void Msg.show(host, "note", "دقيق جدًا", "ستصبح الأجزاء غير مرئية. تراجع وجرّب طريقًا آخر.");
      hist.push(N); N *= k; converted = false; Guide.touch(); Msg.clear(host); render(); }
  }));
  if (!same) gCut.add({ icon: "✅", label: "عدّ القطع", desc: "يتحقق من توافق التقسيم على الشريطين، ثم يحسب.",
    on: testN });
  if (!same) rail.group("تصحيح").add({ icon: "↩️", label: "تراجع", desc: "يعود إلى التقسيم السابق.",
    on: () => { if (done || !hist.length) return void Msg.show(host, "note", "لا شيء للتراجع عنه", "الشريطان في حالتهما الأولى.");
      N = hist.pop(); converted = false; Msg.clear(host); render(); } });
  rail.mount();
  const _rAS = render; render = function(){ _rAS(); mission.mark("same", same || converted); mission.mark("sum", done); };
  render();
  return el("div", {}, [mission, rail, svgBox(svg, same
      ? "الشريطان مقسَّمان بالطريقة نفسها : الأجزاء قابلة للتبادل."
      : "الشريطان يمثّلان الوحدة نفسها. يعمل المقص دائمًا على الاثنين معًا."),
    el("div", {class: "sa-readout"}, [info])]);
}

/* =========================================================================
   15. MOTEUR « AIRE »  —  fraction d'une fraction (produit)
   ========================================================================= */
function AreaEngine(cfg){
  const host = cfg.host, A = cfg.a, B = cfg.b;
  const S = 300, W = 720, H = 360, ox = 210, oy = 30;
  let cols = [], rows = [], phase = "col", done = false, hoverC = -1, hoverR = -1;
  const svg = svgRoot("0 0 " + W + " " + H, "نموذج المساحة");
  hatchDefs(svg);
  const g = sv("g", {}); svg.appendChild(g);
  const info = el("span", {class: "sa-eq", html: ""});

  function render(){
    while (g.firstChild) g.removeChild(g.firstChild);
    g.appendChild(sv("rect", {x: ox, y: oy, width: S, height: S, rx: 10, fill: T.unitFaint, stroke: T.unit, "stroke-width": 2}));
    for (let c = 0; c < A[1]; c++) for (let r = 0; r < B[1]; r++){
      const x = ox + c * S / A[1], y = oy + r * S / B[1];
      const inC = cols[c], inR = rows[r];
      let fill = "transparent";
      if (inC && inR) fill = T.toolGhost;
      else if (inC) fill = T.numGhost;
      else if (inR) fill = T.denGhost;
      const previewing = !done && ((phase === "col" && c === hoverC && !inC) || (phase === "row" && r === hoverR && !inR));
      if (previewing) fill = phase === "col" ? T.numFaint : T.denSoft;
      const cell = sv("rect", {x: x + 1, y: y + 1, width: S / A[1] - 2, height: S / B[1] - 2, rx: 3,
        fill: fill, stroke: T.ghost, "stroke-width": 1, style: "cursor:pointer",
        tabindex: "0", role: "button",
        "aria-label": "خانة العمود " + (c + 1) + "، الصف " + (r + 1) + (phase === "col" ? " (اختر عمودًا)" : " (اختر صفًّا)")});
      cell.addEventListener("click", () => hit(c, r));
      cell.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); hit(c, r); } });
      const over = () => { hoverC = c; hoverR = r; render(); };
      const out = () => { hoverC = -1; hoverR = -1; render(); };
      cell.addEventListener("mouseenter", over); cell.addEventListener("focus", over);
      cell.addEventListener("mouseleave", out); cell.addEventListener("blur", out);
      g.appendChild(cell);
      if (inC && inR) g.appendChild(txt(x + S / A[1] / 2, y + S / B[1] / 2 + 5, "✓", {size: 13, fill: T.white}));
    }
    g.appendChild(txt(ox + S / 2, oy - 10, A[0] + "/" + A[1] + " أعمدة", {size: 13, fill: T.num, weight: 700}));
    g.appendChild(txt(ox - 12, oy + S / 2, B[0] + "/" + B[1], {size: 13, fill: T.den, weight: 700, anchor: "end"}));
    g.appendChild(txt(ox - 12, oy + S / 2 + 18, "صفوف", {size: 11, fill: T.den, anchor: "end"}));
    const nc = cols.filter(Boolean).length, nr = rows.filter(Boolean).length;
    info.innerHTML = "أعمدة مأخوذة : <b style='color:#DB6414'>" + nc + "/" + A[1] + "</b> · صفوف مأخوذة : <b style='color:#0D82C4'>" + nr + "/" + B[1] +
      "</b> · خانات مزدوجة : <b style='color:#6C34E0'>" + (nc * nr) + "/" + (A[1] * B[1]) + "</b>";
  }
  function hit(c, r){
    if (done) return;
    Guide.touch();
    if (phase === "col"){
      cols[c] = !cols[c]; render();
      const nc = cols.filter(Boolean).length;
      if (nc === A[0]){ phase = "row"; render();
        Msg.ok(host, "أعمدة مأخوذة", "أخذت " + A[0] + "/" + A[1] + " من السطح. الآن، خذ " + B[0] + "/" + B[1] + " <b>من هذه الأعمدة</b> بالضغط على صفوف."); }
      else if (nc > A[0]) Msg.error(host, "WRONG_NUMERATOR", "يلزم " + A[0] + " أعمدة.");
    } else {
      rows[r] = !rows[r]; render();
      const nr = rows.filter(Boolean).length;
      if (nr === B[0]){
        done = true;
        const n = A[0] * B[0], d = A[1] * B[1], [sn, sd] = simplify(n, d);
        Msg.win(host, {
          title: "الناتج يُرى بوضوح",
          words: A[0] + " × " + B[0] + " خانات مأخوذة<br>من " + A[1] + " × " + B[1],
          frac: [n, d],
          eq: A[0] + "/" + A[1] + " × " + B[0] + "/" + B[1] + " = " + n + "/" + d + (sn + "/" + sd !== n + "/" + d ? " = " + sn + "/" + sd : ""),
          say: "الخانات البنفسجية هي التي أُخذت <b>مرتين</b>."
        });
        if (cfg.onDone) cfg.onDone();
      } else if (nr > B[0]) Msg.error(host, "WRONG_NUMERATOR", "يلزم " + B[0] + " صفوف.");
    }
  }
  const rail = ToolRail("الأدوات");
  const colT = rail.add({ icon: "👆", label: "أخذ عمود", desc: "مرّر فوق خانة : يضيء العمود كاملًا. اضغط لأخذه.",
    on: () => Msg.show(host, "note", "الأداة نشطة", "اضغط على خانة : يُؤخذ العمود بأكمله.") });
  const rowT = rail.add({ icon: "👆", label: "أخذ صف", desc: "مرّر فوق خانة : يضيء الصف كاملًا. اضغط لأخذه.",
    on: () => Msg.show(host, "note", "الأداة نشطة", "اضغط على خانة : يُؤخذ الصف بأكمله.") });
  rail.add({ icon: "↩️", label: "تراجع", desc: "يعيد آخر عمود أو صف مأخوذ.",
    on: () => { if (done) return;
      if (phase === "row" && rows.filter(Boolean).length){ for (let i = rows.length - 1; i >= 0; i--) if (rows[i]){ rows[i] = false; break; } }
      else if (cols.filter(Boolean).length){ phase = "col"; for (let i = cols.length - 1; i >= 0; i--) if (cols[i]){ cols[i] = false; break; } }
      Msg.clear(host); render(); } });
  rail.add({ icon: "↺", label: "إعادة البدء", desc: "يعيد مربع الوحدة كاملًا.",
    on: () => { cols = []; rows = []; phase = "col"; done = false; Msg.clear(host); render(); } });
  rail.mount();
  const syncA = () => {
    colT.classList.toggle("active", phase === "col" && !done);
    rowT.classList.toggle("active", phase === "row" && !done);
    colT.disabled = phase !== "col" || done; rowT.disabled = phase !== "row" || done;
  };
  const _renderA = render; render = function(){ _renderA(); syncA(); };
  render();
  return el("div", {}, [rail, svgBox(svg, "المربع يساوي 1. برتقالي = الكسر الأول، أزرق = الثاني، بنفسجي = كلاهما معًا."),
    el("div", {class: "sa-readout"}, [info])]);
}

/* =========================================================================
   16. MOTEUR « TRI »  —  cartes à ranger dans des coffres
   ========================================================================= */
function SortEngine(cfg){
  const host = cfg.host;
  let picked = null, placed = 0, done = false;
  const wrap = el("div", {});
  const mission = MissionCard({
    eyebrow: "مهمتك", ask: "رتّب البطاقات الـ " + cfg.tokens.length + " في الصندوق الصحيح",
    count: cfg.tokens.length,
    checks: [{id: "all", tone: "num", todo: "0 بطاقة مرتّبة من " + cfg.tokens.length,
              done: cfg.tokens.length + " بطاقات مرتّبة"}]
  });
  wrap.appendChild(mission);
  const buckets = el("div", {class: "sa-buckets"});
  const slots = {};
  cfg.buckets.forEach(b => {
    const slot = el("div", {class: "slot"});
    slots[b.key] = slot;
    const box = el("button", {class: "sa-bucket", type: "button", "aria-label": "ترتيب في " + b.label},
      [el("h4", {html: b.label}), slot]);
    box.addEventListener("click", () => drop(b));
    buckets.appendChild(box);
  });
  const rack = el("div", {class: "sa-tokens"});
  cfg.tokens.forEach((t, i) => {
    const b = el("button", {class: "sa-token", type: "button", "aria-pressed": "false",
      "aria-label": t.n + " من " + t.d}, [fracEl(t.n, t.d, "md")]);
    const mini = fractionStrip(t.n, t.d, {w: 150, h: 20});
    mini.setAttribute("style", "width:96px");
    b.appendChild(mini);
    b.addEventListener("click", () => {
      if (b.classList.contains("placed") || done) return;
      if (picked && picked.node === b){ picked = null; b.setAttribute("aria-pressed", "false");
        return void Msg.show(host, "note", "أُعيدت البطاقة", "اختر بطاقة أخرى في أي وقت."); }
      rack.querySelectorAll(".sa-token").forEach(x => x.setAttribute("aria-pressed", "false"));
      picked = {node: b, data: t}; b.setAttribute("aria-pressed", "true");
      Msg.show(host, "note", "بطاقة في يدك", "اضغط على الصندوق الذي ترتّبها فيه — أو أعد الضغط على البطاقة لإعادتها.");
      Guide.touch();
    });
    rack.appendChild(b);
  });
  function drop(bucket){
    if (!picked || done) return;
    const t = picked.data;
    if (bucket.test(t.n, t.d)){
      picked.node.classList.add("placed", "good");
      picked.node.setAttribute("aria-pressed", "false");
      picked.node.disabled = true;
      slots[bucket.key].appendChild(fracEl(t.n, t.d, "sm"));
      picked.node.style.display = "none";
      placed++;
      mission.setStep(Math.min(placed + 1, cfg.tokens.length), cfg.tokens.length);
      mission.mark("all", placed === cfg.tokens.length, placed === cfg.tokens.length ? "" : "<em style='opacity:.7'>(" + placed + "/" + cfg.tokens.length + ")</em>");
      Msg.ok(host, "أُحسن الترتيب", bucket.why ? bucket.why(t) : "");
      picked = null;
      if (placed === cfg.tokens.length){
        done = true; mission.done("رُتِّبت جميع البطاقات");
        Msg.ok(host, "انتهى الترتيب", cfg.final || "");
        if (cfg.onDone) cfg.onDone();
      }
    } else {
      picked.node.classList.add("bad");
      setTimeout(() => picked && picked.node.classList.remove("bad"), 900);
      Msg.show(host, "err", "ليس هذا الصندوق", cfg.wrong ? cfg.wrong(t) : "قارن البسط والمقام، ثم انظر إلى الشريط الصغير.");
      State.get(State.current).miss++;
    }
  }
  wrap.appendChild(buckets);
  wrap.appendChild(rack);
  wrap.appendChild(el("div", {class: "sa-actions"}, [hintButton()]));
  return wrap;
}

/* =========================================================================
   17. MOTEUR « FRACTION PILOTÉE »
       On agit sur le numérateur et sur le dénominateur : le dessin obéit.
       La mission à construire reste affichée en haut, en gros, avec deux
       voyants (un par nombre) : l'élève voit lequel des deux est déjà bon.
       Quand une fraction est réussie, la mission suivante s'annonce
       clairement — bandeau, animation, message vocalisé (aria-live).
   ========================================================================= */
function LinkedFractionEngine(cfg){
  const host = cfg.host;
  let n = 1, d = 2, ti = 0, done = false;

  const targetFrac = fracEl(cfg.targets[0][0], cfg.targets[0][1], "xl");
  const mission = MissionCard({
    count: cfg.targets.length, ask: "ابنِ هذا الكسر", target: targetFrac,
    checks: [
      {id: "den", tone: "den", todo: "يلزم جزآن", done: "المقام موجود"},
      {id: "num", tone: "num", todo: "يلزم أخذ 1", done: "البسط موجود"}
    ]
  });

  const view = el("div", {class: "sa-svgbox"});
  const big = fracEl(n, d, "xl");

  const chainLine = el("div", {class: "sa-readout", style: "display:none"}, [el("span", {class: "sa-eq"})]);

  function draw(){
    view.innerHTML = "";
    view.appendChild(fractionStrip(n, d, {w: 620, h: 54, mixed: true}));
    setFrac(big, n, d);
    if (n > d){
      chainLine.style.display = "";
      chainLine.firstChild.innerHTML = "<b style='color:#149B50'>" + mixedChain(n, d) + "</b>";
    } else chainLine.style.display = "none";
    const t = cfg.targets[ti];
    if (!t) return;
    mission.setStep(ti + 1, cfg.targets.length);
    setFrac(targetFrac, t[0], t[1]);
    const denOK = d === t[1], numOK = n === t[0];
    mission.setCheck("den", {todo: "يلزم " + t[1] + " أجزاء", done: "المقام : " + t[1] + " أجزاء"});
    mission.setCheck("num", {todo: "يلزم أخذ " + t[0], done: "البسط : " + t[0] + " أجزاء مأخوذة"});
    mission.mark("den", denOK, denOK ? "" : "<em style='opacity:.7'>(لديك " + d + ")</em>");
    mission.mark("num", numOK, numOK ? "" : "<em style='opacity:.7'>(لديك " + n + ")</em>");
    if (!done && denOK && numOK) hit();
  }

  function hit(){
    const t = cfg.targets[ti];
    ti++;
    Fx.win(mission, 5);
    if (ti >= cfg.targets.length){
      done = true;
      mission.done("بُنيت الكسور الثلاثة");
      const big1 = cfg.targets.filter(f => f[0] > f[1])[0];
      Msg.win(host, {
        title: "أنت تتحكم بالكسر",
        chain: cfg.targets.slice(),
        deco: big1 ? mixedChain(big1[0], big1[1]) : null,
        say: cfg.final || "<b style='color:#0D82C4'>المقام</b> يحدد التقسيم، و<b style='color:#DB6414'>البسط</b> يحدد التلوين."
      });
      if (cfg.onDone) cfg.onDone();
      return;
    }
    const nx = cfg.targets[ti];
    Msg.ok(host, "بُني الكسر " + t[0] + "/" + t[1],
      "المهمة التالية : ابنِ <b>" + nx[0] + "/" + nx[1] + "</b>" +
      (nx[0] > nx[1] ? " — تنبيه، إنه <b>أكبر من 1</b> : ستحتاج شريطًا ثانيًا (" +
        mixedChain(nx[0], nx[1]) + ")." : "."));
    mission.flash("كسر جديد !", "كسر جديد لبنائه : " + nx[0] + " من " + nx[1] + ".");
    draw();
  }

  const rail = ToolRail("الأدوات");
  const nS = stepper({value: n, min: 0, max: 16, label: "البسط", unit: "مأخوذة",
    onchange: v => { n = v; Guide.touch(); draw(); }});
  const dS = stepper({value: d, min: 1, max: 12, label: "المقام", unit: "أجزاء",
    onchange: v => { d = v; Guide.touch(); draw(); }});
  nS.classList.add("num"); dS.classList.add("den");
  rail.field({ label: "✂️ <b style='color:#0D82C4'>المقام</b>", note: "يقسّم الوحدة", control: dS });
  rail.field({ label: "🖍️ <b style='color:#DB6414'>البسط</b>", note: "يلوّن الأجزاء", control: nS });
  rail.mount();
  rail.tell("غيّر المقام أولًا : لاحظ ما يتغيّر في الرسم.");

  draw();
  return el("div", {}, [mission, rail, view, chainLine,
    el("div", {class: "sa-readout"}, [
      el("div", {class: "leg den"}, [el("b", {text: "المقام"}), el("span", {text: "في كم جزء نقسّم"})]),
      big,
      el("div", {class: "leg num"}, [el("b", {text: "البسط"}), el("span", {text: "كم جزءًا نأخذ"})])
    ])]);
}

/* =========================================================================
   19. LECTEUR DE MODULE  —  machine à états d'une activité
       INTRO → PRÊT → MANIPULATION → (ERREUR → GUIDAGE → RETRY) → RÉUSSITE → SUITE
   ========================================================================= */
const PHASE_LABEL = {
  text: "موقف", retain: "احفظ هذا", partition: "تطبيق عملي", linked: "تطبيق عملي",
  quotient: "تطبيق عملي", quantity: "تطبيق عملي", numberline: "تطبيق عملي",
  sort: "اكتشاف", compare: "تدرّب", equiv: "اكتشاف", addsub: "اكتشاف", recap: "تلخيص",
  diag: "تشخيص", exam: "اختبار",
  area: "تطبيق عملي", mcq: "تحدٍّ"
};

/* Une île refaite ne repropose pas les mêmes nombres : chaque étape peut
   porter des variantes (`alts`), et le compteur de passages en choisit une. */
function planOf(mod){
  const run = State.get(mod.id).runs || 0;
  return mod.steps.map(st => {
    if (!st.alts || !st.alts.length) return st;
    const v = run % (st.alts.length + 1);
    if (v === 0) return st;
    const o = st.alts[v - 1], c = {};
    for (const k in st) if (k !== "alts") c[k] = st[k];
    for (const k in o) c[k] = o[k];
    return c;
  });
}

function openModule(id, atStep){
  const st = State.get(id);
  if (st.status === "new") st.status = "doing";
  State.current = id; State.step = 0;
  State.plan = planOf(MODULES.find(m => m.id === id));
  State.paint();
  const mod = MODULES.find(m => m.id === id);
  const main = $("#sa-main"); main.innerHTML = "";

  const crumb = el("div", {class: "sa-crumb"}, [
    el("span", {text: "🏝️ " + mod.arc}), el("span", {text: "·"}), el("b", {text: mod.title}),
    el("span", {text: "· ≈ " + mod.mins + " د"})
  ]);
  const dots = el("div", {class: "sa-steps", id: "sa-dots", "aria-label": "التقدّم في الوحدة"});
  State.plan.forEach(() => dots.appendChild(el("i", {})));
  crumb.appendChild(dots);

  const flow = el("div", {class: "sa-flow", id: "sa-flow"});
  main.appendChild(el("div", {class: "sa-stage"}, [crumb, flow]));
  if (window.scrollTo) window.scrollTo({top: 0, behavior: "instant"});
  pushStep(clamp(atStep || 0, 0, State.plan.length - 1));
}

/* une étape s'ajoute SOUS la précédente : à la fin du module, l'élève
   fait défiler et revoit tout ce qu'il vient de construire. */
function pushStep(i, fresh){
  const mod = MODULES.find(m => m.id === State.current);
  const plan = State.plan || mod.steps;
  const s = plan[i];
  State.step = i;
  State.place = {id: mod.id, step: i}; State.persist();
  Guide.clear();
  const flow = $("#sa-flow");
  if (fresh) flow.innerHTML = "";
  [].forEach.call(flow.querySelectorAll(".sa-panel"), p => p.classList.add("past"));

  const panel = el("div", {class: "sa-panel"});
  const phase = PHASE_LABEL[s.kind] || "";
  panel.appendChild(el("div", {class: "sa-phead"}, [
    el("span", {class: "st", text: "الخطوة " + (i + 1) + " / " + plan.length}),
    phase ? el("span", {class: "ph", "data-k": phase, text: phase}) : null
  ]));
  panel.appendChild(el("h2", {class: "sa-title", html: s.title || mod.title}));
  if (s.lede) panel.appendChild(el("p", {class: "sa-lede", html: s.lede}));

  const actions = el("div", {class: "sa-actions"});
  const next = el("button", {class: "sa-btn primary", type: "button",
    text: i + 1 < plan.length ? "متابعة ←" : "إنهاء الجزيرة ←", disabled: "disabled"});
  let unlocked = false;
  const unlock = () => {
    if (unlocked) return; unlocked = true;
    State.get(mod.id).hits++;
    next.disabled = false;
    next.classList.add("ok", "jump");
    if (s.kind !== "text" && s.kind !== "retain" && s.kind !== "recap"){
      State.bumpStreak(); Fx.win(next, 10);
      if (next.focus) next.focus({preventScroll: true});
    }
  };
  next.addEventListener("click", () => {
    actions.replaceWith(el("div", {class: "sa-stepdone"}, [el("span", {text: "✓"}),
      el("span", {text: "اكتملت الخطوة " + (i + 1)})]));
    State.award(10);
    if (i + 1 < plan.length) pushStep(i + 1);
    else finishModule(mod);
  });

  panel.appendChild(BUILD[s.kind](s, panel, unlock));
  actions.appendChild(el("button", {class: "sa-btn ghost", type: "button", text: "→ الخريطة", onclick: renderMap}));
  actions.appendChild(next);
  panel.appendChild(actions);
  flow.appendChild(panel);

  const dd = $("#sa-dots");
  if (dd) [].forEach.call(dd.children, (x, k) => { x.className = k < i ? "past" : (k === i ? "on" : ""); });
  if (panel.scrollIntoView && i > 0) setTimeout(() => panel.scrollIntoView({behavior: "smooth", block: "start"}), 60);
  return panel;
}
/* utilisé pour rejouer une étape isolée (navigation, tests) */
function renderStep(){ pushStep(State.step, true); }

function finishModule(mod){
  const st = State.get(mod.id);
  st.runs = (st.runs || 0) + 1;
  State.place = null;
  const stars = st.miss === 0 ? 3 : (st.miss <= 2 ? 2 : 1);
  st.stars = Math.max(st.stars, stars);
  st.status = st.stars === 3 ? "master" : "done";
  State.award(40); State.paint();
  Guide.clear(); Fx.bigWin();

  const flow = $("#sa-flow");
  [].forEach.call(flow.querySelectorAll(".sa-panel"), p => p.classList.add("past"));

  const panel = el("div", {class: "sa-panel sa-done"});
  panel.appendChild(el("div", {class: "sa-kicker", text: "اكتملت الجزيرة"}));
  panel.appendChild(el("div", {class: "sa-badge", "aria-hidden": "true", text: stars === 3 ? "🏆" : "🎉"}));
  panel.appendChild(el("p", {class: "big", html: mod.title}));
  const stars3 = el("div", {class: "sa-stars", "aria-label": stars + " نجوم من 3"});
  for (let i = 0; i < 3; i++) stars3.appendChild(el("span", {class: i < stars ? "on" : "", text: "★"}));
  panel.appendChild(stars3);
  panel.appendChild(el("p", {class: "sa-lede", style: "margin:0 auto",
    html: stars === 3 ? "دون أي خطأ : هذه الجزيرة <b>متقَنة</b>."
      : "أنجزت الجزيرة. أعدها دون خطأ للحصول على الإتقان."}));
  panel.appendChild(el("div", {class: "sa-scorebar"}, [
    el("span", {html: "✓ " + st.hits + " إجابات صحيحة"}),
    el("span", {html: "↺ " + st.miss + " محاولات مصحَّحة"}),
    el("span", {html: "🔥 أفضل سلسلة : " + State.best}),
    el("span", {html: "+40 ⭐"})
  ]));
  if (mod.takeaway) panel.appendChild(retainCard(mod.takeaway));
  panel.appendChild(el("p", {class: "sa-cap",
    html: "↑ مرّر إلى الأعلى : كل ما بنيته لا يزال موجودًا هناك."}));

  const idx = MODULES.findIndex(m => m.id === mod.id);
  const acts = el("div", {class: "sa-actions", style: "justify-content:center"});
  acts.appendChild(el("button", {class: "sa-btn ghost", type: "button", text: "↺ إعادة هذه الجزيرة",
    onclick: () => { const x = State.get(mod.id); x.miss = 0; x.hits = 0; openModule(mod.id); }}));
  acts.appendChild(el("button", {class: "sa-btn ghost", type: "button", text: "🗺️ الأرخبيل", onclick: renderMap}));
  if (idx < MODULES.length - 1)
    acts.appendChild(el("button", {class: "sa-btn primary", type: "button", text: "الجزيرة التالية ←",
      onclick: () => openModule(MODULES[idx + 1].id)}));
  else
    acts.appendChild(el("button", {class: "sa-btn primary", type: "button", text: "مشاهدة التقرير النهائي ←",
      onclick: renderFinal}));
  panel.appendChild(acts);
  flow.appendChild(panel);
  if (panel.scrollIntoView) setTimeout(() => panel.scrollIntoView({behavior: "smooth", block: "start"}), 60);
}

/* la progression de la leçon, du concret vers l'écriture */
function progressionArt(){
  const steps = [["وحدة", "\u2b1c"], ["تقسيم", "\u2702"], ["كسر", "\u00be"], ["تمثيل", "\u25a8"], ["مستقيم مدرّج", "\ud83d\udccd"],
                 ["مقارنة", "\u2696"], ["تكافؤ", "\ud83d\udd04"], ["تبسيط", "\ud83d\udd17"], ["حساب", "\u2795"], ["مسائل", "\ud83c\udfaf"]];
  const W = 720, bw = 122, bh = 58, gap = 18;
  const H = 2 * bh + 3 * gap + 46;
  const svg = svgRoot("0 0 " + W + " " + H, "fil conducteur de la leçon");
  steps.forEach((st, i) => {
    const row = i < 5 ? 0 : 1, k = i < 5 ? i : i - 5;
    const x = 22 + k * (bw + gap), y = gap + row * (bh + gap + 26);
    const col = i < 3 ? T.num : i < 6 ? T.den : i < 8 ? T.tool : T.ok;
    svg.appendChild(sv("rect", {x: x, y: y, width: bw, height: bh, rx: 13, fill: "#fff", stroke: col, "stroke-width": 2.5}));
    svg.appendChild(txt(x + bw / 2, y + 25, st[1], {size: 18}));
    svg.appendChild(txt(x + bw / 2, y + 45, st[0], {size: 11, fill: col, weight: 800}));
    if (i === 4)
      svg.appendChild(sv("path", {d: "M" + (x + bw / 2) + " " + (y + bh) + " v14 q0 12 -12 12 H" + (22 + bw / 2),
        fill: "none", stroke: T.toolLine, "stroke-width": 2.5, "stroke-dasharray": "5 5"}));
    else if (i < steps.length - 1)
      svg.appendChild(txt(x + bw + gap / 2, y + bh / 2 + 6, "\u2192", {size: 17, fill: T.tool}));
  });
  return svg;
}

function unequalStrip(){
  const svg = svgRoot("0 0 720 90", "شريط مقسّم إلى أجزاء غير متساوية");

    svg.appendChild(sv("rect", {x: x0 + cuts[i] * w + 2, y: 22, width: (cuts[i + 1] - cuts[i]) * w - 4, height: 50, rx: 6,
      fill: i < 3 ? "url(#sa-hatch)" : T.denSoft, stroke: i < 3 ? T.num : T.den, "stroke-width": 1.5}));

}
function discFraction(n, d, label){
  const svg = svgRoot("0 0 240 240", label || (n + " sur " + d));
  const cx = 120, cy = 120, r = 92;
  svg.appendChild(sv("circle", {cx: cx, cy: cy, r: r, fill: T.unitSoft, stroke: T.unit, "stroke-width": 2}));
  for (let i = 0; i < d; i++){
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / d, a1 = a0 + 2 * Math.PI / d;
    const p = "M" + cx + " " + cy + " L" + (cx + r * Math.cos(a0)) + " " + (cy + r * Math.sin(a0)) +
      " A" + r + " " + r + " 0 " + (2 * Math.PI / d > Math.PI ? 1 : 0) + " 1 " + (cx + r * Math.cos(a1)) + " " + (cy + r * Math.sin(a1)) + " Z";
    svg.appendChild(sv("path", {d: p, fill: i < n ? T.num : T.denSoft,
      stroke: i < n ? T.num : T.den, "stroke-width": 1.6}));
  }
  return svg;
}
function lineWithPoints(max, pts, sub){
  const W = 720, H = 130, x0 = 55, x1 = 660, y = 74;
  const svg = svgRoot("0 0 " + W + " " + H, "droite graduée");
  const uW = (x1 - x0) / max;
  svg.appendChild(sv("line", {x1: x0 - 15, y1: y, x2: x1 + 20, y2: y, stroke: T.unit, "stroke-width": 3.5}));
  for (let u = 0; u <= max; u++){
    svg.appendChild(sv("line", {x1: x0 + u * uW, y1: y - 20, x2: x0 + u * uW, y2: y + 20, stroke: T.ink, "stroke-width": 3}));
    svg.appendChild(txt(x0 + u * uW, y + 42, String(u), {size: 16, mono: true, weight: 800}));
  }
  if (sub) for (let u = 0; u < max; u++) for (let k = 1; k < sub; k++)
    svg.appendChild(sv("line", {x1: x0 + (u + k / sub) * uW, y1: y - 10, x2: x0 + (u + k / sub) * uW, y2: y + 10, stroke: T.den, "stroke-width": 2, opacity: .7}));
  pts.forEach(p => {
    const x = x0 + p.v * uW;
    svg.appendChild(sv("circle", {cx: x, cy: y, r: 11, fill: T.num, stroke: T.white, "stroke-width": 3}));
    svg.appendChild(txt(x, y - 26, p.label, {size: 17, weight: 800, fill: T.num, mono: true}));
  });
  return svg;
}

/* --- l'archipel : une île par module, reliées par une route en pointillés --- */
function renderArchipelago(){
  const W = 340, GAP = 132, n = MODULES.length;
  const pts = MODULES.map((m, i) => ({x: 92 + Math.sin(i * 0.95) * 36, y: 76 + i * GAP}));
  const H = pts[n - 1].y + 92;

  const svg = svgRoot("0 0 " + W + " " + H, "");
  svg.setAttribute("aria-hidden", "true");
  const dPath = pts.map((p, i) => i ? "T" + p.x + " " + p.y : "M" + p.x + " " + p.y)
    .join(" ").replace("M" + pts[0].x + " " + pts[0].y + " T",
      "M" + pts[0].x + " " + pts[0].y + " Q" + pts[0].x + " " + ((pts[0].y + pts[1].y) / 2) + " ");
  svg.appendChild(sv("path", {d: dPath, fill: "none", stroke: "#fff", "stroke-width": 13, "stroke-linecap": "round", opacity: .75}));
  svg.appendChild(sv("path", {d: dPath, fill: "none", stroke: T.den, "stroke-width": 4,
    "stroke-dasharray": "3 13", "stroke-linecap": "round", opacity: .7}));
  for (let i = 0; i < n * 2; i++){
    const x = 24 + ((i * 97) % (W - 48)), y = 40 + ((i * 133) % (H - 60));
    svg.appendChild(sv("path", {d: "M" + x + " " + y + " q6 -5 12 0 t12 0", fill: "none",
      stroke: T.sea, "stroke-width": 2.2, "stroke-linecap": "round", opacity: .45}));
  }

  const path = el("div", {class: "sa-path"}, [svg]);
  const firstUndone = MODULES.findIndex(m => { const st = State.mods[m.id]; return !st || (st.status !== "done" && st.status !== "master"); });

  MODULES.forEach((m, i) => {
    const st = State.get(m.id), p = pts[i];
    const face = st.status === "master" ? "🏆" : st.status === "done" ? "🚩"
      : (i === MODULES.length - 1 ? "🏁" : (m.arc === "محطة استراحة" ? "🗺️" : "🏝️"));
    const b = el("button", {class: "sa-island" + (i === firstUndone ? " here" : ""), type: "button",
      "data-state": st.status,
      style: "left:" + (p.x / W * 100) + "%;top:" + (p.y / H * 100) + "%",
      "aria-label": "الجزيرة " + (i + 1) + " من " + n + " : " + m.title + "، نحو " + m.mins + " دقائق، " +
        ({new: "لم تبدأ", doing: "جارية", done: "منجزة", master: "متقَنة"}[st.status]),
      onclick: () => openModule(m.id)});
    const disc = el("span", {class: "disc", "aria-hidden": "true", text: face});
    disc.style.borderColor = st.status === "done" || st.status === "master" ? T.ok : (ARC_COLOR[m.arc] || T.line);
    b.appendChild(disc);
    b.appendChild(el("div", {class: "txt"}, [
      el("span", {class: "nm", text: m.title}),
      el("span", {class: "mn", text: "≈ " + m.mins + " د" + (st.stars ? "   " + "★".repeat(st.stars) : "")})
    ]));
    path.appendChild(b);
  });

  if (firstUndone >= 0){
    const p = pts[firstUndone];
    path.appendChild(el("div", {class: "sa-boat", "aria-hidden": "true", text: "⛵",
      style: "left:" + ((p.x - 58) / W * 100) + "%;top:" + ((p.y - 4) / H * 100) + "%"}));
  }
  return el("div", {class: "sa-sea"}, [path]);
}


function renderMap(){
  Guide.clear();
  const main = $("#sa-main"); main.innerHTML = "";
  if (window.scrollTo) window.scrollTo({top: 0, behavior: "instant"});
  const wrap = el("div", {class: "sa-wrap"});

  const hero = el("div", {class: "sa-hero"});
  const total = MODULES.reduce((a, m) => a + m.mins, 0);
  hero.appendChild(el("div", {class: "sa-eyebrow", text: "رياضيات · السادس · رحلة مدتها " + total + " دقيقة"}));
  hero.appendChild(el("h1", {html: "أرخبيل <em>الكسور</em>."}));
  hero.appendChild(el("p", {html: "لا نقرأ القاعدة : نصنعها. تقسّم الوحدة، تأخذ أجزاءً، تضع نقاطًا — والقاعدة تظهر من تلقاء نفسها."}));

  const goals = el("ul", {class: "sa-goals", "aria-label": "ما ستتعلمه"});
  [
    "فهم معنى الكسر",
    "التعرّف على البسط والمقام",
    "تمثيل كسر بأجزاء متساوية",
    "فهم العلاقة بين الكسر والقسمة",
    "وضع كسر على مستقيم مدرّج",
    "مقارنة الكسور",
    "التعرّف على الكسور المتكافئة",
    "حساب كسر من كمية",
    "جمع وطرح كسور بسيطة"
  ].forEach(t => goals.appendChild(el("li", {}, [el("span", {class: "ck", "aria-hidden": "true", text: "✓"}), el("span", {text: t})])));
  hero.appendChild(el("p", {style: "font-weight:800;font-size:12px;letter-spacing:.05em;color:#6C34E0;margin-top:20px", text: "ما ستتعلمه"}));
  hero.appendChild(goals);

  const start = el("div", {class: "sa-actions", style: "margin-top:18px"});
  const firstUndone = MODULES.find(m => { const st = State.mods[m.id]; return !st || (st.status !== "done" && st.status !== "master"); }) || MODULES[0];
  const pl = State.place, plMod = pl ? MODULES.find(m => m.id === pl.id) : null;
  if (plMod && pl.step > 0)
    start.appendChild(el("button", {class: "sa-btn primary", type: "button",
      text: "⏵ استئناف : " + plMod.title + " · الخطوة " + (pl.step + 1),
      onclick: () => openModule(plMod.id, pl.step)}));
  start.appendChild(el("button", {class: "sa-btn" + (plMod && pl.step > 0 ? "" : " primary"), type: "button",
    text: (State.xp === 0 ? "⛵ الانطلاق ←" : "⛵ " + firstUndone.title + " ←"),
    onclick: () => openModule(firstUndone.id)}));
  start.appendChild(el("button", {class: "sa-btn ghost", type: "button", text: "مشاهدة التقرير", onclick: renderFinal}));
  hero.appendChild(start);
  wrap.appendChild(hero);

  wrap.appendChild(renderArchipelago());

  const seen = [];
  MODULES.forEach(m => { if (seen.indexOf(m.arc) < 0) seen.push(m.arc); });
  const lg = el("div", {class: "sa-legend-arcs"});
  seen.forEach(arc => lg.appendChild(el("span", {},
    [el("i", {style: "background:" + (ARC_COLOR[arc] || T.line)}), el("span", {text: arc + " — " + (ARC_NOTE[arc] || "")})])));
  wrap.appendChild(lg);

  if (State.xp > 0){
    const reset = el("div", {class: "sa-actions", style: "justify-content:center;margin-top:18px"});
    reset.appendChild(el("button", {class: "sa-btn ghost small", type: "button",
      text: Store.ok ? "↺ مسح تقدّمي" : "↺ البدء من جديد",
      onclick: e => {
        const b = e.currentTarget;
        if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "تأكيد المسح ؟"; return; }
        State.wipe(); renderMap();
      }}));
    wrap.appendChild(reset);
  }
  wrap.appendChild(el("p", {class: "sa-foot",
    html: "رحلة مصمَّمة لتستغرق " + total + " دقيقة، وفق منهج الصف السادس بدقة.<br>" +
      "جمع الكسور، والتبسيط، والضرب ستكون موضوع درس لاحق.<br>" +
      "سمارتر أكاديمي · نموذج مرجعي."}));
  main.appendChild(wrap);
  State.paint();
}

/* =========================================================================
   23. BILAN FINAL  —  carte mentale + relevé des erreurs rencontrées
   ========================================================================= */
function finalMap(){
  const svg = svgRoot("0 0 720 330", "خريطة الكسور");
  const node = (x, y, w, h, label, color, size) => {
    svg.appendChild(sv("rect", {x: x, y: y, width: w, height: h, rx: 10, fill: T.white, stroke: color, "stroke-width": 2}));
    svg.appendChild(txt(x + w / 2, y + h / 2 + 5, label, {size: size || 13, fill: color, weight: 700}));
  };
  const link = (x1, y1, x2, y2) => svg.appendChild(sv("path",
    {d: "M" + x1 + " " + y1 + " C " + x1 + " " + ((y1 + y2) / 2) + ", " + x2 + " " + ((y1 + y2) / 2) + ", " + x2 + " " + y2,
     fill: "none", stroke: T.line, "stroke-width": 2}));
  node(280, 14, 160, 44, "الكسور", T.ink, 15);
  [[60, "أجزاء متساوية", T.num], [290, "قسمة", T.tool], [520, "عدد", T.den]].forEach(c => {
    link(360, 58, c[0] + 70, 96); node(c[0], 96, 140, 40, c[1], c[2], 14);
  });
  const leaves = [
    [20, 176, "البسط", T.num], [150, 176, "المقام", T.num],
    [280, 176, "3 ÷ 4", T.tool], [400, 176, "4 × ؟ = 3", T.tool],
    [530, 176, "مستقيم مدرّج", T.den], [530, 232, "مقارنة · حصر", T.den],
    [280, 232, "1/2 = 2/4 = 3/6", T.tool], [20, 232, "أجزاء مأخوذة", T.num], [150, 232, "2/5 + 1/5", T.ok]
  ];
  leaves.forEach(l => { node(l[0], l[1], 120, 36, l[2], l[3], 11.5); });
  link(130, 136, 80, 176); link(130, 136, 210, 176);
  link(360, 136, 340, 176); link(360, 136, 460, 176);
  link(590, 136, 590, 176); link(590, 212, 590, 232);
  link(340, 212, 340, 232); link(80, 212, 80, 232); link(210, 212, 210, 232);
  svg.appendChild(txt(360, 306, "فكرة رياضية واحدة، بستة أوجه.", {size: 12, fill: T.muted}));
  return svg;
}

function renderFinal(){
  Guide.clear();
  const main = $("#sa-main"); main.innerHTML = "";
  window.scrollTo({top: 0, behavior: "instant"});
  const done = MODULES.filter(m => { const s = State.mods[m.id]; return s && (s.status === "done" || s.status === "master"); });
  const mastered = MODULES.filter(m => { const s = State.mods[m.id]; return s && s.status === "master"; });

  const panel = el("div", {class: "sa-panel"});
  panel.appendChild(el("div", {class: "sa-kicker", text: "تقرير الرحلة"}));
  panel.appendChild(el("h2", {class: "sa-title", text: "ما بنيته"}));
  panel.appendChild(el("p", {class: "sa-lede",
    html: done.length + " جزيرة منجزة من " + MODULES.length +
      " · " + mastered.length + " متقَنة دون خطأ · " + State.xp + " ⭐ · " +
      "أفضل سلسلة 🔥 " + State.best + " · " + Math.round((Date.now() - State.started) / 60000) + " دقيقة عمل."}));
  panel.appendChild(el("div", {class: "sa-mapart"}, [svgBox(finalMap())]));

  const cells = el("div", {class: "sa-final"});
  [["التقسيم", "الكسر هو أجزاء <b>متساوية</b> من وحدة."],
   ["التسمية", "المقام يقسّم، والبسط يلوّن."],
   ["القسمة", "3/4 هي أيضًا 3 ÷ 4 : الناتج الدقيق لعملية تقسيم."],
   ["التموضع", "لكل كسر نقطة محدَّدة على المستقيم المدرّج."],
   ["المقارنة", "أكبر مقام يعطي أصغر الأجزاء."],
   ["إعادة الكتابة", "1/2 = 2/4 = 3/6 : العدد نفسه، كتابات مختلفة. التبسيط تجميع."],
   ["الحساب", "المقام نفسه : نجمع البسطين. 2/5 + 1/5 = 3/5."]
  ].forEach(c => cells.appendChild(el("div", {class: "cell"}, [el("h4", {text: c[0]}), el("p", {html: c[1]})])));
  panel.appendChild(cells);

  const codes = Object.keys(State.errorLog).sort((a, b) => State.errorLog[b] - State.errorLog[a]).slice(0, 3);
  if (codes.length){
    const box = el("div", {style: "margin-top:22px"});
    box.appendChild(el("h3", {style: "font-size:15px;margin-bottom:8px", text: "الأخطاء التي وقعت فيها"}));
    codes.forEach(c => box.appendChild(el("div", {class: "sa-msg note"}, [
      el("span", {class: "ic", text: "▸"}),
      el("div", {}, [el("b", {text: ERRORS[c].t + " · " + State.errorLog[c] + " مرات"}), el("span", {html: ERRORS[c].m})])
    ])));
    panel.appendChild(box);
  } else if (done.length){
    panel.appendChild(Msg.show(panel, "ok", "دون خطأ", "لم تقع في أيّ من الأخطاء الشائعة لهذا الفصل."));
  }

  const acts = el("div", {class: "sa-actions"});
  const sheet = MODULES.filter(m => m.steps.some(x => x.kind === "recap"))[0];
  const exam = MODULES.filter(m => m.steps.some(x => x.kind === "exam"))[0];
  if (sheet) acts.appendChild(el("button", {class: "sa-btn", type: "button", text: "📄 بطاقة مراجعتي",
    onclick: () => openModule(sheet.id)}));
  if (exam) acts.appendChild(el("button", {class: "sa-btn", type: "button", text: "📝 إعادة الاختبار التجريبي",
    onclick: () => { const x = State.get(exam.id); x.miss = 0; x.hits = 0; openModule(exam.id); }}));
  const notMastered = MODULES.filter(m => { const s = State.mods[m.id]; return !s || s.status !== "master"; });
  if (notMastered.length)
    acts.appendChild(el("button", {class: "sa-btn primary", type: "button",
      text: "🏝️ السعي إلى الإتقان : " + notMastered[0].title + " ←",
      onclick: () => { const s = State.get(notMastered[0].id); s.miss = 0; s.hits = 0; openModule(notMastered[0].id); }}));
  acts.appendChild(el("button", {class: "sa-btn ghost", type: "button", text: "🗺️ الأرخبيل", onclick: renderMap}));
  panel.appendChild(acts);
  main.appendChild(el("div", {class: "sa-stage"}, [panel]));
}

/* =========================================================================
   24. DÉMARRAGE
   ========================================================================= */
$("#sa-sound").addEventListener("click", e => {
  Fx.soundOn = !Fx.soundOn;
  e.currentTarget.textContent = Fx.soundOn ? "🔊" : "🔇";
  e.currentTarget.setAttribute("aria-pressed", Fx.soundOn ? "true" : "false");
  e.currentTarget.title = Fx.soundOn ? "كتم الصوت" : "إعادة تفعيل الصوت";
  if (Fx.soundOn) Fx.beep("ok");
});
setInterval(() => State.paintChips(), 20000);
$("#sa-home").addEventListener("click", renderMap);
document.addEventListener("keydown", e => { if (e.key === "Escape") renderMap(); });
MODULES.forEach(m => State.get(m.id));
State.restore();
MODULES.forEach(m => State.get(m.id));
State.paint();
renderMap();
</script>
