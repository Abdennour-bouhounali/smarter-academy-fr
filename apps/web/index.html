  <!-- Les polices ne BLOQUENT PLUS le premier rendu.
       Mesuré avant ce changement : le JavaScript de l'application était prêt à
       61 ms, mais la première peinture n'arrivait qu'à 1024 ms — le navigateur
       attendait cette feuille de style externe (939 ms). La page restait donc
       blanche près d'une seconde pour une raison purement typographique.

       `media="print"` + `onload` : le navigateur télécharge la feuille sans la
       considérer comme bloquante, puis on la rebascule sur `all` dès qu'elle
       est là. `display=swap` (déjà présent dans l'URL) fait afficher le texte
       immédiatement dans la police de repli, puis l'échange — l'identité
       visuelle est conservée, elle arrive juste sans retenir la page.
       <noscript> garde le comportement classique sans JavaScript. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

  </noscript>
