    content="Smarter Academy, la plateforme interactive pour découvrir, comprendre et maîtriser les mathématiques du collège, de la 6e à la 3e." />

  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook / WhatsApp Meta Tags
       Static on purpose: crawlers (WhatsApp, Facebook, LinkedIn, Telegram)
       read this HTML without running React, so these tags must never move
       into JS. The image URL must stay ABSOLUTE and public — the file is
       public/og-image.png, which Vite copies to dist/og-image.png (1200×630,
       256-colour PNG kept under ~300 KB: WhatsApp drops heavier previews). -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://smarter-academy.fr/" />
  <meta property="og:title" content="Smarter Academy" />
  <meta property="og:description"

  <meta property="og:image:height" content="630" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Les polices ne BLOQUENT PLUS le premier rendu.
       Mesuré avant ce changement : le JavaScript de l'application était prêt à
       61 ms, mais la première peinture n'arrivait qu'à 1024 ms — le navigateur
       attendait cette feuille de style externe (939 ms). La page restait donc
       blanche près d'une seconde pour une raison purement typographique.

       `media="print"` + `onload` : le navigateur télécharge la feuille sans la
       considérer comme bloquante, puis on la rebascule sur `all` dès qu'elle
       est là. `display=swap` (déjà présent dans l'URL) fait afficher le texte
       immédiatement dans la police de repli, puis l'échange — l'identité
       visuelle est conservée, elle arrive juste sans retenir la page.
       <noscript> garde le comportement classique sans JavaScript. -->
  <!-- Inter is the text font of the interface and Space Grotesk the display font of the headings
       (tailwind.config.js `fontFamily`, index.css `html` / `h1`-`h6`). No Arabic family is fetched. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <!-- JetBrains Mono À PART, en `display=optional` (2026-10-17) : `font-mono` habille
       beaucoup de petits libellés (fil d'Ariane, étiquettes). Arrivée tardive en `swap`, elle changeait la hauteur de ces
       lignes et faisait descendre la page (CLS 0,25 sur la page d'unité). En
       `optional`, une police pas encore là au premier rendu n'est plus échangée :
       la page garde le repli, la police est en cache pour la suivante. -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=optional" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=optional" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>
