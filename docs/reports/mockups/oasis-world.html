<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم الكسور — أربعة مقترحات</title>
<style>
  :root { --sand:#f3e2bd; --sand2:#e6cf9c; --ink:#1d2a44; --water:#2f7df6; --water2:#9cc8ff; --dry:#c9b48a;
          --palm:#2e9e5b; --palm2:#1f7a45; --clay:#b9743f; --gold:#f5b52e; --bad:#d9534f; --card:#fffaf0; }
  * { box-sizing: border-box; }
  body { margin:0; background:#102043; color:var(--ink); font-family: "Cairo","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif; }
  header { padding:28px 16px 8px; text-align:center; color:#fff; }
  header h1 { margin:0 0 6px; font-size:clamp(1.5rem,4vw,2.4rem); }
  header p { margin:0 auto; max-width:60rem; color:#cfe0ff; line-height:1.8; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:22px; }
  section { background:var(--card); border-radius:22px; padding:16px 16px 10px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  section h2 { margin:0 0 4px; font-size:1.25rem; }
  section p { margin:0 0 10px; line-height:1.8; color:#3a4763; }
  svg { width:100%; height:auto; display:block; border-radius:16px; background:linear-gradient(#bfe3ff 0 38%, var(--sand) 38%); }
  .note { font-size:.92rem; color:#6a5a36; background:#fff3d6; border-radius:12px; padding:8px 12px; margin:8px 0 6px; }
  text { font-family:inherit; font-weight:800; fill:var(--ink); }
  .lbl { font-size:22px; } .small { font-size:17px; fill:#4a5672; } .frac { font-size:30px; }
  .hud { fill:#0f2147; } text.hudt { fill:#fff; font-size:20px; }
</style>
</head>
<body>
<header>
  <h1>عالم الكسور — أربعة مقترحات</h1>
  <p>رسوم أوّلية فقط (ليست لعبة بعد). في كلّ مقترح: الحكاية، حلقة اللعب خطوة خطوة، ما يجعله ممتعًا، وأين يضعف.
     القاعدة واحدة في الأربعة: <b>العالم هو الذي يجيب</b>، لا كلمة «خطأ».</p>
</header>
<main id="main"></main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, kids = []) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); kids.forEach((c) => e.append(c)); return e; };
const txt = (x, y, s, cls = 'lbl', anchor = 'middle') => { const t = el('text', { x, y, class: cls, 'text-anchor': anchor }); t.textContent = s; return t; };
const W = 1000;

/** A palm: trunk and fronds. `state`: ok | dry | flood */
function palm(x, y, s = 1, state = 'ok') {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` });
  const leaf = state === 'dry' ? '#b8a15a' : state === 'flood' ? '#3c8a6a' : '#2e9e5b';
  g.append(el('path', { d: 'M-5 0 Q-9 -40 -3 -78 L5 -78 Q9 -40 6 0Z', fill: '#8a5a2b' }));
  for (const a of [-70, -40, -12, 12, 40, 70]) {
    const droop = state === 'dry' ? 28 : 8;
    g.append(el('path', { d: `M0 -78 Q${a * 0.55} ${-112 + Math.abs(a) * 0.25} ${a} ${-84 + droop}`, stroke: leaf, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }));
  }
  return g;
}
/** A basin with a gauge: `level` 0…1.3 (above 1 it overflows). */
function basin(x, y, level, w = 120, h = 110, marks = 0) {
  const g = el('g');
  g.append(el('rect', { x, y, width: w, height: h, rx: 12, fill: '#e9d7b0', stroke: '#b9743f', 'stroke-width': 5 }));
  const lv = Math.min(level, 1);
  g.append(el('rect', { x: x + 5, y: y + 5 + (h - 10) * (1 - lv), width: w - 10, height: (h - 10) * lv, rx: 8, fill: '#2f7df6', opacity: 0.9 }));
  for (let k = 1; k < marks; k += 1) g.append(el('line', { x1: x + w - 22, x2: x + w - 6, y1: y + 5 + (h - 10) * (1 - k / marks), y2: y + 5 + (h - 10) * (1 - k / marks), stroke: '#1d2a44', 'stroke-width': 3 }));
  if (level > 1) for (const dx of [-14, w + 2]) g.append(el('path', { d: `M${x + dx} ${y + 6} q6 30 0 ${h + 10}`, stroke: '#2f7df6', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }));
  return g;
}
/**
 * A comb « القسرية »: the channel arrives from above, the stone comb splits it into n equal streams; `open` of them are
 * led (blue) to the basin, the others stay closed (dry sand colour).
 */
function comb(x, y, n, open, width = 300, drop = 120) {
  const g = el('g');
  g.append(el('rect', { x: x - 26, y: y - 110, width: 52, height: 110, fill: '#2f7df6' }));
  g.append(el('rect', { x: x - width / 2 - 12, y: y - 8, width: width + 24, height: 30, rx: 8, fill: '#8d8478', stroke: '#5f584f', 'stroke-width': 4 }));
  const step = width / n;
  for (let i = 0; i < n; i += 1) {
    const sx = x - width / 2 + step * (i + 0.5);
    const on = i < open;
    const sw = Math.max(5, Math.min(22, step * 0.45));
    g.append(el('rect', { x: sx - sw / 2, y: y + 22, width: sw, height: drop, fill: on ? '#2f7df6' : '#c9b48a', opacity: on ? 1 : 0.75 }));
    if (!on) g.append(el('rect', { x: sx - sw / 2 - 4, y: y + 22, width: sw + 8, height: 10, rx: 3, fill: '#b9743f' }));
  }
  return g;
}
const fracBadge = (x, y, a, b, col = '#0f2147') => {
  const g = el('g');
  g.append(el('rect', { x: x - 44, y: y - 52, width: 88, height: 104, rx: 16, fill: col }));
  const t1 = txt(x, y - 14, a, 'frac'); t1.style.fill = '#fff';
  const t2 = txt(x, y + 40, b, 'frac'); t2.style.fill = '#fff';
  g.append(el('line', { x1: x - 28, x2: x + 28, y1: y, y2: y, stroke: '#fff', 'stroke-width': 4 }), t1, t2);
  return g;
};
const ground = (h) => [el('rect', { x: 0, y: h * 0.38, width: W, height: h * 0.62, fill: '#f3e2bd' }), el('path', { d: `M0 ${h * 0.38} Q250 ${h * 0.3} 520 ${h * 0.38} T1000 ${h * 0.36} V${h * 0.42} H0Z`, fill: '#e6cf9c' })];
const sun = () => el('circle', { cx: 90, cy: 70, r: 38, fill: '#f5b52e' });

const SCENES = [];

// 1 — the oasis seen whole
SCENES.push({ title: '1 · الواحة: من العين إلى البساتين',
  text: 'ماء الفقّارة يخرج من العين، يمرّ بالمشط الحجري، ثمّ يتوزّع في السواقي على البساتين. التلميذ يتنقّل بين البساتين؛ في كلّ بستان مهمّة.',
  h: 520, draw(s, h) {
    s.append(...ground(h), sun());
    s.append(el('ellipse', { cx: 500, cy: 150, rx: 70, ry: 26, fill: '#2f7df6' }), txt(500, 112, 'العين', 'lbl'));
    s.append(el('rect', { x: 474, y: 160, width: 52, height: 60, fill: '#2f7df6' }));
    s.append(comb(500, 300, 6, 6, 520, 60));
    const gardens = [['بستان الدرجات', 'ok'], ['بستان العنيد', 'ok'], ['بستان الكيس', 'ok'], ['بستان الحساب', 'ok']];
    gardens.forEach(([name], i) => {
      const x = 150 + i * 233;
      s.append(el('rect', { x: x - 95, y: 400, width: 190, height: 96, rx: 18, fill: '#bfe0a8', stroke: '#2e9e5b', 'stroke-width': 4 }));
      s.append(palm(x - 55, 470, 0.75), palm(x + 58, 476, 0.6), basin(x - 26, 420, 0.55, 52, 56));
      s.append(txt(x, 392, name, 'small'));
    });
    s.append(txt(820, 306, 'القسرية (المشط)', 'small'));
    s.append(el('rect', { x: 20, y: 16, width: 330, height: 46, rx: 23, class: 'hud' }), txt(185, 46, 'المهمّة: أعطِ كلّ بستان نصيبه تمامًا', 'hudt'));
  } });

// 2 — a fraction
SCENES.push({ title: '2 · الكسر: كم ساقية من كم',
  text: 'المشط يقسم الماء إلى سواقٍ متساوية (المقام). التلميذ يفتح بعضها نحو الحوض (البسط). الحوض يُظهر الكمّية كمنسوب.',
  h: 460, draw(s, h) {
    s.append(...ground(h), sun());
    s.append(comb(360, 190, 6, 4, 420, 130), basin(240, 342, 4 / 6, 240, 96, 6));
    s.append(fracBadge(760, 210, '4', '6'));
    s.append(txt(760, 300, '4 سواقٍ مفتوحة من 6', 'small'), txt(600, 150, 'مشط من 6 أسنان', 'small'));
    s.append(palm(880, 440, 1.1), palm(640, 446, 0.8));
  } });

// 3 — equal fractions
SCENES.push({ title: '3 · كسران متساويان: الماء نفسه، كتابة أخرى',
  text: 'يشقّ كلّ ساقية إلى اثنتين: 2 من 3 تصير 4 من 6. المنسوب في الحوض لا يتحرّك — هذا ما يراه قبل أن يُسمّى.',
  h: 460, draw(s, h) {
    s.append(...ground(h));
    s.append(comb(250, 190, 3, 2, 330, 130), basin(160, 342, 2 / 3, 180, 96, 3), fracBadge(70, 250, '2', '3'));
    s.append(comb(750, 190, 6, 4, 330, 130), basin(660, 342, 4 / 6, 180, 96, 6), fracBadge(930, 250, '4', '6'));
    s.append(el('line', { x1: 340, x2: 660, y1: 342 + 5 + 86 * (1 / 3), y2: 342 + 5 + 86 * (1 / 3), stroke: '#f5b52e', 'stroke-width': 4, 'stroke-dasharray': '10 8' }));
    s.append(txt(500, 330, 'المنسوب نفسه', 'lbl'), txt(500, 250, '=', 'frac'));
  } });

// 4 — reducing, with a cost
SCENES.push({ title: '4 · الاختزال: مشط أرخص يعطي الماء نفسه',
  text: 'كلّ سنّ في المشط له ثمن. يبحث عن أصغر مشط يعطي المنسوب نفسه: 6 من 8 ← 3 من 4. وإن لم يوجد مشط أصغر، فالكسر غير قابل للاختزال.',
  h: 480, draw(s, h) {
    s.append(...ground(h));
    s.append(comb(250, 200, 8, 6, 340, 120), basin(160, 342, 6 / 8, 180, 96, 8), fracBadge(70, 250, '6', '8'));
    s.append(comb(750, 200, 4, 3, 340, 120), basin(660, 342, 3 / 4, 180, 96, 4), fracBadge(930, 250, '3', '4', '#1f7a45'));
    s.append(el('path', { d: 'M450 250 H560 M540 236 L560 250 L540 264', stroke: '#1d2a44', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }));
    for (const [x, n, col] of [[250, 8, '#d9534f'], [750, 4, '#1f7a45']]) {
      s.append(el('rect', { x: x - 90, y: 60, width: 180, height: 44, rx: 22, fill: '#fff3d6', stroke: col, 'stroke-width': 4 }));
      s.append(txt(x, 90, `ثمن المشط: ${n} قطع`, 'small'));
    }
    s.append(el('line', { x1: 340, x2: 660, y1: 342 + 5 + 86 * (1 / 4), y2: 342 + 5 + 86 * (1 / 4), stroke: '#f5b52e', 'stroke-width': 4, 'stroke-dasharray': '10 8' }));
  } });

// 5 — adding
SCENES.push({ title: '5 · الجمع: ساقيتان تصبّان في حوض واحد',
  text: 'نصيبان يلتقيان في حوض واحد. ليكتب المجموع يجب أن يكون للمشطين عدد الأسنان نفسه: هنا يولد «توحيد المقامات».',
  h: 480, draw(s, h) {
    s.append(...ground(h));
    s.append(comb(240, 170, 4, 1, 280, 90), comb(760, 170, 4, 2, 280, 90));
    s.append(el('path', { d: 'M150 282 Q150 330 430 345', stroke: '#2f7df6', 'stroke-width': 18, fill: 'none' }), el('path', { d: 'M690 282 Q690 330 570 345', stroke: '#2f7df6', 'stroke-width': 30, fill: 'none' }));
    s.append(basin(400, 340, 3 / 4, 200, 110, 4));
    s.append(fracBadge(70, 200, '1', '4'), txt(500, 200, '+', 'frac'), fracBadge(930, 200, '2', '4'), fracBadge(700, 400, '3', '4', '#1f7a45'), txt(630, 410, '=', 'frac'));
  } });

// 6 — the verdict of the world
SCENES.push({ title: '6 · حكم العالم: الماء لا يكذب',
  text: 'لا تظهر كلمة «خطأ». البستان نفسه يجيب: يزدهر إن أخذ نصيبه، يذبل إن نقص، ويغرق إن زاد.',
  h: 440, draw(s, h) {
    s.append(...ground(h), sun());
    [['نصيبه تمامًا', 'ok', 0.66, '#1f7a45', 'يزدهر'], ['أقلّ من نصيبه', 'dry', 0.3, '#b9743f', 'يذبل'], ['أكثر من نصيبه', 'flood', 1.2, '#2f7df6', 'يغرق']].forEach(([cap, st, lv, col, word], i) => {
      const x = 180 + i * 320;
      s.append(el('rect', { x: x - 130, y: 250, width: 260, height: 150, rx: 22, fill: st === 'dry' ? '#e8d6a6' : st === 'flood' ? '#a9cdf5' : '#bfe0a8', stroke: col, 'stroke-width': 5 }));
      s.append(palm(x - 70, 385, 1, st), palm(x + 78, 388, 0.8, st), basin(x - 30, 290, lv, 60, 74));
      s.append(txt(x, 236, cap, 'small'));
      const w = txt(x, 200, word, 'lbl'); w.style.fill = col; s.append(w);
    });
  } });

// every scene so far belongs to proposal A
SCENES.forEach((s) => { s.p = 'A'; });
const box = (x, y, w, h, fill, stroke = 'none', rx = 14, sw = 4) => el('rect', { x, y, width: w, height: h, rx, fill, stroke, 'stroke-width': sw });
const say = (x, y, s, col = null, cls = 'lbl') => { const e = txt(x, y, s, cls); if (col) e.style.fill = col; return e; };
const space = (s, h) => { s.append(box(0, 0, W, h, '#0b1638', 'none', 0)); for (let k = 0; k < 60; k += 1) s.append(el('circle', { cx: (k * 173) % W, cy: (k * 97) % h, r: (k % 3) + 1, fill: '#cfe0ff', opacity: 0.6 })); };
const room = (s, h, wall = '#fbeecf', floor = '#e6cf9c') => s.append(box(0, 0, W, h, wall, 'none', 0), box(0, h * 0.72, W, h * 0.28, floor, 'none', 0));

/** B — an energy cell bar: n cells, k charged. */
function cells(x, y, n, k, w = 300, h = 54, col = '#3ee08a') {
  const g = el('g');
  g.append(box(x - 6, y - 6, w + 12, h + 12, '#16264f', '#7dfcff', 12));
  const cw = w / n;
  for (let i = 0; i < n; i += 1) g.append(box(x + i * cw + 2, y + 2, cw - 4, h - 4, i < k ? col : '#23386e', 'none', 6));
  g.append(box(x + w + 6, y + h / 2 - 10, 10, 20, '#7dfcff', 'none', 3));
  return g;
}
/** B — a module of the station: off | on | low | over */
function module(x, y, state, name) {
  const g = el('g');
  const glow = { on: '#3ee08a', low: '#f5b52e', over: '#ff5a5a', off: '#42507a' }[state];
  g.append(box(x - 80, y - 60, 160, 120, '#1c2c5c', glow, 22, 6), el('circle', { cx: x, cy: y - 8, r: 30, fill: glow, opacity: state === 'off' ? 0.35 : 0.95 }));
  if (state === 'over') for (const a of [-50, 0, 50]) g.append(el('path', { d: `M${x + a} ${y - 78} l8 -22 l-14 8 l8 -22`, stroke: '#ffd166', 'stroke-width': 5, fill: 'none' }));
  g.append(say(x, y + 48, name, '#e9f1ff', 'small'));
  return g;
}
/** C — a tray cut in cols × rows pieces; the first `taken` are served (empty), the rest still on the tray. */
function tray(x, y, cols, rows, taken, w = 260, h = 170) {
  const g = el('g');
  g.append(box(x - 8, y - 8, w + 16, h + 16, '#b9743f', '#8a5a2b', 16));
  const cw = w / cols; const ch = h / rows;
  for (let r = 0; r < rows; r += 1) for (let c = 0; c < cols; c += 1) {
    const i = r * cols + c;
    g.append(box(x + c * cw + 2, y + r * ch + 2, cw - 4, ch - 4, i < taken ? '#f7e7c2' : '#e8a13a', i < taken ? '#d9c08a' : '#b56b12', 5, 2));
    if (i >= taken) g.append(el('circle', { cx: x + c * cw + cw / 2, cy: y + r * ch + ch / 2, r: Math.min(cw, ch) * 0.12, fill: '#7a4a12' }));
  }
  return g;
}
const ticket = (x, y, a, b, mark = '', col = '#1d2a44') => { const g = el('g'); g.append(box(x - 50, y - 70, 100, 140, '#fff', '#c9b48a', 10, 3), fracBadge(x, y - 6, a, b, col)); if (mark) g.append(say(x, y + 62, mark, col, 'small')); return g; };
/** D — a road from 0 to `whole` cut by milestones every 1/n; wells are fractions placed on it. */
function road(x, y, w, n, upto = 1, col = '#8d8478') {
  const g = el('g');
  g.append(box(x, y - 14, w, 28, col, 'none', 14));
  const total = n * upto;
  for (let k = 0; k <= total; k += 1) {
    const mx = x + (w * k) / total;
    g.append(el('rect', { x: mx - 3, y: y - 34, width: 6, height: k % n === 0 ? 68 : 44, fill: '#1d2a44', rx: 2 }));
    if (k % n === 0) g.append(say(mx, y + 62, String(k / n), null, 'lbl'));
  }
  return g;
}
const buggy = (x, y) => el('g', {}, [box(x - 34, y - 34, 68, 30, '#2f7df6', '#0f2147', 10), el('circle', { cx: x - 20, cy: y, r: 11, fill: '#0f2147' }), el('circle', { cx: x + 20, cy: y, r: 11, fill: '#0f2147' }), box(x - 8, y - 52, 22, 20, '#9cc8ff', '#0f2147', 6, 3)]);
const well = (x, y, on = true) => el('g', {}, [box(x - 22, y - 26, 44, 30, on ? '#2f7df6' : '#c9b48a', '#8a5a2b', 8), box(x - 30, y - 34, 60, 10, '#8a5a2b', 'none', 4)]);

// ── B — the orbit station ──
SCENES.push({ p: 'B', title: 'ب-1 · المحطّة مطفأة: وحدة بعد وحدة', text: 'يتنقّل «زيرو» في حلقة المحطّة. كلّ وحدة تطلب شحنة مضبوطة. يحمل بطّارية ويضعها في مقبس الوحدة.', h: 440, draw(s, h) {
  space(s, h); s.append(el('ellipse', { cx: 500, cy: 250, rx: 400, ry: 120, fill: 'none', stroke: '#31457f', 'stroke-width': 26 }));
  [['المختبر', 'on'], ['الدفيئة', 'off'], ['المرصد', 'off'], ['المرسى', 'off']].forEach(([n, st], i) => s.append(module(160 + i * 227, 250, st, n)));
  s.append(box(20, 16, 380, 46, '#0f2147', '#7dfcff', 23, 2), say(210, 46, 'المهمّة: أعِد الضوء إلى المحطّة', '#fff', 'small'));
} });
SCENES.push({ p: 'B', title: 'ب-2 · الكسر: كم خليّة مشحونة من كم', text: 'شريط الطاقة مألوف له من كلّ لعبة. يختار بطّارية (عدد الخلايا)، يشحن بعضها، ثمّ يضغط «شغّل». شقّ كلّ خليّة إلى اثنتين لا يغيّر الشحنة: 2 من 3 = 4 من 6.', h: 420, draw(s, h) {
  space(s, h); s.append(cells(110, 110, 3, 2, 330), fracBadge(520, 138, '2', '3', '#16264f'), cells(110, 250, 6, 4, 330), fracBadge(520, 278, '4', '6', '#16264f'));
  s.append(el('line', { x1: 330, x2: 330, y1: 96, y2: 320, stroke: '#f5b52e', 'stroke-width': 4, 'stroke-dasharray': '10 8' }), say(330, 360, 'الشحنة نفسها', '#f5b52e'));
  s.append(module(820, 210, 'on', 'الدفيئة'), el('line', { x1: 740, x2: 900, y1: 176, y2: 176, stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '6 6' }), say(820, 120, 'علامة الشحنة المطلوبة', '#cfe0ff', 'small'));
} });
SCENES.push({ p: 'B', title: 'ب-3 · حكم العالم', text: 'الشحنة المضبوطة تضيء الوحدة وتفتح الباب التالي. أقلّ: الضوء يرتجف. أكثر: شرر وانقطاع — ويعيد المحاولة فورًا.', h: 380, draw(s, h) {
  space(s, h); [['on', 'تشتغل', '#3ee08a'], ['low', 'ترتجف', '#f5b52e'], ['over', 'تنقطع', '#ff5a5a']].forEach(([st, w, c], i) => { s.append(module(190 + i * 310, 210, st, ''), say(190 + i * 310, 330, w, c)); });
} });

// ── C — the pastry counter ──
SCENES.push({ p: 'C', title: 'ج-1 · دكّان الحلويات: الطلبات تتوالى', text: 'صينية قلب اللوز تُقطَّع قطعًا متساوية. كلّ بطاقة طلب تحمل كسرًا من الصينية. يقطّع، يقدّم، والطابور يتقدّم.', h: 440, draw(s, h) {
